omatik çevirileriyle sevdiğiniz videolardan öğrenin: iki dili yan yana okuyun, her cümleyi tekrar oynatın ve sizin için önemli materyalleri saklayın.","badge":"24 arayüz dili · Çok dilli altyazılar","notice":"Sürüm 0.5.3 · Kaynak kod önizlemesi · Kaynaktan derleyin","labels":{"language":"Belge dili","screenshots":"Ekran görüntüleri","workflow":"Başlarken","features":"Kullanılabilir özellikler","highlights":"Neden yararlı","issues":"Açık sorunlar ve sınırlar","evidence":"Doğrulananlar","readme":"Teknik README","verification":"Ayrıntılı doğrulama kaydı","markdown":"Bu kılavuzu Markdown olarak indirin","preview":"Büyütmek için ekran görüntüsüne tıklayın","close":"Kapat","previous":"Önceki ekran görüntüsü","next":"Sonraki ekran görüntüsü","priority":"Öncelik","category":"Tür","issue":"Sorun / sonraki adım","languageScope":"24, arayüzdeki dil seçeneği sayısıdır. Altyazı dilleri, seçilen videonun mevcut parçalarına bağlıdır; 24 dilde akıcılık vaadi değildir.","screenshotScope":"Ekran görüntüleri gerçek 0.5.3 uygulamasından alınmıştır. Görüntüdeki arayüz dili, bu belgenin dilinden ayrı olarak belirtilir.","fallbackScreenshot":"İngilizce uygulama ekran görüntüsü","localizedScreenshot":"Bu dilde uygulama ekran görüntüsü","license":"Uygulama MIT lisanslıdır; üçüncü taraf bileşenlerin bildirimleri korunur. AxonTube'un YouTube, Google veya Apple ile bağlantısı yoktur.","updated":"Belge tarihi: 2026-10-11"},"steps":[{"title":"1. YouTube'u açın","body":"Bir video bağlantısı yapıştırın. Mevcut altyazılar otomatik olarak istenir; ilk dil İngilizce, ikinci dil Geleneksel Çincedir. İlk alım yaklaşık 1–2 dakika sürebilir; kullanılabilirlik garanti edilmez."},{"title":"2. Seçin ve pratik yapın","body":"Görünen iki altyazı açılır menüsünü kullanın. Bir cümleye gitmek için tıklayın, cümleyi tekrar oynatın veya cümle döngüsünü etkinleştirin."},{"title":"3. Kaydedin veya dışa aktarın","body":"Videoyu Kaydet, erişilebilen medya ve mevcut altyazılar için bir klasör seçmenizi sağlar. İki Dilli Altyazıları Dışa Aktar, yüklenen altyazılardan Word, TXT veya SRT oluşturur."},{"title":"4. Kendinize göre ayarlayın","body":"Arayüz dilini, oynatma hızını, altyazı boyutunu ve her parçanın zaman kaymasını değiştirin. Uygulama, arayüz ve altyazı dili seçimlerini hatırlar."}],"features":[{"title":"İki bağımsız altyazı parçası","body":"Varsayılanlar İngilizce ve Geleneksel Çincedir; mevcut videonun özgün altyazıları ve otomatik çevirileri arasından seçim yapın. İkinci parça başarısız olursa başarıyla alınan ilk parça kullanılabilir durumda kalır."},{"title":"Cümle odaklı pratik","body":"Cümle arama, tıklayarak ilgili zamana gitme, önceki / sonraki cümle, tekrar oynatma, döngü, oynatma hızı ve geçerli cümleyi takip etme."},{"title":"Eşzamanlı altyazılarla video","body":"Altyazılar yüklenirken kaydetme kullanılabilir kalır. Her işlem, erişilebilen videoyu içeren yeni bir klasör oluşturur; altyazı varsa zamanlanmış SRT parçaları ve iki dilli okuma dosyaları eklenir. Altyazısız video kaydetme de desteklenir. Tamamlanmamış işler .partial klasöründe kalır."},{"title":"Word, TXT ve SRT dışa aktarımı","body":"Mevcut altyazıları zaman kaymaları uygulanmış olarak dışa aktarın. Word ve TXT, metinleri zaman aralıklarının örtüşmesine göre eşleştirir. Yalnızca bir parça yüklenmişse onun içeriği yine de dışa aktarılabilir."},{"title":"24 dilde yerelleştirilmiş arayüz","body":"Menüler, durum mesajları ve öğrenme sloganı birlikte dil değiştirir. Arapça ve İbranice, sağdan sola düzenleri destekler; arayüz dilini değiştirmek altyazı içeriğini değiştirmez."},{"title":"Yerel oynatma ve anlaşılır kontroller","body":"Yerel medya ve altyazı dosyalarını Dosya menüsünden açın. Kullanılamayan işlemler nedenleriyle birlikte soluk gösterilir; seçili modlar vurgulanır ve onay işaretleriyle belirtilir; kaydetme sırasında meşgul durumu gösterilir."}],"highlights":[{"title":"İzlemeden pratiğe kısa bir yol","body":"Araç çubuğundaki dört işlem ana akışı basit tutar: YouTube → Videoyu Kaydet → Altyazılar → Dil. Altyazı almak için ek bir düğme gerekmez."},{"title":"Saklayabileceğiniz öğrenme materyalleri","body":"Zamanlanmış altyazılar ve okunabilir Word / TXT dosyaları hem dinleme pratiğini hem de sonradan tekrarı destekler. Dışa aktarımlar yeni hedeflere yazılır ve özgün dosyalar korunur."},{"title":"Yerel çalışma, yapay zekâ API anahtarı gerekmez","body":"Yerel medya ve kaydedilmiş altyazılar çevrimdışı çalışır. Web sitesi altyazılarını ve otomatik çevirileri YouTube sağlar; uygulama telemetri toplamaz, yerel medyayı yüklemez ve ücretli yapay zekâ API anahtarı istemez."}],"issues":[{"priority":"P0","category":"Canlı hizmet doğrulaması","title":"YouTube altyazılarının ve videolarının kullanılabilirliği","body":"En son canlı kontrolde YouTube'un oturum açma / bot doğrulama gereksinimiyle karşılaşıldı. Mevcut koşullarda çevrimiçi indirmelerin başarılı olduğu doğrulanmadı. Genel yayımdan önce hedeflenen ağda ve temsili videolar üzerinde doğrulama yapılmalıdır."},{"priority":"P1","category":"Platform kısıtlaması","title":"Gömülü oynatma ve hesapla kısıtlanan videolar","body":"Bazı içerik üreticileri veya videolar gömülü oynatmaya izin vermez. Uygulama içinde Google SSO uygulanmamıştır; tarayıcı kısayolu ayrı bir giriş ve oynatma oturumu kullanır. Bu kısıtlamalar çözülmüş gibi sunulamaz."},{"priority":"P1","category":"Dağıtım ve uyumluluk","title":"İmzalama ve daha fazla Mac üzerinde test","body":"Paket, Developer ID noter onayı olmadan ad-hoc imzalıdır. macOS 26.5.2 üzerinde Apple Silicon test edildi; macOS 27 ve Intel Mac'ler test edilmedi. macOS 14 bir dağıtım hedefidir; her sürümün test edildiğinin kanıtı değildir."},{"priority":"P2","category":"Biçim ve kalite sınırları","title":"İndirme kalitesi ve altyazı doğruluğu","body":"Kaydetme, ses ve videoyu birlikte içeren tam bir akış kullanır; ayrı yüksek çözünürlüklü akışları birleştirmez. Yerel oynatma, kodek desteğine bağlıdır. İsteğe bağlı FFmpeg dönüştürmesinde ek ses parçaları, HDR ve gömülü altyazılar korunmayabilir. ASS/SSA içe aktarımı yalnızca metni alır. Otomatik altyazılar, çeviriler ve zamana dayalı iki dilli eşleştirme hatalar içerebilir."},{"priority":"P2","category":"Uygulanmadı","title":"Öğrenme geçmişi ve çalışma araçları","body":"Oynatma geçmişini geri yükleme, sözcük koleksiyonları, aralıklı tekrar, OCR ve görüntü altyazılarını çıkarma uygulanmamıştır. Kaydedilen dil tercihleri, öğrenme ilerlemesinin kaydedildiği anlamına gelmez."},{"priority":"P2","category":"Editöryal inceleme","title":"Ana dili konuşan kişilerce dil incelemesi","body":"24 arayüz dili seçeneğinin ve yerelleştirilmiş sloganların tamamı dil değiştirme kontrollerini geçti. Bu, kapsamı ve davranışı doğrular; her çevirinin ana dili konuşan kişilerce profesyonel olarak incelendiğini göstermez."}],"gallery":[{"id":"home","title":"Karşılama ve ana iş akışı","caption":"Video açılmadan önce araç çubuğundaki dört işlem, görünen iki altyazı seçicisi, yerelleştirilmiş slogan ve açıkça gösterilen devre dışı durum."},{"id":"study","title":"Cümle odaklı pratik","caption":"demo.mp4 — Cümle arama, tıklayarak ilgili zamana gitme, önceki / sonraki cümle, tekrar oynatma, döngü, oynatma hızı ve geçerli cümleyi takip etme."},{"id":"languages","title":"Birinci ve ikinci altyazı","caption":"Varsayılan olarak İngilizce ve Geleneksel Çince seçili olan bağımsız altyazı açılır menülerinin gerçek İngilizce arayüz görüntüsü."},{"id":"youtube","title":"YouTube bağlantısı açma","caption":"Bağlantı iletişim kutusunun gerçek İngilizce arayüz görüntüsü. Bir bağlantı açıldığında oynatma başlar ve seçilen altyazı çifti istenir."}],"evidenceSummary":"0.5.3 için 105 çekirdek kontrolü, 138 model doğrulaması, 29 altyazı kontrolü, 60 video kaydetme kontrolü ve 317 yerel arayüz doğrulaması geçti. Gerçek menüde 24 dil seçeneğinin tamamı seçildi; altı arayüz dili ve Almanca dar düzenler incelendi.","evidenceLimit":"Yerel oynatma, dışa aktarımlar, durum geçişleri ve yerel kaydetme iletişim kutuları doğrulandı. Çevrimdışı test verileri ve sahte yardımcıyla yapılan kaydetme testleri, YouTube'un şu anda çevrimiçi altyazı veya video indirmeye izin verdiğini kanıtlamaz. Kullanıcı kimlik bilgileri içe aktarılmadı."},"vi":{"lang":"vi","name":"Tiếng Việt","direction":"ltr","headline":"Học các ngôn ngữ trên thế giới nhanh hơn cùng AI.","intro":"Biến YouTube thành lớp học ngôn ngữ của riêng bạn. Dùng phụ đề và bản dịch tự động của YouTube để học qua những video bạn yêu thích: đọc song song hai ngôn ngữ, phát lại từng câu và lưu giữ tài liệu hữu ích.","badge":"24 ngôn ngữ giao diện · Phụ đề đa ngôn ngữ","notice":"Phiên bản 0.5.3 · Bản xem trước mã nguồn · Biên dịch từ mã nguồn","labels":{"language":"Ngôn ngữ tài liệu","screenshots":"Ảnh chụp màn hình","workflow":"Bắt đầu sử dụng","features":"Tính năng hiện có","highlights":"Lợi ích","issues":"Vấn đề còn tồn tại và giới hạn","evidence":"Những gì đã được xác minh","readme":"README kỹ thuật","verification":"Bản ghi xác minh chi tiết","markdown":"Tải hướng dẫn này dưới dạng Markdown","preview":"Nhấp vào ảnh chụp để phóng to","close":"Đóng","previous":"Ảnh chụp trước","next":"Ảnh chụp tiếp theo","priority":"Ưu tiên","category":"Loại","issue":"Vấn đề / bước tiếp theo","languageScope":"24 là số lựa chọn ngôn ngữ giao diện. Ngôn ngữ phụ đề phụ thuộc vào các luồng có sẵn của video đã chọn; đây không phải lời hứa giúp bạn thông thạo 24 ngôn ngữ.","screenshotScope":"Ảnh được chụp từ ứng dụng 0.5.3 thực tế. Ngôn ngữ giao diện trong ảnh được ghi riêng với ngôn ngữ của tài liệu này.","fallbackScreenshot":"Ảnh ứng dụng với giao diện tiếng Anh","localizedScreenshot":"Ảnh ứng dụng bằng ngôn ngữ này","license":"Ứng dụng dùng giấy phép MIT; các thành phần bên thứ ba giữ nguyên thông báo của mình. AxonTube không có quan hệ liên kết với YouTube, Google hay Apple.","updated":"Ngày tài liệu: 2026-10-11"},"steps":[{"title":"1. Mở YouTube","body":"Dán liên kết video. Phụ đề có sẵn được yêu cầu tự động, với tiếng Anh ở luồng thứ nhất và tiếng Trung phồn thể ở luồng thứ hai. Lần lấy đầu tiên có thể mất khoảng 1–2 phút; không bảo đảm luôn có phụ đề."},{"title":"2. Chọn và luyện tập","body":"Dùng hai danh sách chọn phụ đề đang hiển thị. Nhấp vào một câu để chuyển đến câu đó, phát lại hoặc bật lặp câu."},{"title":"3. Lưu hoặc xuất","body":"Lưu video cho phép chọn thư mục chứa nội dung truy cập được và phụ đề có sẵn. Xuất phụ đề song ngữ tạo tệp Word, TXT hoặc SRT từ phụ đề đã tải."},{"title":"4. Tùy chỉnh theo ý bạn","body":"Thay đổi ngôn ngữ giao diện, tốc độ phát, cỡ phụ đề và độ lệch thời gian của từng luồng. Ứng dụng ghi nhớ lựa chọn ngôn ngữ giao diện và phụ đề."}],"features":[{"title":"Hai luồng phụ đề độc lập","body":"Mặc định là tiếng Anh và tiếng Trung phồn thể; chọn trong các bản gốc và bản dịch tự động có sẵn của video hiện tại. Phụ đề luồng thứ nhất đã lấy thành công vẫn dùng được nếu luồng thứ hai thất bại."},{"title":"Luyện tập theo từng câu","body":"Tìm câu, nhấp để chuyển đến thời điểm tương ứng, câu trước / sau, phát lại, lặp, điều chỉnh tốc độ phát và theo dõi câu hiện tại."},{"title":"Video kèm phụ đề đồng bộ","body":"Vẫn có thể lưu trong khi phụ đề đang tải. Mỗi thao tác tạo một thư mục mới chứa video truy cập được; nếu có phụ đề, các luồng SRT kèm mốc thời gian và tệp đọc song ngữ sẽ được thêm vào. Cũng hỗ trợ lưu video không kèm phụ đề. Phần chưa hoàn tất nằm trong thư mục .partial."},{"title":"Xuất Word, TXT và SRT","body":"Xuất phụ đề có sẵn sau khi áp dụng độ lệch thời gian. Word và TXT ghép văn bản theo phần giao nhau của khoảng thời gian. Nếu chỉ tải được một luồng, vẫn có thể xuất nội dung của luồng đó."},{"title":"Giao diện được bản địa hóa sang 24 ngôn ngữ","body":"Menu, thông báo trạng thái và khẩu hiệu học tập cùng chuyển ngôn ngữ. Tiếng Ả Rập và tiếng Do Thái hỗ trợ bố cục từ phải sang trái; đổi ngôn ngữ giao diện không làm thay đổi nội dung phụ đề."},{"title":"Phát tệp cục bộ và điều khiển rõ ràng","body":"Mở tệp nội dung và phụ đề cục bộ từ menu Tệp. Thao tác bị vô hiệu hóa được làm mờ kèm lý do; chế độ đã chọn được tô nổi và đánh dấu; quá trình lưu hiển thị trạng thái đang xử lý."}],"highlights":[{"title":"Từ xem đến luyện tập chỉ vài bước","body":"Bốn thao tác trên thanh công cụ giữ luồng chính đơn giản: YouTube → Lưu video → Phụ đề → Ngôn ngữ. Không cần thêm nút lấy phụ đề."},{"title":"Tài liệu học có thể giữ lại","body":"Phụ đề có mốc thời gian và tệp Word / TXT dễ đọc hỗ trợ cả luyện nghe lẫn ôn tập sau này. Các bản xuất dùng vị trí lưu mới và giữ nguyên tệp gốc."},{"title":"Làm việc cục bộ, không cần khóa API AI","body":"Nội dung cục bộ và phụ đề đã lưu hoạt động ngoại tuyến. YouTube cung cấp phụ đề trang web và bản dịch tự động; ứng dụng không thu thập dữ liệu đo từ xa, không tải nội dung cục bộ lên và không yêu cầu khóa API AI trả phí."}],"issues":[{"priority":"P0","category":"Xác minh dịch vụ trực tiếp","title":"Khả năng truy cập phụ đề và video YouTube","body":"Lần kiểm tra trực tiếp gần nhất gặp yêu cầu đăng nhập / xác minh chống bot của YouTube. Chưa xác nhận được việc tải trực tuyến thành công trong điều kiện hiện tại. Cần xác minh trên mạng dự kiến sử dụng và với các video đại diện trước khi phát hành công khai."},{"priority":"P1","category":"Hạn chế của nền tảng","title":"Nhúng video và video bị giới hạn theo tài khoản","body":"Một số nhà sáng tạo hoặc video không cho phép phát nhúng. Chưa triển khai Google SSO trong ứng dụng; lối tắt mở trình duyệt dùng phiên đăng nhập và phát riêng. Không thể trình bày các hạn chế này như đã được giải quyết."},{"priority":"P1","category":"Phân phối và tương thích","title":"Ký ứng dụng và kiểm thử trên nhiều máy Mac hơn","body":"Gói được ký ad-hoc, chưa có công chứng Developer ID. Đã kiểm thử Apple Silicon trên macOS 26.5.2; chưa kiểm thử macOS 27 và máy Mac dùng Intel. macOS 14 là phiên bản triển khai tối thiểu mục tiêu, không phải bằng chứng đã kiểm thử mọi phiên bản."},{"priority":"P2","category":"Giới hạn định dạng và chất lượng","title":"Chất lượng tải xuống và độ chính xác của phụ đề","body":"Việc lưu dùng một luồng đầy đủ gồm cả âm thanh và hình ảnh, không ghép các luồng độ phân giải cao riêng biệt. Phát cục bộ phụ thuộc vào khả năng hỗ trợ codec. Chuyển đổi tùy chọn bằng FFmpeg có thể không giữ lại các luồng âm thanh bổ sung, HDR và phụ đề nhúng. Nhập ASS/SSA chỉ lấy văn bản. Phụ đề tự động, bản dịch và cách ghép song ngữ dựa trên thời gian có thể có lỗi."},{"priority":"P2","category":"Chưa triển khai","title":"Lịch sử học và công cụ học tập","body":"Chưa triển khai khôi phục lịch sử phát, bộ sưu tập từ vựng, ôn tập ngắt quãng, OCR và trích xuất phụ đề dạng ảnh. Lưu lựa chọn ngôn ngữ không có nghĩa là lưu tiến độ học."},{"priority":"P2","category":"Rà soát biên tập","title":"Rà soát ngôn ngữ bởi người bản ngữ","body":"Cả 24 lựa chọn ngôn ngữ giao diện và khẩu hiệu được bản địa hóa đã vượt qua kiểm tra chuyển đổi. Điều đó xác nhận phạm vi hỗ trợ và hành vi, không phải việc mọi bản dịch đã được người bản ngữ rà soát chuyên nghiệp."}],"gallery":[{"id":"home","title":"Chào mừng và luồng thao tác chính","caption":"Bốn thao tác trên thanh công cụ, hai bộ chọn phụ đề hiển thị rõ, khẩu hiệu được bản địa hóa và trạng thái vô hiệu hóa rõ ràng trước khi mở video."},{"id":"study","title":"Luyện tập theo từng câu","caption":"demo.mp4 — Tìm câu, nhấp để chuyển đến thời điểm tương ứng, câu trước / sau, phát lại, lặp, điều chỉnh tốc độ phát và theo dõi câu hiện tại."},{"id":"languages","title":"Phụ đề thứ nhất và thứ hai","caption":"Ảnh chụp thực tế giao diện tiếng Anh với hai danh sách chọn phụ đề độc lập, mặc định là tiếng Anh và tiếng Trung phồn thể."},{"id":"youtube","title":"Mở liên kết YouTube","caption":"Ảnh chụp thực tế hộp thoại liên kết trong giao diện tiếng Anh. Mở liên kết sẽ bắt đầu phát và yêu cầu cặp phụ đề đã chọn."}],"evidenceSummary":"Với 0.5.3: đã vượt qua 105 kiểm tra lõi, 138 phép kiểm chứng mô hình, 29 kiểm tra phụ đề, 60 kiểm tra lưu video và 317 phép kiểm chứng giao diện gốc. Cả 24 ngôn ngữ đã được chọn trong menu thực tế; đã rà soát giao diện ở sáu ngôn ngữ và bố cục thu gọn bằng tiếng Đức.","evidenceLimit":"Đã xác minh phát cục bộ, xuất tệp, chuyển trạng thái và hộp thoại lưu gốc. Dữ liệu kiểm thử ngoại tuyến và các bài kiểm thử lưu bằng công cụ trợ giúp giả lập không chứng minh YouTube hiện cho phép tải phụ đề hoặc video trực tuyến. Không nhập thông tin xác thực của người dùng."},"th":{"lang":"th","name":"ไทย","direction":"ltr","headline":"เรียนภาษาทั่วโลกได้เร็วขึ้นด้วย AI","intro":"เปลี่ยน YouTube ให้เป็นห้องเรียนภาษาส่วนตัวของคุณ ใช้คำบรรยายและคำแปลอัตโนมัติจาก YouTube เพื่อเรียนรู้ผ่านวิดีโอที่คุณชอบ อ่านสองภาษาเทียบกัน เล่นซ้ำทีละประโยค และเก็บเนื้อหาที่สำคัญกับคุณไว้","badge":"อินเทอร์เฟซ 24 ภาษา · คำบรรยายหลายภาษา","notice":"เวอร์ชัน 0.5.3 · ซอร์สโค้ดรุ่นทดลอง · บิลด์จากซอร์สโค้ด","labels":{"language":"ภาษาของเอกสาร","screenshots":"ภาพหน้าจอ","workflow":"เริ่มต้นใช้งาน","features":"ฟีเจอร์ที่มี","highlights":"ประโยชน์ในการใช้งาน","issues":"ปัญหาและข้อจำกัดที่ยังคงมี","evidence":"สิ่งที่ตรวจสอบแล้ว","readme":"README ทางเทคนิค","verification":"บันทึกการตรวจสอบโดยละเอียด","markdown":"ดาวน์โหลดคู่มือนี้ในรูปแบบ Markdown","preview":"คลิกภาพหน้าจอเพื่อขยาย","close":"ปิด","previous":"ภาพหน้าจอก่อนหน้า","next":"ภาพหน้าจอถัดไป","priority":"ลำดับความสำคัญ","category":"ประเภท","issue":"ปัญหา / ขั้นตอนถัดไป","languageScope":"24 คือจำนวนภาษาที่เลือกได้สำหรับอินเทอร์เฟซ ภาษาของคำบรรยายขึ้นอยู่กับแทร็กที่มีในวิดีโอที่เลือก ไม่ใช่คำรับรองว่าจะใช้ทั้ง 24 ภาษาได้อย่างคล่องแคล่ว","screenshotScope":"ภาพหน้าจอมาจากแอปเวอร์ชัน 0.5.3 ที่ใช้งานจริง ภาษาของอินเทอร์เฟซในภาพระบุแยกจากภาษาของเอกสารนี้","fallbackScreenshot":"ภาพหน้าจอแอปที่ใช้อินเทอร์เฟซภาษาอังกฤษ","localizedScreenshot":"ภาพหน้าจอแอปในภาษานี้","license":"แอปใช้สัญญาอนุญาต MIT ส่วนประกอบของบุคคลที่สามยังคงประกาศของตนไว้ AxonTube ไม่มีความเกี่ยวข้องกับ YouTube, Google หรือ Apple","updated":"วันที่ของเอกสาร: 2026-10-11"},"steps":[{"title":"1. เปิด YouTube","body":"วางลิงก์วิดีโอ แอปจะขอคำบรรยายที่มีให้อัตโนมัติ โดยแทร็กแรกเป็นภาษาอังกฤษและแทร็กที่สองเป็นภาษาจีนตัวเต็ม การดึงครั้งแรกอาจใช้เวลาประมาณ 1–2 นาที และไม่รับประกันว่าจะมีคำบรรยายให้ใช้"},{"title":"2. เลือกและฝึกฝน","body":"ใช้เมนูคำบรรยายแบบเลื่อนลงทั้งสองที่แสดงอยู่ คลิกประโยคเพื่อข้ามไปยังประโยคนั้น เล่นซ้ำ หรือเปิดการวนซ้ำประโยค"},{"title":"3. บันทึกหรือส่งออก","body":"บันทึกวิดีโอ ให้เลือกโฟลเดอร์สำหรับสื่อที่เข้าถึงได้และคำบรรยายที่มี ส่วน ส่งออกคำบรรยายสองภาษา จะสร้างไฟล์ Word, TXT หรือ SRT จากคำบรรยายที่โหลดแล้ว"},{"title":"4. ปรับให้เหมาะกับคุณ","body":"เปลี่ยนภาษาอินเทอร์เฟซ ความเร็วการเล่น ขนาดคำบรรยาย และค่าชดเชยเวลาของแต่ละแทร็ก แอปจะจำภาษาอินเทอร์เฟซและภาษาคำบรรยายที่เลือกไว้"}],"features":[{"title":"คำบรรยายสองแทร็กที่เลือกได้อย่างอิสระ","body":"ค่าเริ่มต้นคือภาษาอังกฤษและภาษาจีนตัวเต็ม เลือกได้จากคำบรรยายต้นฉบับและคำแปลอัตโนมัติที่มีในวิดีโอปัจจุบัน หากแทร็กที่สองล้มเหลว คำบรรยายแทร็กแรกที่โหลดสำเร็จจะยังใช้งานได้"},{"title":"ฝึกฝนโดยเน้นทีละประโยค","body":"ค้นหาประโยค คลิกเพื่อข้ามไปยังเวลานั้น ไปประโยคก่อนหน้า / ถัดไป เล่นซ้ำ วนซ้ำ ปรับความเร็ว และติดตามประโยคที่กำลังเล่น"},{"title":"วิดีโอพร้อมคำบรรยายที่ตรงเวลา","body":"ยังบันทึกได้ระหว่างโหลดคำบรรยาย แต่ละรายการจะสร้างโฟลเดอร์ใหม่พร้อมวิดีโอที่เข้าถึงได้ หากมีคำบรรยาย จะเพิ่มแทร็ก SRT พร้อมเวลาและไฟล์อ่านสองภาษา รองรับการบันทึกวิดีโอโดยไม่มีคำบรรยายด้วย งานที่ยังไม่เสร็จจะอยู่ในโฟลเดอร์ .partial"},{"title":"ส่งออก Word, TXT และ SRT","body":"ส่งออกคำบรรยายที่มีโดยใช้ค่าชดเชยเวลาที่ตั้งไว้ Word และ TXT จับคู่ข้อความตามช่วงเวลาที่ซ้อนกัน หากโหลดไว้เพียงแทร็กเดียว ก็ยังส่งออกเนื้อหาของแทร็กนั้นได้"},{"title":"อินเทอร์เฟซที่แปลเป็น 24 ภาษา","body":"เมนู ข้อความสถานะ และคำขวัญการเรียนรู้เปลี่ยนภาษาไปพร้อมกัน ภาษาอาหรับและฮีบรูรองรับการจัดวางจากขวาไปซ้าย การเปลี่ยนภาษาอินเทอร์เฟซไม่เปลี่ยนเนื้อหาคำบรรยาย"},{"title":"เล่นไฟล์ในเครื่องและควบคุมได้ชัดเจน","body":"เปิดไฟล์สื่อและคำบรรยายในเครื่องจากเมนูไฟล์ การทำงานที่ใช้ไม่ได้จะแสดงจางลงพร้อมเหตุผล โหมดที่เลือกมีสีเน้นและเครื่องหมายถูก และขณะบันทึกจะแสดงสถานะกำลังทำงาน"}],"highlights":[{"title":"จากการรับชมสู่การฝึกฝนในไม่กี่ขั้นตอน","body":"สี่คำสั่งบนแถบเครื่องมือทำให้ขั้นตอนหลักตรงไปตรงมา: YouTube → บันทึกวิดีโอ → คำบรรยาย → ภาษา ไม่ต้องมีปุ่มดึงคำบรรยายเพิ่มเติม"},{"title":"สื่อการเรียนที่เก็บไว้ได้","body":"คำบรรยายพร้อมเวลาและไฟล์ Word / TXT ที่อ่านสะดวกช่วยทั้งฝึกฟังและทบทวนภายหลัง การส่งออกใช้ปลายทางใหม่และเก็บไฟล์ต้นฉบับไว้"},{"title":"ทำงานในเครื่อง ไม่ต้องใช้คีย์ API ของ AI","body":"สื่อในเครื่องและคำบรรยายที่บันทึกไว้ใช้งานออฟไลน์ได้ YouTube เป็นผู้ให้คำบรรยายเว็บไซต์และคำแปลอัตโนมัติ แอปไม่เก็บข้อมูลการใช้งานแบบเทเลเมทรี ไม่อัปโหลดสื่อในเครื่อง และไม่ต้องใช้คีย์ API ของ AI แบบเสียเงิน"}],"issues":[{"priority":"P0","category":"การตรวจสอบบริการจริง","title":"ความพร้อมใช้งานของคำบรรยายและวิดีโอ YouTube","body":"การตรวจสอบกับบริการจริงล่าสุดพบข้อกำหนดของ YouTube ให้ลงชื่อเข้าใช้ / ยืนยันว่าไม่ใช่บอต ยังยืนยันไม่ได้ว่าดาวน์โหลดออนไลน์สำเร็จในสภาพปัจจุบัน ต้องตรวจสอบบนเครือข่ายที่จะใช้งานจริงและวิดีโอตัวอย่างที่ครอบคลุมก่อนเผยแพร่สู่สาธารณะ"},{"priority":"P1","category":"ข้อจำกัดของแพลตฟอร์ม","title":"การฝังวิดีโอและวิดีโอที่จำกัดตามบัญชี","body":"ผู้สร้างหรือวิดีโอบางรายการไม่อนุญาตให้เล่นแบบฝัง ยังไม่มี Google SSO ภายในแอป ทางลัดไปเบราว์เซอร์ใช้เซสชันการลงชื่อเข้าใช้และการเล่นแยกต่างหาก จึงไม่อาจนำเสนอว่าข้อจำกัดเหล่านี้ได้รับการแก้ไขแล้ว"},{"priority":"P1","category":"การแจกจ่ายและความเข้ากันได้","title":"การลงนามและทดสอบบน Mac เพิ่มเติม","body":"แพ็กเกจลงนามแบบ ad-hoc โดยไม่มีการรับรอง notarization ด้วย Developer ID ทดสอบ Apple Silicon บน macOS 26.5.2 แล้ว แต่ยังไม่ได้ทดสอบ macOS 27 และ Mac ที่ใช้ Intel ส่วน macOS 14 เป็นเวอร์ชันขั้นต่ำเป้าหมาย ไม่ใช่หลักฐานว่าทดสอบครบทุกเวอร์ชัน"},{"priority":"P2","category":"ข้อจำกัดด้านรูปแบบและคุณภาพ","title":"คุณภาพการดาวน์โหลดและความแม่นยำของคำบรรยาย","body":"การบันทึกใช้สตรีมที่มีทั้งเสียงและวิดีโอครบถ้วน โดยไม่รวมสตรีมความละเอียดสูงที่แยกกัน การเล่นในเครื่องขึ้นอยู่กับการรองรับตัวแปลงสัญญาณ หากเลือกแปลงด้วย FFmpeg อาจไม่เก็บแทร็กเสียงเพิ่มเติม HDR และคำบรรยายที่ฝังไว้ การนำเข้า ASS/SSA จะนำเข้าเฉพาะข้อความ คำบรรยายอัตโนมัติ คำแปล และการจับคู่สองภาษาตามเวลาอาจมีข้อผิดพลาด"},{"priority":"P2","category":"ยังไม่ได้พัฒนา","title":"ประวัติการเรียนและเครื่องมือช่วยเรียน","body":"ยังไม่มีการคืนค่าประวัติการเล่น คลังคำศัพท์ การทบทวนแบบเว้นระยะ OCR และการดึงคำบรรยายจากภาพ การบันทึกภาษาที่เลือกไม่ใช่การบันทึกความคืบหน้าการเรียน"},{"priority":"P2","category":"การตรวจทานเนื้อหา","title":"การตรวจทานภาษาโดยเจ้าของภาษา","body":"ตัวเลือกภาษาอินเทอร์เฟซทั้ง 24 ภาษาและคำขวัญที่แปลแล้วผ่านการตรวจสอบการสลับภาษา ซึ่งยืนยันขอบเขตที่ครอบคลุมและพฤติกรรมการทำงาน แต่ไม่ได้ยืนยันว่าทุกคำแปลผ่านการตรวจทานอย่างมืออาชีพโดยเจ้าของภาษา"}],"gallery":[{"id":"home","title":"หน้าต้อนรับและขั้นตอนหลัก","caption":"สี่คำสั่งบนแถบเครื่องมือ ตัวเลือกคำบรรยายสองชุดที่มองเห็นได้ คำขวัญที่แปลแล้ว และสถานะใช้งานไม่ได้ที่ชัดเจนก่อนเปิดวิดีโอ"},{"id":"study","title":"ฝึกฝนโดยเน้นทีละประโยค","caption":"demo.mp4 — ค้นหาประโยค คลิกเพื่อข้ามไปยังเวลานั้น ไปประโยคก่อนหน้า / ถัดไป เล่นซ้ำ วนซ้ำ ปรับความเร็ว และติดตามประโยคที่กำลังเล่น"},{"id":"languages","title":"คำบรรยายแรกและคำบรรยายที่สอง","caption":"ภาพจริงของอินเทอร์เฟซภาษาอังกฤษ แสดงเมนูคำบรรยายสองชุดที่เลือกได้อย่างอิสระ โดยมีค่าเริ่มต้นเป็นภาษาอังกฤษและภาษาจีนตัวเต็ม"},{"id":"youtube","title":"เปิดลิงก์ YouTube","caption":"ภาพจริงของกล่องลิงก์ในอินเทอร์เฟซภาษาอังกฤษ การเปิดลิงก์จะเริ่มเล่นและขอคำบรรยายคู่ที่เลือกไว้"}],"evidenceSummary":"สำหรับ 0.5.3: ผ่านการตรวจสอบส่วนหลัก 105 รายการ เงื่อนไขยืนยันของโมเดล 138 รายการ การตรวจสอบคำบรรยาย 29 รายการ การบันทึกวิดีโอ 60 รายการ และเงื่อนไขยืนยันอินเทอร์เฟซแบบเนทีฟ 317 รายการ เลือกภาษาทั้ง 24 ตัวเลือกในเมนูจริงแล้ว และตรวจทานอินเทอร์เฟซหกภาษากับการจัดวางแบบกะทัดรัดในภาษาเยอรมันแล้ว","evidenceLimit":"ตรวจสอบการเล่นในเครื่อง การส่งออก การเปลี่ยนสถานะ และกล่องบันทึกแบบเนทีฟแล้ว ข้อมูลทดสอบออฟไลน์และการทดสอบบันทึกด้วยตัวช่วยจำลองไม่ได้พิสูจน์ว่า YouTube อนุญาตให้ดาวน์โหลดคำบรรยายหรือวิดีโอออนไลน์ได้ในขณะนี้ ไม่มีการนำเข้าข้อมูลรับรองผู้ใช้"},"id":{"lang":"id","name":"Bahasa Indonesia","direction":"ltr","headline":"Pelajari bahasa-bahasa dunia lebih cepat dengan AI.","intro":"Jadikan YouTube kelas bahasa pribadi Anda. Gunakan takarir dan terjemahan otomatis YouTube untuk belajar dari video favorit Anda: baca dua bahasa berdampingan, putar ulang setiap kalimat, dan simpan materi yang penting bagi Anda.","badge":"24 bahasa antarmuka · Takarir multibahasa","notice":"Versi 0.5.3 · Pratinjau kode sumber · Kompilasi dari kode sumber","labels":{"language":"Bahasa dokumen","screenshots":"Tangkapan layar","workflow":"Mulai menggunakan","features":"Fitur yang tersedia","highlights":"Manfaatnya","issues":"Masalah dan batasan yang belum teratasi","evidence":"Yang sudah diverifikasi","readme":"README teknis","verification":"Catatan verifikasi terperinci","markdown":"Unduh panduan ini sebagai Markdown","preview":"Klik tangkapan layar untuk memperbesar","close":"Tutup","previous":"Tangkapan layar sebelumnya","next":"Tangkapan layar berikutnya","priority":"Prioritas","category":"Jenis","issue":"Masalah / langkah berikutnya","languageScope":"24 adalah jumlah pilihan bahasa antarmuka. Bahasa takarir bergantung pada trek yang tersedia untuk video terpilih; ini bukan janji untuk fasih dalam 24 bahasa.","screenshotScope":"Tangkapan layar diambil dari aplikasi 0.5.3 yang sebenarnya. Bahasa antarmuka dalam gambar diberi label terpisah dari bahasa dokumen ini.","fallbackScreenshot":"Tangkapan layar aplikasi berbahasa Inggris","localizedScreenshot":"Tangkapan layar aplikasi dalam bahasa ini","license":"Aplikasi berlisensi MIT; pemberitahuan komponen pihak ketiga tetap dipertahankan. AxonTube tidak berafiliasi dengan YouTube, Google, atau Apple.","updated":"Tanggal dokumen: 2026-10-11"},"steps":[{"title":"1. Buka YouTube","body":"Tempel tautan video. Takarir yang tersedia diminta secara otomatis, dengan bahasa Inggris sebagai trek pertama dan Tionghoa Tradisional sebagai trek kedua. Pengambilan pertama mungkin memerlukan sekitar 1–2 menit; ketersediaannya tidak dijamin."},{"title":"2. Pilih dan berlatih","body":"Gunakan dua menu pilihan takarir yang terlihat. Klik sebuah kalimat untuk melompat ke sana, putar ulang, atau aktifkan pengulangan kalimat."},{"title":"3. Simpan atau ekspor","body":"Simpan Video memungkinkan Anda memilih folder untuk media yang dapat diakses dan takarir yang tersedia. Ekspor Takarir Dwibahasa membuat Word, TXT, atau SRT dari takarir yang sudah dimuat."},{"title":"4. Sesuaikan dengan kebutuhan Anda","body":"Ubah bahasa antarmuka, kecepatan pemutaran, ukuran takarir, dan pergeseran waktu tiap trek. Aplikasi mengingat pilihan bahasa antarmuka dan takarir."}],"features":[{"title":"Dua trek takarir yang independen","body":"Bahasa bawaan adalah Inggris dan Tionghoa Tradisional; pilih dari takarir asli dan terjemahan otomatis yang tersedia untuk video saat ini. Takarir trek pertama yang berhasil dimuat tetap dapat digunakan jika trek kedua gagal."},{"title":"Latihan yang berfokus pada kalimat","body":"Pencarian kalimat, klik untuk melompat ke waktunya, kalimat sebelumnya / berikutnya, putar ulang, pengulangan, kecepatan pemutaran, dan mengikuti kalimat saat ini."},{"title":"Video dengan takarir tersinkron","body":"Penyimpanan tetap tersedia saat takarir dimuat. Setiap operasi membuat folder baru berisi video yang dapat diakses; jika takarir tersedia, trek SRT bertanda waktu dan berkas bacaan dwibahasa ditambahkan. Penyimpanan video tanpa takarir juga didukung. Hasil yang belum selesai tetap berada di folder .partial."},{"title":"Ekspor Word, TXT, dan SRT","body":"Ekspor takarir yang tersedia dengan pergeseran waktu yang sudah diterapkan. Word dan TXT memasangkan teks berdasarkan tumpang tindih waktu. Jika hanya satu trek yang dimuat, isinya tetap dapat diekspor."},{"title":"Antarmuka dalam 24 bahasa","body":"Menu, pesan status, dan slogan belajar berganti bahasa bersama. Bahasa Arab dan Ibrani mendukung tata letak dari kanan ke kiri; mengganti bahasa antarmuka tidak mengubah isi takarir."},{"title":"Pemutaran lokal dan kontrol yang jelas","body":"Buka berkas media dan takarir lokal dari menu Berkas. Tindakan yang tidak tersedia diredupkan disertai alasan; mode terpilih disorot dan diberi tanda centang; penyimpanan menampilkan status sibuk."}],"highlights":[{"title":"Dari menonton ke berlatih dalam beberapa langkah","body":"Empat tindakan pada bilah alat menjaga alur utama tetap langsung: YouTube → Simpan Video → Takarir → Bahasa. Tidak perlu tombol tambahan untuk mengambil takarir."},{"title":"Materi belajar yang dapat disimpan","body":"Takarir bertanda waktu dan berkas Word / TXT yang mudah dibaca mendukung latihan menyimak dan peninjauan kembali nanti. Ekspor menggunakan tujuan baru dan mempertahankan berkas asli."},{"title":"Bekerja secara lokal, tanpa kunci API AI","body":"Media lokal dan takarir tersimpan dapat digunakan luring. YouTube menyediakan takarir situs dan terjemahan otomatis; aplikasi tidak mengumpulkan telemetri, tidak mengunggah media lokal, dan tidak memerlukan kunci API AI berbayar."}],"issues":[{"priority":"P0","category":"Verifikasi layanan langsung","title":"Ketersediaan takarir dan video YouTube","body":"Pemeriksaan langsung terakhir terhalang persyaratan YouTube untuk masuk / verifikasi bot. Keberhasilan pengunduhan daring dalam kondisi saat ini belum dibuktikan. Verifikasi pada jaringan yang akan digunakan dan berbagai video yang representatif diperlukan sebelum rilis publik."},{"priority":"P1","category":"Batasan platform","title":"Penyematan dan video yang dibatasi berdasarkan akun","body":"Sebagian kreator atau video tidak mengizinkan pemutaran tersemat. Google SSO di dalam aplikasi belum diterapkan; pintasan peramban menggunakan sesi masuk dan pemutaran yang terpisah. Batasan ini tidak dapat dinyatakan sudah teratasi."},{"priority":"P1","category":"Distribusi dan kompatibilitas","title":"Penandatanganan dan pengujian pada lebih banyak Mac","body":"Paket ditandatangani secara ad-hoc, tanpa notarisasi Developer ID. Apple Silicon dengan macOS 26.5.2 telah diuji; macOS 27 dan Mac Intel belum. macOS 14 adalah target penerapan, bukan bukti bahwa setiap versi sudah diuji."},{"priority":"P2","category":"Batasan format dan kualitas","title":"Kualitas unduhan dan ketepatan takarir","body":"Penyimpanan menggunakan satu aliran lengkap berisi audio dan video, tanpa menggabungkan aliran resolusi tinggi yang terpisah. Pemutaran lokal bergantung pada dukungan codec. Konversi opsional dengan FFmpeg mungkin tidak mempertahankan trek audio tambahan, HDR, dan takarir tertanam. Impor ASS/SSA hanya mengambil teks. Takarir otomatis, terjemahan, dan pemasangan dwibahasa berbasis waktu dapat mengandung kesalahan."},{"priority":"P2","category":"Belum diterapkan","title":"Riwayat belajar dan alat pembelajaran","body":"Pemulihan riwayat pemutaran, koleksi kosakata, tinjauan berjarak, OCR, dan ekstraksi takarir gambar belum diterapkan. Preferensi bahasa yang tersimpan bukan berarti kemajuan belajar ikut tersimpan."},{"priority":"P2","category":"Tinjauan editorial","title":"Tinjauan bahasa oleh penutur asli","body":"Seluruh 24 pilihan bahasa antarmuka dan slogan yang dilokalkan lulus pemeriksaan pergantian bahasa. Ini membuktikan cakupan dan perilaku, bukan bahwa setiap terjemahan sudah ditinjau secara profesional oleh penutur asli."}],"gallery":[{"id":"home","title":"Sambutan dan alur kerja utama","caption":"Empat tindakan bilah alat, dua pemilih takarir yang terlihat, slogan yang dilokalkan, dan status nonaktif yang jelas sebelum video dibuka."},{"id":"study","title":"Latihan yang berfokus pada kalimat","caption":"demo.mp4 — Pencarian kalimat, klik untuk melompat ke waktunya, kalimat sebelumnya / berikutnya, putar ulang, pengulangan, kecepatan pemutaran, dan mengikuti kalimat saat ini."},{"id":"languages","title":"Takarir pertama dan kedua","caption":"Tangkapan nyata antarmuka bahasa Inggris yang memperlihatkan menu pilihan takarir independen, dengan bawaan bahasa Inggris dan Tionghoa Tradisional."},{"id":"youtube","title":"Buka tautan YouTube","caption":"Tangkapan nyata dialog tautan dalam antarmuka bahasa Inggris. Membuka tautan akan memulai pemutaran dan meminta pasangan takarir yang dipilih."}],"evidenceSummary":"Untuk 0.5.3: 105 pemeriksaan inti, 138 asersi model, 29 pemeriksaan takarir, 60 pemeriksaan penyimpanan video, dan 317 asersi antarmuka native lulus. Seluruh 24 bahasa dipilih di menu yang sebenarnya; enam bahasa antarmuka dan tata letak ringkas bahasa Jerman telah ditinjau.","evidenceLimit":"Pemutaran lokal, ekspor, transisi status, dan dialog simpan native telah diverifikasi. Data uji luring dan pengujian penyimpanan dengan pembantu tiruan tidak membuktikan bahwa YouTube saat ini mengizinkan pengunduhan takarir atau video secara daring. Tidak ada kredensial pengguna yang diimpor."},"nl":{"lang":"nl","name":"Nederlands","direction":"ltr","headline":"Leer de talen van de wereld sneller met AI.","intro":"Maak van YouTube je persoonlijke taalklas. Leer met YouTube-ondertitels en automatische vertalingen van video's die je graag kijkt: lees twee talen naast elkaar, speel elke zin opnieuw af en bewaar het materiaal dat voor jou telt.","badge":"24 interfacetalen · Meertalige ondertitels","notice":"Versie 0.5.3 · Voorlopige versie als broncode · Bouw vanuit broncode","labels":{"language":"Documenttaal","screenshots":"Schermafbeeldingen","workflow":"Aan de slag","features":"Beschikbare functies","highlights":"Waarom het handig is","issues":"Openstaande punten en beperkingen","evidence":"Wat is gecontroleerd","readme":"Technische README","verification":"Gedetailleerd verificatieverslag","markdown":"Download deze gids als Markdown","preview":"Klik op een schermafbeelding om deze te vergroten","close":"Sluiten","previous":"Vorige schermafbeelding","next":"Volgende schermafbeelding","priority":"Prioriteit","category":"Type","issue":"Punt / volgende stap","languageScope":"24 verwijst naar het aantal interfacetalen. Ondertiteltalen hangen af van de beschikbare sporen van de gekozen video; het is geen belofte dat je 24 talen vloeiend leert spreken.","screenshotScope":"De schermafbeeldingen zijn gemaakt in de daadwerkelijke app 0.5.3. De taal van elke schermafbeelding staat apart vermeld van de taal van dit document.","fallbackScreenshot":"Schermafbeelding van de Engelstalige app","localizedScreenshot":"Schermafbeelding van de app in deze taal","license":"De app heeft een MIT-licentie; voor componenten van derden blijven hun licentievermeldingen gelden. AxonTube is niet verbonden aan YouTube, Google of Apple.","updated":"Documentdatum: 2026-10-11"},"steps":[{"title":"1. Open YouTube","body":"Plak een videolink. Beschikbare ondertitels worden automatisch opgevraagd, met Engels als eerste taal en Traditioneel Chinees als tweede. Het eerste ophalen kan ongeveer 1–2 minuten duren; beschikbaarheid is niet gegarandeerd."},{"title":"2. Kies en oefen","body":"Gebruik de twee zichtbare keuzemenu's voor ondertitels. Klik op een zin om erheen te springen, deze opnieuw af te spelen of de zin in een lus te herhalen."},{"title":"3. Sla op of exporteer","body":"Met Video opslaan kies je een map voor toegankelijke media en beschikbare ondertitels. Tweetalige ondertitels exporteren maakt Word-, TXT- of SRT-bestanden van de geladen ondertitels."},{"title":"4. Pas het aan","body":"Wijzig de interfacetaal, afspeelsnelheid, ondertitelgrootte en tijdverschuiving per spoor. De app onthoudt je keuzes voor de interface- en ondertiteltalen."}],"features":[{"title":"Twee onafhankelijke ondertitelsporen","body":"Standaard Engels / Traditioneel Chinees; kies uit de beschikbare originele ondertitels en automatische vertalingen van de huidige video. Succesvol geladen ondertitels van het eerste spoor blijven bruikbaar als het tweede spoor mislukt."},{"title":"Oefenen per zin","body":"Zinnen zoeken, klikken om erheen te springen, vorige / volgende, opnieuw afspelen, herhalen in een lus, afspeelsnelheid en de huidige zin volgen."},{"title":"Video met gesynchroniseerde ondertitels","body":"Opslaan blijft beschikbaar terwijl ondertitels laden. Elke bewerking maakt een nieuwe map met toegankelijke video. Als ondertitels beschikbaar zijn, worden SRT-sporen met tijdcodes en tweetalige leesbestanden toegevoegd. Alleen video opslaan wordt ook ondersteund; onvoltooid werk blijft in een .partial-map."},{"title":"Export naar Word, TXT en SRT","body":"Exporteer beschikbare ondertitels met de ingestelde tijdverschuivingen. Word en TXT koppelen tekst op basis van overlappende tijden. Als slechts één spoor is geladen, kan de inhoud daarvan nog steeds worden geëxporteerd."},{"title":"24 vertaalde interfaces","body":"Menu's, statusmeldingen en de leerslogan veranderen samen van taal. Arabisch en Hebreeuws ondersteunen een indeling van rechts naar links; de ondertitelinhoud verandert niet wanneer je de interfacetaal wijzigt."},{"title":"Lokaal afspelen en duidelijke bediening","body":"Open lokale media- en ondertitelbestanden via het menu Bestand. Uitgeschakelde acties zijn gedimd met een uitleg; geselecteerde modi hebben markeringen en vinkjes; tijdens opslaan wordt een bezigstatus getoond."}],"highlights":[{"title":"Snel van kijken naar oefenen","body":"Vier werkbalkacties houden de hoofdroute eenvoudig: YouTube → Video opslaan → Ondertitels → Taal. Een extra knop om ondertitels op te halen is niet nodig."},{"title":"Leermateriaal om te bewaren","body":"Ondertitels met tijdcodes en leesbare Word- / TXT-bestanden helpen bij luisteroefeningen en later herhalen. Exports gebruiken nieuwe bestemmingen en behouden de originele bestanden."},{"title":"Lokaal werken, zonder AI-API-sleutel","body":"Lokale media en opgeslagen ondertitels werken offline. YouTube levert website-ondertitels en automatische vertalingen; de app heeft geen telemetrie, uploadt geen lokale media en vereist geen betaalde AI-API-sleutel."}],"issues":[{"priority":"P0","category":"Verificatie van de live dienst","title":"Beschikbaarheid van YouTube-ondertitels en -video's","body":"Bij de laatste live controle vroeg YouTube om aanmelding / botverificatie. Succesvolle online downloads zijn op dit moment niet aangetoond. Controleer dit vóór publieke uitgave op het beoogde netwerk en met representatieve video's."},{"priority":"P1","category":"Platformbeperking","title":"Insluiten en video's met accountbeperkingen","body":"Sommige makers of video's staan ingesloten afspelen niet toe. Google SSO in de app is niet geïmplementeerd; de browsersnelkoppeling gebruikt een aparte aanmeld- en afspeelsessie. Deze beperkingen mogen niet als opgelost worden gepresenteerd."},{"priority":"P1","category":"Distributie en compatibiliteit","title":"Ondertekening en bredere Mac-tests","body":"Het pakket is ad-hoc ondertekend, zonder Developer ID-notarisatie. Apple Silicon op macOS 26.5.2 is getest; macOS 27 en Intel-Macs niet. macOS 14 is een implementatiedoel, geen bewijs dat elke versie is getest."},{"priority":"P2","category":"Formaat- en kwaliteitsbeperkingen","title":"Downloadkwaliteit en nauwkeurigheid van ondertitels","body":"Opslaan gebruikt één volledige audio-/videostream en voegt geen aparte streams met hoge resolutie samen. Lokaal afspelen hangt af van codec-ondersteuning; optionele conversie met FFmpeg kan extra audiosporen, HDR en ingesloten ondertitels weglaten. ASS/SSA importeert alleen tekst. Automatische ondertitels, vertalingen en tweetalige koppeling op basis van tijd kunnen fouten bevatten."},{"priority":"P2","category":"Niet geïmplementeerd","title":"Leergeschiedenis en studiehulpmiddelen","body":"Herstel van de afspeelgeschiedenis, woordenverzamelingen, gespreide herhaling, OCR en extractie van ondertitels uit afbeeldingen zijn niet geïmplementeerd. Opgeslagen taalvoorkeuren zijn geen opgeslagen leervoortgang."},{"priority":"P2","category":"Redactionele controle","title":"Taalcontrole door moedertaalsprekers","body":"Alle 24 interfacetalen en vertaalde slogans hebben de wisseltests doorstaan. Dat toont dekking en gedrag aan, geen professionele controle van elke vertaling door moedertaalsprekers."}],"gallery":[{"id":"home","title":"Welkom en hoofdroute","caption":"De vier werkbalkacties, twee zichtbare ondertitelkeuzes, vertaalde slogan en duidelijke uitgeschakelde toestand voordat een video wordt geopend."},{"id":"study","title":"Oefenen per zin","caption":"demo.mp4 — Zinnen zoeken, klikken om erheen te springen, vorige / volgende, opnieuw afspelen, herhalen in een lus, afspeelsnelheid en de huidige zin volgen."},{"id":"languages","title":"Eerste en tweede ondertitel","caption":"Echte opname van de Engelse interface met de onafhankelijke ondertitelmenu's, standaard ingesteld op Engels en Traditioneel Chinees."},{"id":"youtube","title":"Open een YouTube-link","caption":"Echte opname van het linkvenster in de Engelse interface. Een link openen start het afspelen en vraagt het geselecteerde ondertitelpaar op."}],"evidenceSummary":"Voor 0.5.3: 105 kerncontroles, 138 modelasserties, 29 ondertitelcontroles, 60 controles voor video-opslag en 317 asserties voor de native interface geslaagd. Alle 24 talen zijn in het echte menu geselecteerd; zes interfacetalen en compacte Duitse indelingen zijn beoordeeld.","evidenceLimit":"Lokaal afspelen, exports, toestandsovergangen en native opslagdialoogvensters zijn gecontroleerd. Offline testgegevens en opslagtests met een gesimuleerd hulpprogramma bewijzen niet dat YouTube momenteel online ondertitel- of videodownloads toestaat. Er zijn geen gebruikersgegevens voor aanmelding geïmporteerd."},"pl":{"lang":"pl","name":"Polski","direction":"ltr","headline":"Ucz się języków świata szybciej dzięki AI.","intro":"Zamień YouTube w swoją osobistą klasę językową. Korzystaj z napisów i automatycznych tłumaczeń YouTube, by uczyć się z ulubionych filmów: czytaj dwa języki obok siebie, odtwarzaj każde zdanie ponownie i zachowuj najważniejsze materiały.","badge":"24 języki interfejsu · Wielojęzyczne napisy","notice":"Wersja 0.5.3 · Wersja poglądowa kodu źródłowego · Kompilacja ze źródeł","labels":{"language":"Język dokumentu","screenshots":"Zrzuty ekranu","workflow":"Pierwsze kroki","features":"Dostępne funkcje","highlights":"Dlaczego warto","issues":"Otwarte problemy i ograniczenia","evidence":"Co zweryfikowano","readme":"Techniczny README","verification":"Szczegółowy zapis weryfikacji","markdown":"Pobierz ten przewodnik jako Markdown","preview":"Kliknij zrzut ekranu, aby go powiększyć","close":"Zamknij","previous":"Poprzedni zrzut ekranu","next":"Następny zrzut ekranu","priority":"Priorytet","category":"Typ","issue":"Problem / następny krok","languageScope":"Liczba 24 dotyczy języków interfejsu. Języki napisów zależą od ścieżek dostępnych dla wybranego filmu; nie jest to obietnica biegłości w 24 językach.","screenshotScope":"Zrzuty ekranu pochodzą z rzeczywistej aplikacji 0.5.3. Język zrzutu jest oznaczony niezależnie od języka tego dokumentu.","fallbackScreenshot":"Zrzut ekranu aplikacji w języku angielskim","localizedScreenshot":"Zrzut ekranu aplikacji w tym języku","license":"Aplikacja jest objęta licencją MIT; komponenty innych firm zachowują swoje informacje licencyjne. AxonTube nie jest powiązany z YouTube, Google ani Apple.","updated":"Data dokumentu: 2026-10-11"},"steps":[{"title":"1. Otwórz YouTube","body":"Wklej link do filmu. Dostępne napisy są pobierane automatycznie: angielskie jako pierwsze, a chińskie tradycyjne jako drugie. Pierwsze pobieranie może trwać około 1–2 minut; dostępność nie jest gwarantowana."},{"title":"2. Wybierz i ćwicz","body":"Użyj dwóch widocznych list wyboru napisów. Kliknij zdanie, aby do niego przejść, odtworzyć je ponownie lub włączyć jego zapętlenie."},{"title":"3. Zapisz lub eksportuj","body":"Opcja Zapisz film pozwala wybrać folder na dostępne multimedia i napisy. Eksportuj napisy dwujęzyczne tworzy pliki Word, TXT lub SRT z wczytanych napisów."},{"title":"4. Dostosuj do siebie","body":"Zmień język interfejsu, szybkość odtwarzania, rozmiar napisów i przesunięcie czasu każdej ścieżki. Aplikacja zapamiętuje wybory języka interfejsu i napisów."}],"features":[{"title":"Dwie niezależne ścieżki napisów","body":"Domyślnie angielski / chiński tradycyjny; wybieraj spośród dostępnych dla bieżącego filmu oryginałów i tłumaczeń automatycznych. Poprawnie pobrane napisy pierwszej ścieżki pozostają dostępne, jeśli pobranie drugiej się nie powiedzie."},{"title":"Ćwiczenia zdanie po zdaniu","body":"Wyszukiwanie zdań, przechodzenie kliknięciem, poprzednie / następne, ponowne odtwarzanie, zapętlanie, szybkość odtwarzania i śledzenie bieżącego zdania."},{"title":"Film ze zsynchronizowanymi napisami","body":"Zapisywanie jest dostępne także podczas wczytywania napisów. Każda operacja tworzy nowy folder z dostępnym filmem. Jeśli napisy są dostępne, dodawane są ścieżki SRT z czasami i dwujęzyczne pliki do czytania. Można też zapisać sam film; nieukończona praca pozostaje w folderze .partial."},{"title":"Eksport do Word, TXT i SRT","body":"Eksportuj dostępne napisy z zastosowanymi przesunięciami czasu. Word i TXT łączą teksty według nakładających się przedziałów czasowych. Jeśli wczytano tylko jedną ścieżkę, jej treść nadal można wyeksportować."},{"title":"24 wersje językowe interfejsu","body":"Menu, komunikaty stanu i hasło zachęcające do nauki zmieniają język razem. Arabski i hebrajski obsługują układ od prawej do lewej; zmiana języka interfejsu nie zmienia treści napisów."},{"title":"Lokalne odtwarzanie i czytelne sterowanie","body":"Otwieraj lokalne pliki multimedialne i napisy z menu Plik. Niedostępne czynności są przygaszone z podanym powodem; wybrane tryby mają wyróżnienia i znaczniki; zapisywaniu towarzyszy wskaźnik zajętości."}],"highlights":[{"title":"Krótka droga od oglądania do ćwiczeń","body":"Cztery czynności na pasku narzędzi upraszczają główny tok pracy: YouTube → Zapisz film → Napisy → Język. Dodatkowy przycisk pobierania napisów nie jest potrzebny."},{"title":"Materiały do nauki, które możesz zachować","body":"Napisy z czasami oraz czytelne pliki Word / TXT wspierają ćwiczenie słuchania i późniejsze powtórki. Eksport korzysta z nowych miejsc docelowych i zachowuje oryginalne pliki."},{"title":"Praca lokalna, bez klucza API AI","body":"Lokalne multimedia i zapisane napisy działają offline. YouTube dostarcza napisy z serwisu i tłumaczenia automatyczne; aplikacja nie ma telemetrii, nie przesyła lokalnych multimediów i nie wymaga płatnego klucza API AI."}],"issues":[{"priority":"P0","category":"Weryfikacja usługi online","title":"Dostępność napisów i filmów z YouTube","body":"Ostatnia próba online napotkała wymóg logowania / weryfikacji antybotowej YouTube. Nie potwierdzono obecnie udanego pobierania online. Przed publicznym wydaniem sprawdź działanie w docelowej sieci i na reprezentatywnym zestawie filmów."},{"priority":"P1","category":"Ograniczenie platformy","title":"Osadzanie i filmy z ograniczeniami konta","body":"Niektórzy autorzy lub niektóre filmy nie zezwalają na odtwarzanie osadzone. Logowanie Google SSO w aplikacji nie jest zaimplementowane; skrót do przeglądarki używa osobnej sesji logowania i odtwarzania. Tych ograniczeń nie można przedstawiać jako rozwiązanych."},{"priority":"P1","category":"Dystrybucja i zgodność","title":"Podpisywanie i szersze testy na Macach","body":"Pakiet ma podpis ad hoc, bez notaryzacji Developer ID. Testowano Apple Silicon z macOS 26.5.2; nie testowano macOS 27 ani Maców z procesorem Intel. macOS 14 jest minimalną wersją docelową, a nie dowodem przetestowania każdej wersji."},{"priority":"P2","category":"Ograniczenia formatów i jakości","title":"Jakość pobierania i wierność napisów","body":"Zapisywanie korzysta z kompletnego strumienia audio/wideo i nie łączy oddzielnych strumieni wysokiej rozdzielczości. Lokalne odtwarzanie zależy od obsługi kodeków; opcjonalna konwersja przez FFmpeg może pomijać dodatkowe ścieżki audio, HDR i osadzone napisy. Import ASS/SSA obejmuje tylko tekst. Automatyczne napisy, tłumaczenia i parowanie dwujęzyczne według czasu mogą zawierać błędy."},{"priority":"P2","category":"Niezaimplementowane","title":"Historia nauki i narzędzia do nauki","body":"Przywracanie historii odtwarzania, zbiory słownictwa, powtórki rozłożone w czasie, OCR i wydobywanie napisów z obrazów nie są zaimplementowane. Zapisane preferencje językowe nie oznaczają zapisanych postępów w nauce."},{"priority":"P2","category":"Redakcja językowa","title":"Weryfikacja przez rodzimych użytkowników języka","body":"Wszystkie 24 języki interfejsu i przetłumaczone hasła przeszły testy przełączania. Potwierdza to zakres i zachowanie, a nie profesjonalną weryfikację każdego tłumaczenia przez rodzimych użytkowników języka."}],"gallery":[{"id":"home","title":"Powitanie i główny tok pracy","caption":"Cztery czynności na pasku narzędzi, dwa widoczne pola wyboru napisów, przetłumaczone hasło i czytelny stan nieaktywny przed otwarciem filmu."},{"id":"study","title":"Ćwiczenia zdanie po zdaniu","caption":"demo.mp4 — Wyszukiwanie zdań, przechodzenie kliknięciem, poprzednie / następne, ponowne odtwarzanie, zapętlanie, szybkość odtwarzania i śledzenie bieżącego zdania."},{"id":"languages","title":"Pierwsze i drugie napisy","caption":"Rzeczywisty zrzut angielskiego interfejsu z niezależnymi listami wyboru napisów, domyślnie ustawionymi na angielski i chiński tradycyjny."},{"id":"youtube","title":"Otwórz link do YouTube","caption":"Rzeczywisty zrzut okna linku w angielskim interfejsie. Otwarcie linku rozpoczyna odtwarzanie i żąda wybranej pary napisów."}],"evidenceSummary":"Dla 0.5.3 zaliczono: 105 testów podstawowych, 138 asercji modelu, 29 testów napisów, 60 testów zapisywania filmów i 317 asercji natywnego interfejsu. Wszystkie 24 języki wybrano w rzeczywistym menu; oceniono sześć języków interfejsu i zwarte układy niemieckie.","evidenceLimit":"Zweryfikowano lokalne odtwarzanie, eksport, przejścia między stanami i natywne okna zapisu. Dane testowe offline i testy zapisu z atrapą programu pomocniczego nie dowodzą, że YouTube obecnie pozwala pobierać napisy lub filmy online. Nie zaimportowano danych uwierzytelniających użytkownika."},"uk":{"lang":"uk","name":"Українська","direction":"ltr","headline":"Вивчайте мови світу швидше з ШІ.","intro":"Перетворіть YouTube на власний мовний клас. Навчайтеся за улюбленими відео із субтитрами й автоматичними перекладами YouTube: читайте розташовані поруч тексти двома мовами, повторюйте кожне речення та зберігайте важливі матеріали.","badge":"24 мови інтерфейсу · Багатомовні субтитри","notice":"Версія 0.5.3 · Попередня версія вихідного коду · Збирання з вихідного коду","labels":{"language":"Мова документа","screenshots":"Знімки екрана","workflow":"Початок роботи","features":"Доступні функції","highlights":"Чим це корисно","issues":"Відкриті питання й обмеження","evidence":"Що перевірено","readme":"Технічний README","verification":"Докладний звіт про перевірку","markdown":"Завантажити цей посібник у форматі Markdown","preview":"Натисніть знімок екрана, щоб збільшити","close":"Закрити","previous":"Попередній знімок екрана","next":"Наступний знімок екрана","priority":"Пріоритет","category":"Тип","issue":"Питання / наступний крок","languageScope":"24 — це кількість мов інтерфейсу. Мови субтитрів залежать від доступних доріжок вибраного відео; це не обіцянка вільного володіння 24 мовами.","screenshotScope":"Знімки екрана зроблено в реальному застосунку 0.5.3. Мову знімка позначено окремо від мови цього документа.","fallbackScreenshot":"Знімок екрана застосунку англійською","localizedScreenshot":"Знімок екрана застосунку цією мовою","license":"Застосунок має ліцензію MIT; сторонні компоненти зберігають свої ліцензійні повідомлення. AxonTube не пов’язаний із YouTube, Google чи Apple.","updated":"Дата документа: 2026-10-11"},"steps":[{"title":"1. Відкрийте YouTube","body":"Вставте посилання на відео. Доступні субтитри запитуються автоматично: англійські першими, традиційною китайською — другими. Початкове отримання може тривати близько 1–2 хвилин; доступність не гарантована."},{"title":"2. Вибирайте й тренуйтеся","body":"Скористайтеся двома видимими списками вибору субтитрів. Натисніть речення, щоб перейти до нього, відтворити його ще раз або ввімкнути повторення в циклі."},{"title":"3. Збережіть або експортуйте","body":"Команда «Зберегти відео» дає змогу вибрати папку для доступних медіафайлів і субтитрів. «Експортувати двомовні субтитри» створює файли Word, TXT або SRT із завантажених субтитрів."},{"title":"4. Налаштуйте під себе","body":"Змінюйте мову інтерфейсу, швидкість відтворення, розмір субтитрів і часовий зсув кожної доріжки. Застосунок запам’ятовує вибрані мови інтерфейсу й субтитрів."}],"features":[{"title":"Дві незалежні доріжки субтитрів","body":"Типово — англійська / традиційна китайська; вибирайте з доступних оригіналів і автоматичних перекладів поточного відео. Успішно отримані субтитри першої доріжки залишаються доступними, якщо другу отримати не вдалося."},{"title":"Практика на рівні речень","body":"Пошук речень, перехід натисканням, попереднє / наступне, повторне відтворення, циклічне повторення, швидкість відтворення та стеження за поточним реченням."},{"title":"Відео із синхронізованими субтитрами","body":"Збереження доступне навіть під час завантаження субтитрів. Кожна операція створює нову папку з доступним відео. Якщо субтитри доступні, додаються доріжки SRT із часовими мітками та двомовні файли для читання. Можна також зберегти лише відео; незавершена робота залишається в папці .partial."},{"title":"Експорт у Word, TXT і SRT","body":"Експортуйте доступні субтитри із застосованими часовими зсувами. Word і TXT поєднують текст за перекриттям часових інтервалів. Якщо завантажено лише одну доріжку, її вміст усе одно можна експортувати."},{"title":"24 локалізовані інтерфейси","body":"Меню, повідомлення про стан і навчальне гасло змінюють мову разом. Арабська та іврит підтримують розташування справа наліво; зміна мови інтерфейсу не змінює вміст субтитрів."},{"title":"Локальне відтворення і зрозуміле керування","body":"Відкривайте локальні медіафайли й субтитри через меню «Файл». Недоступні дії приглушено з поясненням причини; вибрані режими виділено й позначено галочками; під час збереження відображається стан зайнятості."}],"highlights":[{"title":"Короткий шлях від перегляду до практики","body":"Чотири дії на панелі інструментів спрощують основний процес: YouTube → Зберегти відео → Субтитри → Мова. Окрема кнопка отримання субтитрів не потрібна."},{"title":"Навчальні матеріали, які можна зберегти","body":"Субтитри з часовими мітками та зручні для читання файли Word / TXT допомагають тренувати слухання й повторювати матеріал пізніше. Експорт використовує нові місця призначення та зберігає оригінальні файли."},{"title":"Локальна робота без ключа API ШІ","body":"Локальні медіафайли й збережені субтитри працюють офлайн. YouTube надає субтитри сайту та автоматичні переклади; застосунок не має телеметрії, не передає локальні медіафайли й не потребує платного ключа API ШІ."}],"issues":[{"priority":"P0","category":"Перевірка онлайн-сервісу","title":"Доступність субтитрів і відео YouTube","body":"Остання онлайн-перевірка зіткнулася з вимогою YouTube увійти / пройти перевірку на бота. Успішне завантаження з мережі наразі не підтверджено. Перед публічним випуском перевірте роботу в цільовій мережі та на репрезентативній добірці відео."},{"priority":"P1","category":"Обмеження платформи","title":"Вбудоване відтворення та відео з обмеженнями облікового запису","body":"Деякі автори або відео не дозволяють вбудоване відтворення. Google SSO в застосунку не реалізовано; перехід у браузер використовує окремий сеанс входу й відтворення. Ці обмеження не можна вважати усуненими."},{"priority":"P1","category":"Поширення й сумісність","title":"Підписування та ширше тестування на Mac","body":"Пакет має підпис ad hoc, без нотаризації Developer ID. Перевірено Apple Silicon на macOS 26.5.2; macOS 27 і Mac із процесорами Intel не перевірялися. macOS 14 — цільова версія розгортання, а не доказ перевірки кожної версії."},{"priority":"P2","category":"Обмеження форматів і якості","title":"Якість завантаження і точність субтитрів","body":"Збереження використовує цілісний аудіо-/відеопотік і не об’єднує окремі потоки високої роздільності. Локальне відтворення залежить від підтримки кодеків; необов’язкове перетворення за допомогою FFmpeg може не зберегти додаткові аудіодоріжки, HDR і вбудовані субтитри. ASS/SSA імпортує лише текст. Автоматичні субтитри, переклади та двомовне поєднання за часом можуть містити помилки."},{"priority":"P2","category":"Не реалізовано","title":"Історія навчання та навчальні інструменти","body":"Відновлення історії відтворення, добірки слів, інтервальне повторення, OCR і видобування субтитрів із зображень не реалізовано. Збережені мовні налаштування не є збереженим навчальним прогресом."},{"priority":"P2","category":"Редакторська перевірка","title":"Мовна перевірка носіями мови","body":"Усі 24 мови інтерфейсу й локалізовані гасла пройшли перевірки перемикання. Це підтверджує охоплення та поведінку, але не професійну перевірку кожного перекладу носіями мови."}],"gallery":[{"id":"home","title":"Привітання та основний процес","caption":"Чотири дії на панелі інструментів, два видимі поля вибору субтитрів, локалізоване гасло й чіткий неактивний стан перед відкриттям відео."},{"id":"study","title":"Практика на рівні речень","caption":"demo.mp4 — Пошук речень, перехід натисканням, попереднє / наступне, повторне відтворення, циклічне повторення, швидкість відтворення та стеження за поточним реченням."},{"id":"languages","title":"Перші та другі субтитри","caption":"Реальний знімок англійського інтерфейсу з незалежними списками вибору субтитрів, типово налаштованими на англійську й традиційну китайську."},{"id":"youtube","title":"Відкрийте посилання YouTube","caption":"Реальний знімок діалогу посилання в англійському інтерфейсі. Відкриття посилання запускає відтворення й запитує вибрану пару субтитрів."}],"evidenceSummary":"Для 0.5.3 успішно пройдено: 105 базових перевірок, 138 тверджень моделі, 29 перевірок субтитрів, 60 перевірок збереження відео та 317 тверджень нативного інтерфейсу. Усі 24 мови вибрано в реальному меню; перевірено шість мов інтерфейсу й компактні німецькі макети.","evidenceLimit":"Перевірено локальне відтворення, експорт, переходи станів і нативні діалоги збереження. Офлайн-тестові дані й тести збереження з імітацією допоміжної програми не доводять, що YouTube зараз дозволяє завантажувати субтитри чи відео з мережі. Дані входу користувачів не імпортувалися."},"sv":{"lang":"sv","name":"Svenska","direction":"ltr","headline":"Lär dig världens språk snabbare med AI.","intro":"Gör YouTube till ditt eget språkklassrum. Lär dig med videor du gillar genom YouTubes undertexter och automatiska översättningar: läs två språk sida vid sida, spela upp varje mening igen och spara materialet som betyder något för dig.","badge":"24 gränssnittsspråk · Flerspråkiga undertexter","notice":"Version 0.5.3 · Förhandsversion som källkod · Bygg från källkod","labels":{"language":"Dokumentspråk","screenshots":"Skärmbilder","workflow":"Kom igång","features":"Tillgängliga funktioner","highlights":"Därför är den användbar","issues":"Öppna frågor och begränsningar","evidence":"Vad som har verifierats","readme":"Teknisk README","verification":"Detaljerad verifieringsrapport","markdown":"Hämta guiden som Markdown","preview":"Klicka på en skärmbild för att förstora","close":"Stäng","previous":"Föregående skärmbild","next":"Nästa skärmbild","priority":"Prioritet","category":"Typ","issue":"Fråga / nästa steg","languageScope":"24 avser antalet gränssnittsspråk. Undertextspråken beror på den valda videons tillgängliga spår; det är inget löfte om att behärska 24 språk flytande.","screenshotScope":"Skärmbilderna är tagna i den faktiska appen 0.5.3. Skärmbildens språk anges separat från dokumentets språk.","fallbackScreenshot":"Skärmbild av appen på engelska","localizedScreenshot":"Skärmbild av appen på detta språk","license":"Appen har MIT-licens; tredjepartskomponenter behåller sina licensmeddelanden. AxonTube har ingen anknytning till YouTube, Google eller Apple.","updated":"Dokumentdatum: 2026-10-11"},"steps":[{"title":"1. Öppna YouTube","body":"Klistra in en videolänk. Tillgängliga undertexter begärs automatiskt, med engelska först och traditionell kinesiska sedan. Den första hämtningen kan ta cirka 1–2 minuter; tillgängligheten garanteras inte."},{"title":"2. Välj och öva","body":"Använd de två synliga rullgardinsmenyerna för undertexter. Klicka på en mening för att hoppa till den, spela upp den igen eller upprepa den i en slinga."},{"title":"3. Spara eller exportera","body":"Med Spara video väljer du en mapp för åtkomliga medier och tillgängliga undertexter. Exportera tvåspråkiga undertexter skapar Word-, TXT- eller SRT-filer av inlästa undertexter."},{"title":"4. Anpassa efter dig","body":"Ändra gränssnittsspråk, uppspelningshastighet, undertextstorlek och tidsförskjutning för varje spår. Appen kommer ihåg valen av gränssnitts- och undertextspråk."}],"features":[{"title":"Två oberoende undertextspår","body":"Engelska / traditionell kinesiska som standard; välj bland den aktuella videons tillgängliga original och automatiska översättningar. Undertexter som hämtats för det första spåret går fortfarande att använda om det andra spåret misslyckas."},{"title":"Öva mening för mening","body":"Meningssökning, klicka för att hoppa, föregående / nästa, spela upp igen, upprepning i slinga, uppspelningshastighet och följ den aktuella meningen."},{"title":"Video med synkroniserade undertexter","body":"Det går att spara medan undertexterna läses in. Varje åtgärd skapar en ny mapp med åtkomlig video. När undertexter finns tillgängliga läggs SRT-spår med tidskoder och tvåspråkiga läsfiler till. Det går även att spara enbart video; ofärdigt arbete ligger kvar i en .partial-mapp."},{"title":"Export till Word, TXT och SRT","body":"Exportera tillgängliga undertexter med tidsförskjutningarna tillämpade. Word och TXT parar ihop text utifrån överlappande tider. Om bara ett spår har lästs in kan dess innehåll ändå exporteras."},{"title":"24 översatta gränssnitt","body":"Menyer, statusmeddelanden och inlärningssloganen byter språk tillsammans. Arabiska och hebreiska har stöd för layout från höger till vänster; undertexternas innehåll ändras inte när du byter gränssnittsspråk."},{"title":"Lokal uppspelning och tydliga kontroller","body":"Öppna lokala medie- och undertextfiler från menyn Arkiv. Inaktiverade åtgärder är nedtonade med angivna orsaker; valda lägen har markeringar och bockar; en upptagenindikator visas när något sparas."}],"highlights":[{"title":"Kort väg från att titta till att öva","body":"Fyra verktygsfältsåtgärder gör huvudflödet enkelt: YouTube → Spara video → Undertexter → Språk. Ingen extra knapp för att hämta undertexter behövs."},{"title":"Läromaterial som du kan behålla","body":"Undertexter med tidskoder och läsbara Word- / TXT-filer stöder både hörövningar och senare repetition. Export använder nya målsökvägar och bevarar originalfilerna."},{"title":"Lokalt arbete utan AI-API-nyckel","body":"Lokala medier och sparade undertexter fungerar offline. YouTube tillhandahåller webbplatsens undertexter och automatiska översättningar; appen har ingen telemetri, laddar inte upp lokala medier och kräver ingen betald AI-API-nyckel."}],"issues":[{"priority":"P0","category":"Verifiering av onlinetjänsten","title":"Tillgång till undertexter och videor från YouTube","body":"Den senaste livekontrollen mötte YouTubes krav på inloggning / botverifiering. Lyckade nedladdningar från nätet har inte kunnat bekräftas i nuläget. Kontrollera på det avsedda nätverket och med representativa videor före offentlig lansering."},{"priority":"P1","category":"Plattformsbegränsning","title":"Inbäddning och kontobegränsade videor","body":"Vissa upphovspersoner eller videor tillåter inte inbäddad uppspelning. Google SSO i appen är inte implementerat; webbläsargenvägen använder en separat inloggnings- och uppspelningssession. Dessa begränsningar får inte framställas som lösta."},{"priority":"P1","category":"Distribution och kompatibilitet","title":"Signering och bredare Mac-tester","body":"Paketet är ad hoc-signerat, utan Developer ID-notarisering. Apple Silicon med macOS 26.5.2 har testats; macOS 27 och Intel-Macar har inte testats. macOS 14 är ett distributionsmål, inte bevis för att varje version har testats."},{"priority":"P2","category":"Format- och kvalitetsbegränsningar","title":"Nedladdningskvalitet och undertexternas riktighet","body":"Sparandet använder en komplett ljud-/videoström och slår inte ihop separata högupplösta strömmar. Lokal uppspelning beror på vilka kodekar som stöds; valfri konvertering med FFmpeg kan utelämna extra ljudspår, HDR och inbäddade undertexter. ASS/SSA importerar endast text. Automatiska undertexter, översättningar och tidsbaserad tvåspråkig parning kan innehålla fel."},{"priority":"P2","category":"Inte implementerat","title":"Inlärningshistorik och studieverktyg","body":"Återställning av uppspelningshistorik, ordsamlingar, repetition med mellanrum, OCR och extrahering av bildbaserade undertexter är inte implementerade. Sparade språkinställningar är inte sparade studieframsteg."},{"priority":"P2","category":"Språklig granskning","title":"Granskning av modersmålstalare","body":"Alla 24 gränssnittsspråk och översatta sloganer klarade testerna för språkbyte. Det bekräftar täckning och beteende, men inte professionell modersmålsgranskning av varje översättning."}],"gallery":[{"id":"home","title":"Välkommen och huvudflöde","caption":"De fyra verktygsfältsåtgärderna, två synliga undertextväljare, översatt slogan och tydligt inaktivt läge innan en video öppnas."},{"id":"study","title":"Öva mening för mening","caption":"demo.mp4 — Meningssökning, klicka för att hoppa, föregående / nästa, spela upp igen, upprepning i slinga, uppspelningshastighet och följ den aktuella meningen."},{"id":"languages","title":"Första och andra undertexten","caption":"Faktisk skärmbild av det engelska gränssnittets oberoende undertextmenyer, med engelska och traditionell kinesiska som standard."},{"id":"youtube","title":"Öppna en YouTube-länk","caption":"Faktisk skärmbild av länkrutan i det engelska gränssnittet. När en länk öppnas startar uppspelningen och det valda undertextparet begärs."}],"evidenceSummary":"För 0.5.3 godkändes: 105 kärnkontroller, 138 modellassertioner, 29 undertextkontroller, 60 kontroller av videosparande och 317 assertioner för macOS-gränssnittet. Alla 24 språkval gjordes i den faktiska menyn; sex gränssnittsspråk och kompakta tyska layouter granskades.","evidenceLimit":"Lokal uppspelning, exporter, tillståndsövergångar och systemets sparadialoger verifierades. Offlinetestdata och spartester med ett simulerat hjälpprogram bevisar inte att YouTube för närvarande tillåter nedladdning av undertexter eller videor från nätet. Inga inloggningsuppgifter för användare importerades."},"da":{"lang":"da","name":"Dansk","direction":"ltr","headline":"Lær verdens sprog hurtigere med AI.","intro":"Gør YouTube til dit eget sprogklasseværelse. Lær med videoer, du elsker, ved hjælp af YouTubes undertekster og automatiske oversættelser: læs to sprog side om side, afspil hver sætning igen, og gem det materiale, der betyder noget for dig.","badge":"24 brugerfladesprog · Flersprogede undertekster","notice":"Version 0.5.3 · Forhåndsversion som kildekode · Byg fra kildekode","labels":{"language":"Dokumentsprog","screenshots":"Skærmbilleder","workflow":"Kom godt i gang","features":"Tilgængelige funktioner","highlights":"Derfor er den nyttig","issues":"Åbne problemer og begrænsninger","evidence":"Hvad der er verificeret","readme":"Teknisk README","verification":"Detaljeret verifikationsrapport","markdown":"Download denne vejledning som Markdown","preview":"Klik på et skærmbillede for at forstørre det","close":"Luk","previous":"Forrige skærmbillede","next":"Næste skærmbillede","priority":"Prioritet","category":"Type","issue":"Problem / næste skridt","languageScope":"24 er antallet af brugerfladesprog. Undertekstsprog afhænger af den valgte videos tilgængelige spor; det er ikke et løfte om at beherske 24 sprog flydende.","screenshotScope":"Skærmbillederne er taget i den faktiske app 0.5.3. Skærmbilledets sprog er angivet særskilt fra dette dokuments sprog.","fallbackScreenshot":"Skærmbillede af appen på engelsk","localizedScreenshot":"Skærmbillede af appen på dette sprog","license":"Appen har MIT-licens; tredjepartskomponenter bevarer deres licensmeddelelser. AxonTube er ikke tilknyttet YouTube, Google eller Apple.","updated":"Dokumentdato: 2026-10-11"},"steps":[{"title":"1. Åbn YouTube","body":"Indsæt et videolink. Tilgængelige undertekster anmodes automatisk med engelsk først og traditionelt kinesisk som det andet sprog. Første hentning kan tage cirka 1–2 minutter; tilgængeligheden er ikke garanteret."},{"title":"2. Vælg, og øv dig","body":"Brug de to synlige rullemenuer til undertekster. Klik på en sætning for at springe til den, afspille den igen eller gentage den i en løkke."},{"title":"3. Gem eller eksportér","body":"Gem video lader dig vælge en mappe til tilgængelige medier og undertekster. Eksportér tosprogede undertekster opretter Word-, TXT- eller SRT-filer ud fra indlæste undertekster."},{"title":"4. Tilpas til dig","body":"Skift brugerfladesprog, afspilningshastighed, undertekststørrelse og tidsforskydning for hvert spor. Appen husker valgene af brugerflade- og undertekstsprog."}],"features":[{"title":"To uafhængige undertekstspor","body":"Engelsk / traditionelt kinesisk som standard; vælg mellem den aktuelle videos tilgængelige originaler og automatiske oversættelser. Undertekster, der er hentet til første spor, kan stadig bruges, hvis andet spor fejler."},{"title":"Øvelse sætning for sætning","body":"Sætningssøgning, spring med et klik, forrige / næste, gentagelse, løkker, afspilningshastighed og følg den aktuelle sætning."},{"title":"Video med synkroniserede undertekster","body":"Du kan gemme, mens undertekster indlæses. Hver handling opretter en ny mappe med tilgængelig video. Når undertekster er tilgængelige, tilføjes SRT-spor med tidskoder og tosprogede læsefiler. Det er også muligt at gemme kun videoen; uafsluttet arbejde forbliver i en .partial-mappe."},{"title":"Eksport til Word, TXT og SRT","body":"Eksportér tilgængelige undertekster med tidsforskydningerne anvendt. Word og TXT parrer tekst efter overlappende tidsrum. Hvis kun ét spor er indlæst, kan dets indhold stadig eksporteres."},{"title":"24 oversatte brugerflader","body":"Menuer, statusmeddelelser og læringssloganet skifter sprog sammen. Arabisk og hebraisk understøtter layout fra højre mod venstre; underteksternes indhold ændres ikke, når brugerfladesproget skiftes."},{"title":"Lokal afspilning og tydelig betjening","body":"Åbn lokale medie- og undertekstfiler fra menuen Arkiv. Deaktiverede handlinger er nedtonet med en begrundelse; valgte tilstande har fremhævninger og flueben; en optagetindikator vises, mens der gemmes."}],"highlights":[{"title":"Kort vej fra at se til at øve","body":"Fire handlinger på værktøjslinjen gør hovedforløbet enkelt: YouTube → Gem video → Undertekster → Sprog. Der er ikke brug for en ekstra knap til at hente undertekster."},{"title":"Læringsmateriale, du kan beholde","body":"Undertekster med tidskoder og læsbare Word- / TXT-filer hjælper både med lytteøvelser og senere repetition. Eksport bruger nye destinationer og bevarer originalfilerne."},{"title":"Lokalt arbejde uden AI-API-nøgle","body":"Lokale medier og gemte undertekster fungerer offline. YouTube leverer webstedets undertekster og automatiske oversættelser; appen har ingen telemetri, uploader ikke lokale medier og kræver ingen betalt AI-API-nøgle."}],"issues":[{"priority":"P0","category":"Verifikation af onlinetjenesten","title":"Tilgængelighed af YouTube-undertekster og -videoer","body":"Den seneste livekontrol stødte på YouTubes krav om login / botkontrol. Vellykkede aktuelle onlinedownloads er ikke bekræftet. Kontrollér på det tilsigtede netværk og med repræsentative videoer før offentlig udgivelse."},{"priority":"P1","category":"Platformsbegrænsning","title":"Indlejring og videoer med kontobegrænsninger","body":"Nogle ophavspersoner eller videoer tillader ikke indlejret afspilning. Google SSO i appen er ikke implementeret; browsergenvejen bruger en separat login- og afspilningssession. Disse begrænsninger kan ikke fremstilles som løst."},{"priority":"P1","category":"Distribution og kompatibilitet","title":"Signering og bredere Mac-test","body":"Pakken er ad hoc-signeret uden Developer ID-notarisering. Apple Silicon med macOS 26.5.2 er testet; macOS 27 og Intel-Mac-computere er ikke. macOS 14 er et implementeringsmål, ikke bevis for, at alle versioner er testet."},{"priority":"P2","category":"Format- og kvalitetsbegrænsninger","title":"Downloadkvalitet og underteksternes nøjagtighed","body":"Lagring bruger en komplet lyd-/videostrøm og sammenfletter ikke separate strømme i høj opløsning. Lokal afspilning afhænger af codec-understøttelsen; valgfri konvertering med FFmpeg kan udelade ekstra lydspor, HDR og indlejrede undertekster. ASS/SSA importerer kun tekst. Automatiske undertekster, oversættelser og tidsbaseret tosproget parring kan indeholde fejl."},{"priority":"P2","category":"Ikke implementeret","title":"Læringshistorik og studieværktøjer","body":"Gendannelse af afspilningshistorik, ordsamlinger, repetition med mellemrum, OCR og udtræk af billedbaserede undertekster er ikke implementeret. Gemte sprogpræferencer er ikke gemte læringsfremskridt."},{"priority":"P2","category":"Sproglig gennemgang","title":"Gennemgang af modersmålstalere","body":"Alle 24 brugerfladesprog og oversatte slogans bestod skiftetestene. Det bekræfter dækning og adfærd, men ikke en professionel gennemgang af hver oversættelse ved en modersmålstaler."}],"gallery":[{"id":"home","title":"Velkomst og hovedforløb","caption":"De fire handlinger på værktøjslinjen, to synlige undertekstvælgere, oversat slogan og tydelig deaktiveret tilstand, før en video åbnes."},{"id":"study","title":"Øvelse sætning for sætning","caption":"demo.mp4 — Sætningssøgning, spring med et klik, forrige / næste, gentagelse, løkker, afspilningshastighed og følg den aktuelle sætning."},{"id":"languages","title":"Første og anden undertekst","caption":"Faktisk skærmbillede af den engelske brugerflades uafhængige undertekstmenuer med engelsk og traditionelt kinesisk som standard."},{"id":"youtube","title":"Åbn et YouTube-link","caption":"Faktisk skærmbillede af linkdialogen i den engelske brugerflade. Når et link åbnes, starter afspilningen, og det valgte undertekstpar anmodes."}],"evidenceSummary":"For 0.5.3 bestod: 105 kernekontroller, 138 modelassertioner, 29 undertekstkontroller, 60 kontroller af videolagring og 317 assertioner for den native brugerflade. Alle 24 sprogvalg blev foretaget i den faktiske menu; seks brugerfladesprog og kompakte tyske layout blev gennemgået.","evidenceLimit":"Lokal afspilning, eksport, tilstandsskift og systemets gemmedialoger blev verificeret. Offlinetestdata og gemmetest med et simuleret hjælpeprogram beviser ikke, at YouTube i øjeblikket tillader download af undertekster eller videoer fra nettet. Ingen brugerloginoplysninger blev importeret."},"fi":{"lang":"fi","name":"Suomi","direction":"ltr","headline":"Opi maailman kieliä nopeammin tekoälyn avulla.","intro":"Tee YouTubesta oma kieliluokkasi. Opi suosikkivideoistasi YouTuben tekstitysten ja automaattisten käännösten avulla: lue kahta kieltä rinnakkain, toista jokainen lause ja säilytä sinulle tärkeä materiaali.","badge":"24 käyttöliittymäkieltä · Monikieliset tekstitykset","notice":"Versio 0.5.3 · Ennakkojulkaisu lähdekoodina · Käännä lähdekoodista","labels":{"language":"Asiakirjan kieli","screenshots":"Näyttökuvat","workflow":"Aloittaminen","features":"Käytettävissä olevat toiminnot","highlights":"Miksi se on hyödyllinen","issues":"Avoimet asiat ja rajoitukset","evidence":"Mitä on varmistettu","readme":"Tekninen README","verification":"Yksityiskohtainen tarkistusraportti","markdown":"Lataa tämä opas Markdown-muodossa","preview":"Suurenna näyttökuva napsauttamalla","close":"Sulje","previous":"Edellinen näyttökuva","next":"Seuraava näyttökuva","priority":"Prioriteetti","category":"Tyyppi","issue":"Asia / seuraava vaihe","languageScope":"24 tarkoittaa käyttöliittymän kielivaihtoehtojen määrää. Tekstityskielet riippuvat valitun videon saatavilla olevista raidoista; kyse ei ole lupauksesta oppia 24 kieltä sujuvasti.","screenshotScope":"Näyttökuvat on otettu varsinaisesta 0.5.3-sovelluksesta. Näyttökuvan kieli ilmoitetaan erikseen tämän asiakirjan kielestä.","fallbackScreenshot":"Näyttökuva englanninkielisestä sovelluksesta","localizedScreenshot":"Näyttökuva sovelluksesta tällä kielellä","license":"Sovelluksen lisenssi on MIT; kolmansien osapuolten osat säilyttävät omat lisenssi-ilmoituksensa. AxonTube ei ole sidoksissa YouTubeen, Googleen tai Appleen.","updated":"Asiakirjan päivämäärä: 2026-10-11"},"steps":[{"title":"1. Avaa YouTube","body":"Liitä videolinkki. Saatavilla olevia tekstityksiä pyydetään automaattisesti: ensimmäiseksi englanti ja toiseksi perinteinen kiina. Ensimmäinen haku voi kestää noin 1–2 minuuttia; saatavuutta ei taata."},{"title":"2. Valitse ja harjoittele","body":"Käytä kahta näkyvää tekstitysten pudotusvalikkoa. Napsauta lausetta siirtyäksesi siihen, toistaaksesi sen uudelleen tai käynnistääksesi lauseen jatkuvan toiston."},{"title":"3. Tallenna tai vie","body":"Tallenna video -toiminnolla valitaan kansio saatavilla olevalle medialle ja tekstityksille. Vie kaksikieliset tekstitykset luo ladatuista tekstityksistä Word-, TXT- tai SRT-tiedostoja."},{"title":"4. Muokkaa itsellesi sopivaksi","body":"Muuta käyttöliittymän kieltä, toistonopeutta, tekstityksen kokoa ja kummankin raidan aikasiirtymää. Sovellus muistaa käyttöliittymän ja tekstitysten kielivalinnat."}],"features":[{"title":"Kaksi riippumatonta tekstitysraitaa","body":"Oletuksena englanti / perinteinen kiina; valitse nykyisen videon saatavilla olevista alkuperäistekstityksistä ja automaattisista käännöksistä. Onnistuneesti haettu ensimmäinen raita pysyy käytettävissä, jos toisen haku epäonnistuu."},{"title":"Harjoittelua lause kerrallaan","body":"Lausehaku, siirtyminen napsauttamalla, edellinen / seuraava, uudelleentoisto, jatkuva toisto, toistonopeus ja nykyisen lauseen seuraaminen."},{"title":"Video ja synkronoidut tekstitykset","body":"Tallennus on käytettävissä myös tekstitysten latautuessa. Jokainen toiminto luo uuden kansion saatavilla olevalle videolle. Kun tekstityksiä on saatavilla, mukaan lisätään ajastetut SRT-raidat ja kaksikieliset lukutiedostot. Myös pelkän videon tallennus on tuettu; keskeneräinen työ säilyy .partial-kansiossa."},{"title":"Vienti Word-, TXT- ja SRT-muotoon","body":"Vie saatavilla olevat tekstitykset aikasiirtymät huomioiden. Word ja TXT yhdistävät tekstit ajallisen päällekkäisyyden perusteella. Jos vain yksi raita on ladattu, sen sisällön voi silti viedä."},{"title":"24 käännettyä käyttöliittymää","body":"Valikot, tilaviestit ja oppimiseen kannustava iskulause vaihtavat kieltä yhdessä. Arabia ja heprea tukevat asettelua oikealta vasemmalle; käyttöliittymän kielen vaihto ei muuta tekstitysten sisältöä."},{"title":"Paikallinen toisto ja selkeät säätimet","body":"Avaa paikalliset media- ja tekstitystiedostot Tiedosto-valikosta. Käytöstä poistetut toiminnot näkyvät himmennettyinä syineen; valitut tilat korostetaan ja merkitään valintamerkein; tallennuksen aikana näytetään varattu tila."}],"highlights":[{"title":"Lyhyt matka katselusta harjoitteluun","body":"Työkalupalkin neljä toimintoa pitävät työnkulun suorana: YouTube → Tallenna video → Tekstitykset → Kieli. Erillistä tekstitysten hakupainiketta ei tarvita."},{"title":"Oppimateriaali, jonka voit säilyttää","body":"Ajastetut tekstitykset ja luettavat Word- / TXT-tiedostot tukevat sekä kuunteluharjoittelua että myöhempää kertausta. Viennit käyttävät uusia kohteita ja säilyttävät alkuperäiset tiedostot."},{"title":"Paikallista käyttöä ilman tekoälyrajapinnan avainta","body":"Paikallinen media ja tallennetut tekstitykse
