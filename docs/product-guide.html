→ Language. No extra caption-fetch button is needed."},{"title":"Learning material you can keep","body":"Timed captions and readable Word / TXT files support both listening practice and later review. Exports use new destinations and preserve original files."},{"title":"Local work, no AI API key","body":"Local media and saved subtitles work offline. YouTube supplies website captions and automatic translations; the app has no telemetry and does not upload local media or require a paid AI API key."}],"issues":[{"priority":"P0","category":"Live-service verification","title":"YouTube caption and video availability","body":"The latest live check hit YouTube's sign-in / bot-verification requirement. Successful current online downloads have not been established. Validate under the intended network and across representative videos before public release."},{"priority":"P1","category":"Platform restriction","title":"Embedding and account-restricted videos","body":"Some authors or videos disallow embedded playback. In-app Google SSO is not implemented; the browser shortcut uses a separate login and playback session. These restrictions cannot be presented as solved."},{"priority":"P1","category":"Distribution and compatibility","title":"Signing and broader Mac testing","body":"The package is ad-hoc signed, without Developer ID notarization. Apple Silicon on macOS 26.5.2 was tested; macOS 27 and Intel Macs were not. macOS 14 is a deployment target, not proof that every version has been tested."},{"priority":"P2","category":"Format and quality limits","title":"Download quality and subtitle fidelity","body":"Saving uses a complete audio/video stream and does not merge separate high-resolution streams. ASS/SSA imports text only. Automatic captions, translations, and timing-based bilingual pairing may contain errors. Local playback depends on codec support; optional FFmpeg conversion may omit extra audio tracks, HDR, and embedded subtitles."},{"priority":"P2","category":"Not implemented","title":"Learning-history and study tools","body":"Playback-history restoration, vocabulary collections, spaced review, OCR, and image-subtitle extraction are not implemented. Saved language preferences are not saved learning progress."},{"priority":"P2","category":"Editorial review","title":"Native-speaker language review","body":"All 24 interface choices and localized slogans passed switching checks. That establishes coverage and behavior, not professional native-speaker review of every translation."}],"gallery":[{"id":"home","title":"Welcome and main workflow","caption":"The four toolbar actions, two visible subtitle selectors, localized slogan, and clear disabled state before a video is opened."},{"id":"study","title":"Sentence-focused practice","caption":"demo.mp4 — Sentence search, click-to-seek, previous / next, replay, looping, playback speed, and following the current sentence."},{"id":"languages","title":"First and second subtitle","caption":"Actual English-interface capture of the independent subtitle dropdowns, defaulting to English and Traditional Chinese."},{"id":"youtube","title":"Open a YouTube link","caption":"Actual English-interface capture of the link dialog. Opening a link starts playback and requests the selected caption pair."}],"evidenceSummary":"For 0.5.3: 105 core checks, 138 model assertions, 29 caption checks, 60 video-save checks, and 317 native-interface assertions passed. All 24 language choices were selected in the actual menu; six interface languages and compact German layouts were reviewed.","evidenceLimit":"Local playback, exports, state transitions, and native save dialogs were verified. Offline fixtures and fake-helper save tests do not prove that YouTube currently permits online caption or video downloads. No user credentials were imported."},"zh-Hans":{"lang":"zh-Hans","name":"简体中文","direction":"ltr","headline":"用 AI，更快掌握世界语言。","intro":"把 YouTube 变成你的私人语言课堂。从热爱的视频出发，借助 YouTube 字幕和自动翻译，双语对照、逐句重听，把感兴趣的内容变成可以反复学习的材料。","badge" 付: 2026-10-11"},"steps":[{"title":"1. YouTube を開く","body":"動画のリンクを貼り付けます。利用可能な字幕を自動で取得し、初期設定では第 1 字幕が英語、第 2 字幕が繁体字中国語です。初回の取得には約 1〜2 分かかる場合があり、必ず取得できるとは限りません。"},{"title":"2. 選んで練習する","body":"画面上の 2 つの字幕メニューを使います。文をクリックしてその位置に移動し、再生し直したり、文のループ再生を有効にしたりできます。"},{"title":"3. 保存・書き出し","body":"「動画を保存」では、取得可能な動画と利用可能な字幕の保存先フォルダを選びます。「対訳字幕を書き出す」では、読み込み済みの字幕から Word、TXT、SRT を作成します。"},{"title":"4. 自分に合わせる","body":"表示言語、再生速度、字幕サイズ、各トラックのタイミング補正を変更できます。表示言語と字幕言語の選択はアプリに保存されます。"}],"features":[{"title":"独立した 2 つの字幕トラック","body":"初期設定は英語 / 繁体字中国語です。現在の動画で利用できる元の字幕と自動翻訳から選択できます。第 2 字幕の取得に失敗しても、取得済みの第 1 字幕は引き続き使えます。"},{"title":"文ごとに集中して練習","body":"文の検索、クリックでの再生位置移動、前後の文への移動、再再生、ループ、再生速度の調整、現在の文への追従に対応しています。"},{"title":"動画と同期字幕をまとめて保存","body":"字幕の読み込み中も保存できます。保存のたびに取得可能な動画用の新しいフォルダを作成し、字幕が利用できる場合は時刻付き SRT トラックと対訳の読み物ファイルも格納します。字幕なしで動画だけを保存することもできます。未完了の処理は .partial フォルダに残ります。"},{"title":"Word・TXT・SRT への書き出し","body":"タイミング補正を適用して利用可能な字幕を書き出します。Word と TXT は時間の重なりに基づいて対訳を組み合わせます。読み込まれているトラックが 1 つだけでも、その内容を書き出せます。"},{"title":"24 言語のインターフェース","body":"メニュー、状態メッセージ、学習スローガンの言語が一緒に切り替わります。アラビア語とヘブライ語は右から左へのレイアウトに対応しています。表示言語を変えても字幕の内容は変わりません。"},{"title":"ローカル再生と分かりやすい操作","body":"「ファイル」メニューからローカルの動画・音声や字幕ファイルを開けます。使えない操作は理由付きで淡く表示され、選択中のモードは強調表示とチェックマークで示されます。保存中は処理中の状態を表示します。"}],"highlights":[{"title":"視聴から練習へ、少ない手順で","body":"ツールバーの 4 つの操作で主要な流れを進められます: YouTube → 動画を保存 → 字幕 → 言語。字幕を取得するための追加ボタンは不要です。"},{"title":"手元に残せる学習教材","body":"時刻付き字幕と読みやすい Word / TXT ファイルは、聞き取り練習にも後からの復習にも使えます。書き出しには新しい保存先を使い、元のファイルを保持します。"},{"title":"ローカルで使える、AI API キー不要","body":"ローカルのメディアと保存済み字幕はオフラインで使えます。Web サイトの字幕と自動翻訳は YouTube が提供します。アプリはテレメトリを収集せず、ローカルのメディアをアップロードせず、有料 AI API のキーも必要ありません。"}],"issues":[{"priority":"P0","category":"ライブサービスの検証","title":"YouTube の字幕・動画の取得可否","body":"直近のオンライン検証では、YouTube によるログイン / ボット確認の要求により取得できませんでした。現在のオンラインダウンロードの成功は確認できていません。公開前に、想定するネットワーク環境と代表的な複数の動画で検証する必要があります。"},{"priority":"P1","category":"プラットフォームの制限","title":"埋め込みとアカウント制限のある動画","body":"投稿者や動画によっては埋め込み再生が許可されていません。アプリ内の Google SSO は未実装です。ブラウザを開くショートカットでは、ログインと再生のセッションは別になります。これらの制限が解消済みであるとは案内できません。"},{"priority":"P1","category":"配布と互換性","title":"署名とより広い Mac 環境での検証","body":"パッケージはアドホック署名で、Developer ID による署名・公証はありません。macOS 26.5.2 の Apple Silicon で検証済みです。macOS 27 と Intel Mac は未検証です。macOS 14 はデプロイ対象の最小バージョンであり、すべてのバージョンを検証した証拠ではありません。"},{"priority":"P2","category":"形式と品質の制限","title":"ダウンロード品質と字幕の再現性","body":"保存には音声と映像が一体のストリームを使い、別々の高解像度ストリームの結合は行いません。ASS/SSA の読み込みはテキストのみです。自動字幕、翻訳、時間に基づく対訳の組み合わせには誤りが含まれる場合があります。 ローカル再生はコーデックの対応状況に依存します。オプションの FFmpeg 変換では、追加の音声トラック、HDR、埋め込み字幕が保持されない場合があります。"},{"priority":"P2","category":"未実装","title":"学習履歴と学習支援ツール","body":"再生履歴の復元、単語帳、間隔を空けた復習、OCR、画像字幕の抽出は未実装です。言語設定の保存は、学習進捗の保存ではありません。"},{"priority":"P2","category":"文章のレビュー","title":"ネイティブ話者による言語レビュー","body":"24 の表示言語と各言語のスローガンは、すべて切り替え検証に合格しました。これは対応範囲と動作を確認するもので、すべての翻訳を専門のネイティブ話者が確認したことを意味しません。"}],"gallery":[{"id":"home","title":"ようこそ画面と基本の操作","caption":"動画を開く前の、ツールバーの 4 つの操作、画面上の 2 つの字幕選択メニュー、各言語のスローガン、明確な無効状態です。"},{"id":"study","title":"文ごとに集中して練習","caption":"demo.mp4 — 文の検索、クリックでの再生位置移動、前後の文への移動、再再生、ループ、再生速度の調整、現在の文への追従に対応しています。"},{"id":"languages","title":"第 1 字幕と第 2 字幕","caption":"英語表示の実際の画面です。独立した 2 つの字幕メニューの初期設定は、英語と繁体字中国語です。"},{"id":"youtube","title":"YouTube のリンクを開く","caption":"英語表示のリンク入力ダイアログの実際の画面です。リンクを開くと再生が始まり、選択した 2 つの字幕を取得します。"}],"evidenceSummary":"0.5.3 では、コア検証 105 件、モデルのアサーション 138 件、字幕検証 29 件、動画保存の検証 60 件、ネイティブ UI のアサーション 317 件が合格しました。実際のメニューで 24 の表示言語すべてを選択し、6 言語の画面とドイツ語のコンパクトレイアウトを確認しました。","evidenceLimit":"ローカル再生、書き出し、状態遷移、ネイティブの保存ダイアログを検証しました。オフラインのテストデータと模擬ヘルパーによる保存テストは、YouTube が現在オンラインでの字幕や動画のダウンロードを許可している証拠にはなりません。ユーザーの認証情報は取り込んでいません。"},"ko":{"lang":"ko","name":"한국어","direction":"ltr","headline":"AI로 세계의 언어를 더 빠르게 배우세요.","intro":"YouTube를 나만의 어학 교실로 바꿔 보세요. YouTube 자막과 자동 번역으로 좋아하는 동영상에서 배우세요. 두 언어를 나란히 읽고, 각 문장을 반복 재생하고, 중요한 학습 자료를 간직할 수 있습니다.","badge":"24개 인터페이스 언어 · 다국어 자막","notice":"버전 0.5.3 · 소스 코드 프리뷰 · 소스에서 빌드","labels":{"language":"문서 언어","screenshots":"스크린샷","workflow":"시작하기","features":"사용 가능한 기능","highlights":"학습에 도움이 되는 점","issues":"미해결 문제와 제한 사항","evidence":"검증된 내용","readme":"기술 README","verification":"상세 검증 기록","markdown":"이 안내서를 Markdown으로 다운로드","preview":"스크린샷을 클릭하면 확대됩니다","close":"닫기","previous":"이전 스크린샷","next":"다음 스크린샷","priority":"우선순위","category":"유형","issue":"문제 / 다음 조치","languageScope":"24는 인터페이스에서 선택할 수 있는 언어 수입니다. 자막 언어는 선택한 동영상에서 제공하는 트랙에 따라 달라지며, 24개 언어를 유창하게 구사하게 된다는 보장은 아닙니다.","screenshotScope":"스크린샷은 실제 0.5.3 앱에서 촬영했습니다. 스크린샷의 표시 언어는 이 문서의 언어와 별도로 표기합니다.","fallbackScreenshot":"영어 인터페이스의 앱 스크린샷","localizedScreenshot":"이 언어로 표시한 앱 스크린샷","license":"앱에는 MIT 라이선스가 적용되며 타사 구성 요소의 고지를 유지합니다. AxonTube는 YouTube, Google 또는 Apple과 제휴하지 않습니다.","updated":"문서 날짜: 2026-10-11"},"steps":[{"title":"1. YouTube 열기","body":"동영상 링크를 붙여 넣으세요. 사용 가능한 자막을 자동으로 요청하며, 기본값은 첫 번째 영어, 두 번째 중국어 번체입니다. 처음 가져올 때는 약 1~2분이 걸릴 수 있으며, 자막 제공 여부는 보장되지 않습니다."},{"title":"2. 선택하고 연습하기","body":"화면에 있는 두 자막 드롭다운을 사용하세요. 문장을 클릭해 해당 위치로 이동하거나, 다시 재생하거나, 문장 반복을 켤 수 있습니다."},{"title":"3. 저장 또는 내보내기","body":"'동영상 저장'에서는 접근 가능한 미디어와 제공되는 자막을 저장할 폴더를 선택합니다. '이중 언어 자막 내보내기'는 불러온 자막으로 Word, TXT 또는 SRT를 만듭니다."},{"title":"4. 나에게 맞추기","body":"인터페이스 언어, 재생 속도, 자막 크기, 각 트랙의 시간 보정값을 바꿀 수 있습니다. 앱은 인터페이스와 자막의 언어 선택을 기억합니다."}],"features":[{"title":"독립적인 두 자막 트랙","body":"기본값은 영어 / 중국어 번체입니다. 현재 동영상에서 제공하는 원본 자막과 자동 번역 중에서 선택하세요. 두 번째 트랙을 가져오지 못해도 성공적으로 불러온 첫 번째 자막은 계속 사용할 수 있습니다."},{"title":"문장에 집중하는 연습","body":"문장 검색, 클릭으로 재생 위치 이동, 이전 / 다음 문장, 다시 재생, 반복, 재생 속도 조절, 현재 문장 따라가기를 지원합니다."},{"title":"동기화된 자막과 동영상 저장","body":"자막을 불러오는 중에도 저장할 수 있습니다. 저장할 때마다 접근 가능한 동영상을 위한 새 폴더를 만들고, 자막이 있으면 시간 정보가 포함된 SRT 트랙과 이중 언어 읽기 파일도 담습니다. 자막 없이 동영상만 저장할 수도 있습니다. 완료되지 않은 작업은 .partial 폴더에 남습니다."},{"title":"Word, TXT, SRT 내보내기","body":"시간 보정값을 적용해 사용 가능한 자막을 내보냅니다. Word와 TXT는 시간이 겹치는 구간을 기준으로 두 언어를 짝짓습니다. 한 트랙만 불러온 경우에도 해당 내용을 내보낼 수 있습니다."},{"title":"24개 언어로 제공되는 인터페이스","body":"메뉴, 상태 메시지, 학습 슬로건의 언어가 함께 바뀝니다. 아랍어와 히브리어는 오른쪽에서 왼쪽으로 읽는 레이아웃을 지원합니다. 인터페이스 언어를 바꿔도 자막 내용은 바뀌지 않습니다."},{"title":"로컬 재생과 명확한 조작 상태","body":"파일 메뉴에서 로컬 미디어와 자막 파일을 엽니다. 사용할 수 없는 동작은 이유와 함께 흐리게 표시하고, 선택한 모드는 강조 표시와 체크 표시로 나타냅니다. 저장 중에는 작업 중 상태를 보여 줍니다."}],"highlights":[{"title":"시청에서 연습까지 간단한 흐름","body":"도구 모음의 네 가지 동작으로 주요 작업을 바로 진행합니다: YouTube → 동영상 저장 → 자막 → 언어. 자막을 가져오는 별도 버튼은 필요하지 않습니다."},{"title":"간직할 수 있는 학습 자료","body":"시간 정보가 포함된 자막과 읽기 편한 Word / TXT 파일은 듣기 연습과 나중에 복습할 때 모두 유용합니다. 새 위치에 내보내므로 원본 파일은 유지됩니다."},{"title":"로컬에서 사용, AI API 키 불필요","body":"로컬 미디어와 저장된 자막은 오프라인에서 사용할 수 있습니다. 웹사이트 자막과 자동 번역은 YouTube가 제공합니다. 앱은 원격 측정 정보를 수집하거나 로컬 미디어를 업로드하지 않으며, 유료 AI API 키도 요구하지 않습니다."}],"issues":[{"priority":"P0","category":"실제 서비스 검증","title":"YouTube 자막과 동영상의 이용 가능 여부","body":"최근 실제 서비스 확인에서는 YouTube의 로그인 / 봇 확인 요구에 막혔습니다. 현재 온라인 다운로드가 성공하는지는 확인되지 않았습니다. 공개 배포 전에 사용하려는 네트워크와 대표적인 여러 동영상에서 검증해야 합니다."},{"priority":"P1","category":"플랫폼 제한","title":"임베드 및 계정 제한이 있는 동영상","body":"일부 제작자나 동영상은 임베드 재생을 허용하지 않습니다. 앱 내 Google SSO는 구현되지 않았습니다. 브라우저 바로가기는 별도의 로그인 및 재생 세션을 사용합니다. 이러한 제한이 해결되었다고 안내할 수 없습니다."},{"priority":"P1","category":"배포와 호환성","title":"서명과 더 폭넓은 Mac 테스트","body":"패키지는 ad-hoc 서명되었으며 Developer ID 공증은 없습니다. macOS 26.5.2의 Apple Silicon에서 테스트했으며, macOS 27과 Intel Mac은 테스트하지 않았습니다. macOS 14는 배포 대상 버전일 뿐, 모든 버전을 테스트했다는 근거가 아닙니다."},{"priority":"P2","category":"형식과 품질 제한","title":"다운로드 품질과 자막 충실도","body":"저장에는 오디오와 비디오가 모두 포함된 스트림을 사용하며, 분리된 고해상도 스트림을 병합하지 않습니다. ASS/SSA에서는 텍스트만 가져옵니다. 자동 자막, 번역, 시간 기준의 이중 언어 짝짓기에는 오류가 있을 수 있습니다. 로컬 재생은 코덱 지원 여부에 따라 달라집니다. 선택 기능인 FFmpeg 변환에서는 추가 오디오 트랙, HDR, 내장 자막이 누락될 수 있습니다."},{"priority":"P2","category":"미구현","title":"학습 기록과 학습 도구","body":"재생 기록 복원, 단어장, 간격 반복 복습, OCR, 이미지 자막 추출은 구현되지 않았습니다. 언어 설정 저장은 학습 진행 상황 저장을 의미하지 않습니다."},{"priority":"P2","category":"문안 검토","title":"원어민 언어 검토","body":"24개 인터페이스 언어와 번역된 슬로건은 모두 전환 검사를 통과했습니다. 이는 지원 범위와 동작을 확인한 것이며, 모든 번역이 전문 원어민 검토를 받았다는 뜻은 아닙니다."}],"gallery":[{"id":"home","title":"환영 화면과 기본 작업 흐름","caption":"동영상을 열기 전의 도구 모음 동작 네 가지, 화면에 표시된 자막 선택기 두 개, 번역된 슬로건, 명확한 비활성 상태입니다."},{"id":"study","title":"문장에 집중하는 연습","caption":"demo.mp4 — 문장 검색, 클릭으로 재생 위치 이동, 이전 / 다음 문장, 다시 재생, 반복, 재생 속도 조절, 현재 문장 따라가기를 지원합니다."},{"id":"languages","title":"첫 번째 자막과 두 번째 자막","caption":"영어 인터페이스의 실제 화면입니다. 독립적인 자막 드롭다운의 기본값은 영어와 중국어 번체입니다."},{"id":"youtube","title":"YouTube 링크 열기","caption":"영어 인터페이스의 링크 대화상자를 실제로 캡처한 화면입니다. 링크를 열면 재생이 시작되고 선택한 두 자막을 요청합니다."}],"evidenceSummary":"0.5.3에서 코어 검사 105개, 모델 단언 138개, 자막 검사 29개, 동영상 저장 검사 60개, 네이티브 인터페이스 단언 317개를 통과했습니다. 실제 메뉴에서 24개 언어를 모두 선택했으며, 6개 인터페이스 언어와 좁은 화면의 독일어 레이아웃을 검토했습니다.","evidenceLimit":"로컬 재생, 내보내기, 상태 전환, 네이티브 저장 대화상자를 검증했습니다. 오프라인 테스트 데이터와 모의 도우미를 사용한 저장 테스트만으로는 YouTube가 현재 온라인 자막 또는 동영상 다운로드를 허용한다는 사실을 입증할 수 없습니다. 사용자 인증 정보는 가져오지 않았습니다."},"es":{"lang":"es","name":"Español","direction":"ltr","headline":"Aprende los idiomas del mundo más rápido con IA.","intro":"Convierte YouTube en tu aula de idiomas personal. Aprende con tus vídeos favoritos gracias a los subtítulos y las traducciones automáticas de YouTube: lee dos idiomas en paralelo, repite cada frase y conserva el material que más te importa.","badge":"24 idiomas de interfaz · Subtítulos multilingües","notice":"Versión 0.5.3 · Vista previa del código fuente · Compila desde el código fuente","labels":{"language":"Idioma del documento","screenshots":"Capturas de pantalla","workflow":"Primeros pasos","features":"Funciones disponibles","highlights":"Por qué resulta útil","issues":"Problemas pendientes y límites","evidence":"Qué se ha verificado","readme":"README técnico","verification":"Registro detallado de verificación","markdown":"Descargar esta guía en Markdown","preview":"Haz clic en una captura para ampliarla","close":"Cerrar","previous":"Captura anterior","next":"Captura siguiente","priority":"Prioridad","category":"Tipo","issue":"Problema / siguiente paso","languageScope":"24 es el número de idiomas disponibles para la interfaz. Los idiomas de los subtítulos dependen de las pistas disponibles en el vídeo elegido; no es una promesa de dominar 24 idiomas.","screenshotScope":"Las capturas proceden de la aplicación real 0.5.3. El idioma de cada captura se indica por separado del idioma de este documento.","fallbackScreenshot":"Captura de la aplicación en inglés","localizedScreenshot":"Captura de la aplicación en este idioma","license":"La aplicación tiene licencia MIT; los componentes de terceros conservan sus avisos. AxonTube no está afiliado a YouTube, Google ni Apple.","updated":"Fecha del documento: 2026-10-11"},"steps":[{"title":"1. Abre YouTube","body":"Pega el enlace de un vídeo. Se solicitan automáticamente los subtítulos disponibles, con inglés como primera pista y chino tradicional como segunda. La primera descarga puede tardar entre 1 y 2 minutos; su disponibilidad no está garantizada."},{"title":"2. Elige y practica","body":"Usa los dos menús desplegables de subtítulos visibles. Haz clic en una frase para ir a ella, volver a reproducirla o activar su repetición en bucle."},{"title":"3. Guarda o exporta","body":"Guardar vídeo permite elegir una carpeta para el contenido accesible y los subtítulos disponibles. Exportar subtítulos bilingües crea archivos Word, TXT o SRT a partir de los subtítulos cargados."},{"title":"4. Adáptalo a ti","body":"Cambia el idioma de la interfaz, la velocidad de reproducción, el tamaño de los subtítulos y el desfase temporal de cada pista. La aplicación recuerda los idiomas elegidos para la interfaz y los subtítulos."}],"features":[{"title":"Dos pistas de subtítulos independientes","body":"Inglés / chino tradicional por defecto; elige entre los originales y las traducciones automáticas disponibles para el vídeo actual. Si falla la segunda pista, los subtítulos de la primera que se hayan obtenido siguen disponibles."},{"title":"Práctica centrada en cada frase","body":"Búsqueda de frases, salto al hacer clic, frase anterior / siguiente, repetición, bucle, velocidad de reproducción y seguimiento de la frase actual."},{"title":"Vídeo con subtítulos sincronizados","body":"Puedes guardar mientras se cargan los subtítulos. Cada operación crea una carpeta nueva para el vídeo accesible y, cuando hay subtítulos disponibles, añade pistas SRT temporizadas y archivos de lectura bilingüe. También puedes guardar solo el vídeo; el trabajo incompleto permanece en una carpeta .partial."},{"title":"Exportación a Word, TXT y SRT","body":"Exporta los subtítulos disponibles con los desfases temporales aplicados. Word y TXT emparejan el texto según la coincidencia temporal. Si solo hay una pista cargada, también puedes exportar su contenido."},{"title":"24 interfaces localizadas","body":"Los menús, los mensajes de estado y el lema de aprendizaje cambian de idioma a la vez. El árabe y el hebreo admiten diseños de derecha a izquierda; cambiar la interfaz no modifica el contenido de los subtítulos."},{"title":"Reproducción local y controles claros","body":"Abre archivos locales de audio, vídeo y subtítulos desde el menú Archivo. Las acciones no disponibles aparecen atenuadas con su motivo; los modos elegidos se resaltan y muestran marcas de selección; al guardar se indica que hay una operación en curso."}],"highlights":[{"title":"De ver a practicar en pocos pasos","body":"Cuatro acciones en la barra de herramientas simplifican el flujo principal: YouTube → Guardar vídeo → Subtítulos → Idioma. No hace falta un botón adicional para obtener subtítulos."},{"title":"Material de aprendizaje que puedes conservar","body":"Los subtítulos temporizados y los archivos Word / TXT de fácil lectura sirven tanto para practicar la comprensión oral como para repasar después. Las exportaciones usan destinos nuevos y conservan los archivos originales."},{"title":"Trabajo local, sin clave de API de IA","body":"Los archivos multimedia locales y los subtítulos guardados funcionan sin conexión. YouTube proporciona los subtítulos del sitio y las traducciones automáticas; la aplicación no tiene telemetría, no sube contenido multimedia local ni requiere una clave de API de IA de pago."}],"issues":[{"priority":"P0","category":"Verificación del servicio real","title":"Disponibilidad de vídeos y subtítulos de YouTube","body":"La última comprobación en línea se encontró con el requisito de inicio de sesión / verificación contra bots de YouTube. No se ha confirmado que las descargas en línea funcionen actualmente. Antes de publicar, hay que validar con la red prevista y una selección representativa de vídeos."},{"priority":"P1","category":"Restricción de la plataforma","title":"Vídeos con restricciones de inserción o de cuenta","body":"Algunos autores o vídeos no permiten la reproducción integrada. No se ha implementado Google SSO dentro de la aplicación; el acceso directo al navegador usa una sesión de inicio de sesión y reproducción independiente. Estas restricciones no pueden presentarse como resueltas."},{"priority":"P1","category":"Distribución y compatibilidad","title":"Firma y pruebas en más Mac","body":"El paquete tiene firma ad hoc, sin notarización con Developer ID. Se probó en Apple Silicon con macOS 26.5.2; no en macOS 27 ni en Mac Intel. macOS 14 es el objetivo de despliegue, no una prueba de que se haya verificado cada versión."},{"priority":"P2","category":"Límites de formato y calidad","title":"Calidad de descarga y fidelidad de los subtítulos","body":"El guardado usa un flujo completo de audio y vídeo y no combina flujos separados de alta resolución. De ASS/SSA solo se importa el texto. Los subtítulos automáticos, las traducciones y el emparejamiento bilingüe por tiempo pueden contener errores. La reproducción local depende de la compatibilidad con los códecs. La conversión opcional con FFmpeg puede omitir pistas de audio adicionales, HDR y subtítulos integrados."},{"priority":"P2","category":"Sin implementar","title":"Historial de aprendizaje y herramientas de estudio","body":"No se han implementado la restauración del historial de reproducción, las colecciones de vocabulario, el repaso espaciado, el OCR ni la extracción de subtítulos en imagen. Guardar las preferencias de idioma no equivale a guardar el progreso de aprendizaje."},{"priority":"P2","category":"Revisión editorial","title":"Revisión lingüística por hablantes nativos","body":"Los 24 idiomas de interfaz y sus lemas localizados superaron las pruebas de cambio de idioma. Esto acredita la cobertura y el comportamiento, no una revisión profesional de todas las traducciones por hablantes nativos."}],"gallery":[{"id":"home","title":"Bienvenida y flujo principal","caption":"Las cuatro acciones de la barra de herramientas, los dos selectores de subtítulos visibles, el lema localizado y el estado desactivado claramente indicado antes de abrir un vídeo."},{"id":"study","title":"Práctica centrada en cada frase","caption":"demo.mp4 — Búsqueda de frases, salto al hacer clic, frase anterior / siguiente, repetición, bucle, velocidad de reproducción y seguimiento de la frase actual."},{"id":"languages","title":"Primer y segundo subtítulo","caption":"Captura real de la interfaz en inglés con los menús independientes de subtítulos, configurados por defecto en inglés y chino tradicional."},{"id":"youtube","title":"Abrir un enlace de YouTube","caption":"Captura real del diálogo de enlace en la interfaz en inglés. Al abrir un enlace, comienza la reproducción y se solicitan las dos pistas de subtítulos elegidas."}],"evidenceSummary":"Para 0.5.3: se superaron 105 comprobaciones del núcleo, 138 aserciones del modelo, 29 comprobaciones de subtítulos, 60 de guardado de vídeo y 317 aserciones de la interfaz nativa. Se seleccionaron los 24 idiomas en el menú real; se revisaron seis idiomas de interfaz y los diseños compactos en alemán.","evidenceLimit":"Se verificaron la reproducción local, las exportaciones, las transiciones de estado y los diálogos nativos de guardado. Los datos de prueba sin conexión y las pruebas de guardado con un auxiliar simulado no demuestran que YouTube permita actualmente descargar subtítulos o vídeos en línea. No se importaron credenciales de usuarios."},"fr":{"lang":"fr","name":"Français","direction":"ltr","headline":"Apprenez les langues du monde plus vite avec l’IA.","intro":"Faites de YouTube votre salle de classe pour apprendre les langues. Avec les sous-titres et les traductions automatiques de YouTube, apprenez à partir des vidéos que vous aimez : lisez deux langues côte à côte, réécoutez chaque phrase et conservez les supports qui comptent pour vous.","badge":"24 langues d’interface · Sous-titres multilingues","notice":"Version 0.5.3 · Aperçu du code source · À compiler depuis les sources","labels":{"language":"Langue du document","screenshots":"Captures d’écran","workflow":"Premiers pas","features":"Fonctions disponibles","highlights":"Ce qui la rend utile","issues":"Problèmes ouverts et limites","evidence":"Ce qui a été vérifié","readme":"README technique","verification":"Compte rendu détaillé des vérifications","markdown":"Télécharger ce guide au format Markdown","preview":"Cliquez sur une capture pour l’agrandir","close":"Fermer","previous":"Capture précédente","next":"Capture suivante","priority":"Priorité","category":"Type","issue":"Problème / prochaine étape","languageScope":"24 désigne le nombre de langues proposées pour l’interface. Les langues des sous-titres dépendent des pistes disponibles pour la vidéo choisie ; ce n’est pas une promesse de maîtriser 24 langues.","screenshotScope":"Les captures proviennent de l’application réelle 0.5.3. La langue de chaque capture est indiquée séparément de celle de ce document.","fallbackScreenshot":"Capture de l’application en anglais","localizedScreenshot":"Capture de l’application dans cette langue","license":"L’application est sous licence MIT ; les composants tiers conservent leurs mentions. AxonTube n’est affilié ni à YouTube, ni à Google, ni à Apple.","updated":"Date du document : 2026-10-11"},"steps":[{"title":"1. Ouvrez YouTube","body":"Collez le lien d’une vidéo. Les sous-titres disponibles sont demandés automatiquement, avec l’anglais en première piste et le chinois traditionnel en seconde. La première récupération peut prendre environ 1 à 2 minutes ; leur disponibilité n’est pas garantie."},{"title":"2. Choisissez et entraînez-vous","body":"Utilisez les deux menus déroulants de sous-titres visibles. Cliquez sur une phrase pour la rejoindre, la réécouter ou activer sa lecture en boucle."},{"title":"3. Enregistrez ou exportez","body":"Enregistrer la vidéo permet de choisir un dossier pour le média accessible et les sous-titres disponibles. Exporter les sous-titres bilingues crée des fichiers Word, TXT ou SRT à partir des sous-titres chargés."},{"title":"4. Adaptez l’application à vos besoins","body":"Modifiez la langue de l’interface, la vitesse de lecture, la taille des sous-titres et le décalage temporel de chaque piste. L’application mémorise les langues choisies pour l’interface et les sous-titres."}],"features":[{"title":"Deux pistes de sous-titres indépendantes","body":"Anglais / chinois traditionnel par défaut ; choisissez parmi les originaux et les traductions automatiques disponibles pour la vidéo en cours. Si la seconde piste échoue, les sous-titres déjà obtenus pour la première restent utilisables."},{"title":"Un entraînement phrase par phrase","body":"Recherche de phrases, accès par clic, phrase précédente / suivante, réécoute, boucle, vitesse de lecture et suivi de la phrase en cours."},{"title":"Vidéo et sous-titres synchronisés","body":"L’enregistrement reste disponible pendant le chargement des sous-titres. Chaque opération crée un nouveau dossier pour la vidéo accessible et, si des sous-titres sont disponibles, y ajoute les pistes SRT horodatées et les fichiers de lecture bilingue. La vidéo peut aussi être enregistrée seule ; le travail incomplet reste dans un dossier .partial."},{"title":"Export Word, TXT et SRT","body":"Exportez les sous-titres disponibles en appliquant les décalages temporels. Word et TXT associent les textes selon le chevauchement temporel. Si une seule piste est chargée, son contenu peut également être exporté."},{"title":"24 interfaces localisées","body":"Les menus, les messages d’état et le slogan d’apprentissage changent de langue ensemble. L’arabe et l’hébreu prennent en charge une présentation de droite à gauche ; changer la langue de l’interface ne modifie pas le contenu des sous-titres."},{"title":"Lecture locale et commandes explicites","body":"Ouvrez les médias et les sous-titres locaux depuis le menu Fichier. Les actions indisponibles sont grisées et accompagnées d’une explication ; les modes sélectionnés sont mis en évidence et cochés ; l’enregistrement affiche un état occupé."}],"highlights":[{"title":"Du visionnage à la pratique en quelques étapes","body":"Quatre actions dans la barre d’outils simplifient le parcours principal : YouTube → Enregistrer la vidéo → Sous-titres → Langue. Aucun bouton supplémentaire n’est nécessaire pour récupérer les sous-titres."},{"title":"Des supports d’apprentissage à conserver","body":"Les sous-titres horodatés et les fichiers Word / TXT faciles à lire servent à la compréhension orale comme aux révisions ultérieures. Les exports utilisent de nouvelles destinations et préservent les fichiers d’origine."},{"title":"Utilisation locale, sans clé d’API d’IA","body":"Les médias locaux et les sous-titres enregistrés fonctionnent hors ligne. YouTube fournit les sous-titres du site et les traductions automatiques ; l’application n’utilise aucune télémétrie, ne téléverse pas les médias locaux et ne nécessite pas de clé d’API d’IA payante."}],"issues":[{"priority":"P0","category":"Vérification du service réel","title":"Disponibilité des vidéos et sous-titres YouTube","body":"La dernière vérification en ligne a été bloquée par la demande de connexion / vérification anti-bot de YouTube. La réussite des téléchargements en ligne n’a pas été établie dans les conditions actuelles. Avant toute publication, il faut valider le fonctionnement sur le réseau prévu et sur un ensemble représentatif de vidéos."},{"priority":"P1","category":"Restriction de la plateforme","title":"Vidéos soumises à des restrictions d’intégration ou de compte","body":"Certains auteurs ou certaines vidéos interdisent la lecture intégrée. Google SSO n’est pas implémenté dans l’application ; le raccourci vers le navigateur utilise une session distincte pour la connexion et la lecture. Ces restrictions ne peuvent pas être présentées comme résolues."},{"priority":"P1","category":"Distribution et compatibilité","title":"Signature et tests sur davantage de Mac","body":"Le paquet porte une signature ad hoc, sans notarisation Developer ID. Apple Silicon sous macOS 26.5.2 a été testé ; macOS 27 et les Mac Intel ne l’ont pas été. macOS 14 est une cible de déploiement, pas la preuve que chaque version a été testée."},{"priority":"P2","category":"Limites de format et de qualité","title":"Qualité des téléchargements et fidélité des sous-titres","body":"L’enregistrement utilise un flux audio/vidéo complet et ne fusionne pas les flux haute résolution séparés. L’import ASS/SSA ne récupère que le texte. Les sous-titres automatiques, les traductions et l’association bilingue fondée sur le temps peuvent comporter des erreurs. La lecture locale dépend des codecs pris en charge. La conversion facultative avec FFmpeg peut omettre les pistes audio supplémentaires, le HDR et les sous-titres intégrés."},{"priority":"P2","category":"Non implémenté","title":"Historique d’apprentissage et outils d’étude","body":"La restauration de l’historique de lecture, les collections de vocabulaire, les révisions espacées, l’OCR et l’extraction de sous-titres en image ne sont pas implémentés. Les préférences linguistiques enregistrées ne constituent pas une progression d’apprentissage sauvegardée."},{"priority":"P2","category":"Révision éditoriale","title":"Relecture linguistique par des locuteurs natifs","body":"Les 24 langues d’interface et leurs slogans localisés ont réussi les tests de changement de langue. Cela confirme la couverture et le comportement, mais pas une relecture professionnelle de chaque traduction par des locuteurs natifs."}],"gallery":[{"id":"home","title":"Accueil et parcours principal","caption":"Les quatre actions de la barre d’outils, les deux sélecteurs de sous-titres visibles, le slogan localisé et l’état désactivé clairement indiqué avant l’ouverture d’une vidéo."},{"id":"study","title":"Un entraînement phrase par phrase","caption":"demo.mp4 — Recherche de phrases, accès par clic, phrase précédente / suivante, réécoute, boucle, vitesse de lecture et suivi de la phrase en cours."},{"id":"languages","title":"Premier et second sous-titre","caption":"Capture réelle de l’interface en anglais montrant les menus de sous-titres indépendants, réglés par défaut sur l’anglais et le chinois traditionnel."},{"id":"youtube","title":"Ouvrir un lien YouTube","caption":"Capture réelle de la boîte de dialogue de lien dans l’interface en anglais. L’ouverture d’un lien lance la lecture et demande les deux pistes de sous-titres sélectionnées."}],"evidenceSummary":"Pour 0.5.3 : 105 vérifications du cœur, 138 assertions du modèle, 29 vérifications des sous-titres, 60 de l’enregistrement vidéo et 317 assertions de l’interface native ont réussi. Les 24 langues ont été sélectionnées dans le menu réel ; six langues d’interface et les dispositions compactes en allemand ont été examinées.","evidenceLimit":"La lecture locale, les exports, les transitions d’état et les boîtes de dialogue natives d’enregistrement ont été vérifiés. Les données de test hors ligne et les tests d’enregistrement avec un auxiliaire simulé ne prouvent pas que YouTube autorise actuellement le téléchargement de sous-titres ou de vidéos en ligne. Aucun identifiant utilisateur n’a été importé."},"de":{"lang":"de","name":"Deutsch","direction":"ltr","headline":"Lerne die Sprachen der Welt schneller mit KI.","intro":"Mach YouTube zu deinem persönlichen Sprachkurs. Lerne mit YouTube-Untertiteln und automatischen Übersetzungen aus deinen Lieblingsvideos: Lies zwei Sprachen nebeneinander, spiele jeden Satz erneut ab und behalte das Lernmaterial, das dir wichtig ist.","badge":"24 Oberflächensprachen · Mehrsprachige Untertitel","notice":"Version 0.5.3 · Quellcode-Vorschau · Aus dem Quellcode kompilieren","labels":{"language":"Dokumentsprache","screenshots":"Screenshots","workflow":"Erste Schritte","features":"Verfügbare Funktionen","highlights":"Was die App nützlich macht","issues":"Offene Punkte und Grenzen","evidence":"Was überprüft wurde","readme":"Technische README","verification":"Ausführlicher Prüfbericht","markdown":"Diesen Leitfaden als Markdown herunterladen","preview":"Zum Vergrößern auf einen Screenshot klicken","close":"Schließen","previous":"Vorheriger Screenshot","next":"Nächster Screenshot","priority":"Priorität","category":"Art","issue":"Problem / nächster Schritt","languageScope":"24 bezeichnet die Anzahl der wählbaren Oberflächensprachen. Die Untertitelsprachen hängen von den verfügbaren Spuren des gewählten Videos ab; fließende Kenntnisse in 24 Sprachen werden damit nicht versprochen.","screenshotScope":"Die Screenshots stammen aus der tatsächlichen Anwendung 0.5.3. Die Sprache eines Screenshots wird unabhängig von der Sprache dieses Dokuments angegeben.","fallbackScreenshot":"Screenshot der Anwendung auf Englisch","localizedScreenshot":"Screenshot der Anwendung in dieser Sprache","license":"Die Anwendung steht unter der MIT-Lizenz; die Hinweise zu Komponenten Dritter bleiben erhalten. AxonTube ist nicht mit YouTube, Google oder Apple verbunden.","updated":"Dokumentdatum: 2026-10-11"},"steps":[{"title":"1. YouTube öffnen","body":"Füge einen Videolink ein. Verfügbare Untertitel werden automatisch angefordert, standardmäßig Englisch als erste und traditionelles Chinesisch als zweite Spur. Der erste Abruf kann etwa 1–2 Minuten dauern; die Verfügbarkeit ist nicht garantiert."},{"title":"2. Auswählen und üben","body":"Nutze die beiden sichtbaren Untertitelmenüs. Klicke auf einen Satz, um dorthin zu springen, ihn erneut abzuspielen oder die Satzschleife zu aktivieren."},{"title":"3. Speichern oder exportieren","body":"Mit „Video speichern“ wählst du einen Ordner für zugängliche Medien und verfügbare Untertitel. „Zweisprachige Untertitel exportieren“ erstellt Word-, TXT- oder SRT-Dateien aus den geladenen Untertiteln."},{"title":"4. An deine Bedürfnisse anpassen","body":"Ändere Oberflächensprache, Wiedergabegeschwindigkeit, Untertitelgröße und den Zeitversatz jeder Spur. Die App merkt sich die gewählten Oberflächen- und Untertitelsprachen."}],"features":[{"title":"Zwei unabhängige Untertitelspuren","body":"Standardmäßig Englisch / traditionelles Chinesisch; wähle aus den verfügbaren Originalen und automatischen Übersetzungen des aktuellen Videos. Erfolgreich geladene Untertitel der ersten Spur bleiben nutzbar, wenn die zweite Spur fehlschlägt."},{"title":"Gezielt Satz für Satz üben","body":"Satzsuche, Sprung per Klick, vorheriger / nächster Satz, erneute Wiedergabe, Schleifen, Wiedergabegeschwindigkeit und automatisches Folgen des aktuellen Satzes."},{"title":"Video mit synchronisierten Untertiteln","body":"Speichern bleibt möglich, während Untertitel geladen werden. Jeder Vorgang erstellt einen neuen Ordner für das zugängliche Video und fügt bei verfügbaren Untertiteln SRT-Spuren mit Zeitangaben sowie zweisprachige Lesedateien hinzu. Auch das Video allein kann gespeichert werden; unvollständige Vorgänge verbleiben in einem .partial-Ordner."},{"title":"Export als Word, TXT und SRT","body":"Exportiere verfügbare Untertitel mit angewendetem Zeitversatz. Word und TXT ordnen die Texte anhand zeitlicher Überschneidungen einander zu. Wenn nur eine Spur geladen ist, lässt sich deren Inhalt ebenfalls exportieren."},{"title":"24 lokalisierte Oberflächen","body":"Menüs, Statusmeldungen und der Lernslogan wechseln gemeinsam die Sprache. Arabisch und Hebräisch unterstützen Layouts von rechts nach links; ein Wechsel der Oberflächensprache verändert die Untertitelinhalte nicht."},{"title":"Lokale Wiedergabe und klare Bedienelemente","body":"Öffne lokale Medien- und Untertiteldateien über das Menü „Datei“. Nicht verfügbare Aktionen sind mit Begründung ausgegraut; gewählte Modi werden hervorgehoben und mit Häkchen markiert; beim Speichern erscheint ein Beschäftigtstatus."}],"highlights":[{"title":"In wenigen Schritten vom Anschauen zum Üben","body":"Vier Aktionen in der Symbolleiste machen den Hauptablauf übersichtlich: YouTube → Video speichern → Untertitel → Sprache. Zum Abrufen der Untertitel ist keine zusätzliche Schaltfläche nötig."},{"title":"Lernmaterial zum Behalten","body":"Untertitel mit Zeitangaben und gut lesbare Word- / TXT-Dateien eignen sich zum Hörtraining und zum späteren Wiederholen. Exporte verwenden neue Speicherziele und erhalten die Originaldateien."},{"title":"Lokal arbeiten, ohne KI-API-Schlüssel","body":"Lokale Medien und gespeicherte Untertitel funktionieren offline. YouTube stellt die Website-Untertitel und automatischen Übersetzungen bereit; die App hat keine Telemetrie, lädt keine lokalen Medien hoch und benötigt keinen kostenpflichtigen KI-API-Schlüssel."}],"issues":[{"priority":"P0","category":"Prüfung des Live-Dienstes","title":"Verfügbarkeit von YouTube-Untertiteln und -Videos","body":"Die letzte Online-Prüfung stieß auf YouTubes Anforderung zur Anmeldung / Bot-Verifizierung. Erfolgreiche aktuelle Online-Downloads sind nicht belegt. Vor einer Veröffentlichung muss die Funktion im vorgesehenen Netzwerk und mit repräsentativen Videos geprüft werden."},{"priority":"P1","category":"Plattformbeschränkung","title":"Videos mit Einbettungs- und Kontobeschränkungen","body":"Manche Urheber oder Videos erlauben keine eingebettete Wiedergabe. Google SSO innerhalb der App ist nicht implementiert; der Browser-Shortcut verwendet eine separate Anmelde- und Wiedergabesitzung. Diese Einschränkungen dürfen nicht als gelöst dargestellt werden."},{"priority":"P1","category":"Verteilung und Kompatibilität","title":"Signierung und Tests auf weiteren Macs","body":"Das Paket ist ad hoc signiert, ohne Developer-ID-Notarisierung. Getestet wurde Apple Silicon mit macOS 26.5.2; macOS 27 und Intel-Macs wurden nicht getestet. macOS 14 ist das Deployment-Ziel, kein Nachweis dafür, dass jede Version geprüft wurde."},{"priority":"P2","category":"Format- und Qualitätsgrenzen","title":"Downloadqualität und Untertiteltreue","body":"Zum Speichern wird ein vollständiger Audio-/Videostream verwendet; separate hochauflösende Streams werden nicht zusammengeführt. Aus ASS/SSA wird nur Text importiert. Automatische Untertitel, Übersetzungen und die zeitbasierte zweisprachige Zuordnung können Fehler enthalten. Lokale Wiedergabe hängt von der Codec-Unterstützung ab. Bei der optionalen FFmpeg-Konvertierung können zusätzliche Audiospuren, HDR und eingebettete Untertitel entfallen."},{"priority":"P2","category":"Nicht implementiert","title":"Lernverlauf und Lernwerkzeuge","body":"Das Wiederherstellen des Wiedergabeverlaufs, Vokabelsammlungen, zeitlich gestaffeltes Wiederholen, OCR und das Extrahieren von Bilduntertiteln sind nicht implementiert. Gespeicherte Spracheinstellungen sind kein gespeicherter Lernfortschritt."},{"priority":"P2","category":"Redaktionelle Prüfung","title":"Sprachprüfung durch Muttersprachler","body":"Alle 24 Oberflächensprachen und lokalisierten Slogans haben die Umschaltprüfungen bestanden. Das bestätigt Abdeckung und Verhalten, aber keine professionelle muttersprachliche Prüfung jeder Übersetzung."}],"gallery":[{"id":"home","title":"Willkommen und Hauptablauf","caption":"Die vier Aktionen der Symbolleiste, zwei sichtbare Untertitelauswahlen, der lokalisierte Slogan und der deutlich erkennbare deaktivierte Zustand vor dem Öffnen eines Videos."},{"id":"study","title":"Gezielt Satz für Satz üben","caption":"demo.mp4 — Satzsuche, Sprung per Klick, vorheriger / nächster Satz, erneute Wiedergabe, Schleifen, Wiedergabegeschwindigkeit und automatisches Folgen des aktuellen Satzes."},{"id":"languages","title":"Erster und zweiter Untertitel","caption":"Echte Aufnahme der englischen Oberfläche mit den unabhängigen Untertitelmenüs, standardmäßig auf Englisch und traditionelles Chinesisch eingestellt."},{"id":"youtube","title":"Einen YouTube-Link öffnen","caption":"Echte Aufnahme des Linkdialogs in der englischen Oberfläche. Das Öffnen eines Links startet die Wiedergabe und fordert die beiden gewählten Untertitelspuren an."}],"evidenceSummary":"Für 0.5.3 bestanden: 105 Kernprüfungen, 138 Modell-Assertions, 29 Untertitelprüfungen, 60 Prüfungen zum Videospeichern und 317 Assertions der nativen Oberfläche. Alle 24 Sprachen wurden im tatsächlichen Menü ausgewählt; sechs Oberflächensprachen und kompakte deutsche Layouts wurden geprüft.","evidenceLimit":"Lokale Wiedergabe, Exporte, Zustandswechsel und native Speicherdialoge wurden überprüft. Offline-Testdaten und Speichertests mit einem simulierten Hilfsprogramm belegen nicht, dass YouTube derzeit Online-Downloads von Untertiteln oder Videos erlaubt. Es wurden keine Benutzeranmeldedaten importiert."},"it":{"lang":"it","name":"Italiano","direction":"ltr","headline":"Impara le lingue del mondo più velocemente con l’IA.","intro":"Trasforma YouTube nella tua aula di lingue personale. Impara con i video che ami grazie ai sottotitoli e alle traduzioni automatiche di YouTube: leggi due lingue affiancate, riascolta ogni frase e conserva il materiale che conta per te.","badge":"24 lingue dell’interfaccia · Sottotitoli multilingue","notice":"Versione 0.5.3 · Anteprima del codice sorgente · Compila dai sorgenti","labels":{"language":"Lingua del documento","screenshots":"Schermate","workflow":"Primi passi","features":"Funzioni disponibili","highlights":"Perché è utile","issues":"Problemi aperti e limiti","evidence":"Cosa è stato verificato","readme":"README tecnico","verification":"Resoconto dettagliato delle verifiche","markdown":"Scarica questa guida in Markdown","preview":"Fai clic su una schermata per ingrandirla","close":"Chiudi","previous":"Schermata precedente","next":"Schermata successiva","priority":"Priorità","category":"Tipo","issue":"Problema / prossimo passo","languageScope":"24 indica il numero di lingue disponibili per l’interfaccia. Le lingue dei sottotitoli dipendono dalle tracce disponibili per il video scelto; non è una promessa di padronanza di 24 lingue.","screenshotScope":"Le schermate sono acquisite dall’applicazione reale 0.5.3. La lingua di ciascuna schermata è indicata separatamente dalla lingua di questo documento.","fallbackScreenshot":"Schermata dell’applicazione in inglese","localizedScreenshot":"Schermata dell’applicazione in questa lingua","license":"L’applicazione usa la licenza MIT; i componenti di terze parti mantengono i propri avvisi. AxonTube non è affiliato a YouTube, Google o Apple.","updated":"Data del documento: 2026-10-11"},"steps":[{"title":"1. Apri YouTube","body":"Incolla il link di un video. I sottotitoli disponibili vengono richiesti automaticamente, con l’inglese come prima traccia e il cinese tradizionale come seconda. Il primo recupero può richiedere circa 1–2 minuti; la disponibilità non è garantita."},{"title":"2. Scegli ed esercitati","body":"Usa i due menu a discesa dei sottotitoli visibili. Fai clic su una frase per raggiungerla, riascoltarla o attivarne la ripetizione in ciclo."},{"title":"3. Salva o esporta","body":"Salva video consente di scegliere una cartella per i contenuti accessibili e i sottotitoli disponibili. Esporta sottotitoli bilingui crea file Word, TXT o SRT a partire dai sottotitoli caricati."},{"title":"4. Adattalo a te","body":"Cambia la lingua dell’interfaccia, la velocità di riproduzione, la dimensione dei sottotitoli e lo scostamento temporale di ogni traccia. L’app ricorda le lingue scelte per l’interfaccia e i sottotitoli."}],"features":[{"title":"Due tracce di sottotitoli indipendenti","body":"Inglese / cinese tradizionale come impostazione predefinita; scegli fra gli originali e le traduzioni automatiche disponibili per il video corrente. Se il recupero della seconda traccia non riesce, i sottotitoli ottenuti per la prima restano utilizzabili."},{"title":"Esercizi incentrati sulle singole frasi","body":"Ricerca di frasi, salto con un clic, frase precedente / successiva, riascolto, ripetizione in ciclo, velocità di riproduzione e scorrimento al seguito della frase corrente."},{"title":"Video con sottotitoli sincronizzati","body":"Il salvataggio resta disponibile durante il caricamento dei sottotitoli. Ogni operazione crea una nuova cartella per il video accessibile e, quando sono disponibili sottotitoli, aggiunge le tracce SRT temporizzate e i file di lettura bilingue. È possibile salvare anche il solo video; il lavoro incompleto rimane in una cartella .partial."},{"title":"Esportazione in Word, TXT e SRT","body":"Esporta i sottotitoli disponibili applicando gli scostamenti temporali. Word e TXT abbinano i testi in base alla sovrapposizione temporale. Se è caricata una sola traccia, puoi comunque esportarne il contenuto."},{"title":"24 interfacce localizzate","body":"Menu, messaggi di stato e slogan di apprendimento cambiano lingua insieme. Arabo ed ebraico supportano layout da destra a sinistra; cambiare l’interfaccia non modifica il contenuto dei sottotitoli."},{"title":"Riproduzione locale e comandi chiari","body":"Apri file multimediali e sottotitoli locali dal menu File. Le azioni non disponibili sono attenuate e accompagnate dal motivo; le modalità selezionate sono evidenziate e contrassegnate da un segno di spunta; durante il salvataggio viene mostrato uno stato occupato."}],"highlights":[{"title":"Dalla visione alla pratica in pochi passi","body":"Quattro azioni nella barra degli strumenti rendono diretto il percorso principale: YouTube → Salva video → Sottotitoli → Lingua. Non serve un pulsante aggiuntivo per recuperare i sottotitoli."},{"title":"Materiale di studio da conservare","body":"I sottotitoli temporizzati e i file Word / TXT facili da leggere servono sia per esercitare l’ascolto sia per ripassare in seguito. Le esportazioni usano nuove destinazioni e preservano i file originali."},{"title":"Lavoro locale, senza chiavi API di IA","body":"I file multimediali locali e i sottotitoli salvati funzionano offline. YouTube fornisce i sottotitoli del sito e le traduzioni automatiche; l’app non usa telemetria, non carica online i contenuti multimediali locali e non richiede una chiave API di IA a pagamento."}],"issues":[{"priority":"P0","category":"Verifica del servizio reale","title":"Disponibilità di video e sottotitoli YouTube","body":"L’ultima verifica online si è fermata alla richiesta di accesso / verifica anti-bot di YouTube. Il successo dei download online nelle condizioni attuali non è stato accertato. Prima della pubblicazione, occorre verificare sulla rete prevista e su un insieme rappresentativo di video."},{"priority":"P1","category":"Restrizione della piattaforma","title":"Video con restrizioni di incorporamento o di account","body":"Alcuni autori o video non consentono la riproduzione incorporata. Google SSO nell’app non è implementato; il collegamento al browser usa una sessione di accesso e riproduzione separata. Queste restrizioni non possono essere presentate come risolte."},{"priority":"P1","category":"Distribuzione e compatibilità","title":"Firma e test su più Mac","body":"Il pacchetto ha una firma ad hoc, senza notarizzazione Developer ID. Sono stati eseguiti test su Apple Silicon con macOS 26.5.2; macOS 27 e i Mac Intel non sono stati testati. macOS 14 è il target di distribuzione, non la prova che ogni versione sia stata verificata."},{"priority":"P2","category":"Limiti di formato e qualità","title":"Qualità dei download e fedeltà dei sottotitoli","body":"Il salvataggio usa un flusso completo audio/video e non unisce flussi separati ad alta risoluzione. Da ASS/SSA viene importato solo il testo. Sottotitoli automatici, traduzioni e abbinamento bilingue basato sui tempi possono contenere errori. La riproduzione locale dipende dai codec supportati. La conversione facoltativa con FFmpeg può omettere tracce audio aggiuntive, HDR e sottotitoli incorporati."},{"priority":"P2","category":"Non implementato","title":"Cronologia di apprendimento e strumenti di studio","body":"Ripristino della cronologia di riproduzione, raccolte di vocaboli, ripasso dilazionato, OCR ed estrazione di sottotitoli da immagini non sono implementati. Le preferenze linguistiche salvate non sono progressi di apprendimento salvati."},{"priority":"P2","category":"Revisione editoriale","title":"Revisione linguistica da parte di madrelingua","body":"Tutte le 24 lingue dell’interfaccia e gli slogan localizzati hanno superato le verifiche di cambio lingua. Questo conferma copertura e comportamento, non una revisione professionale di ogni traduzione da parte di madrelingua."}],"gallery":[{"id":"home","title":"Benvenuto e flusso principale","caption":"Le quattro azioni della barra degli strumenti, i due selettori di sottotitoli visibili, lo slogan localizzato e lo stato disabilitato chiaramente indicato prima di aprire un video."},{"id":"study","title":"Esercizi incentrati sulle singole frasi","caption":"demo.mp4 — Ricerca di frasi, salto con un clic, frase precedente / successiva, riascolto, ripetizione in ciclo, velocità di riproduzione e scorrimento al seguito della frase corrente."},{"id":"languages","title":"Primo e secondo sottotitolo","caption":"Schermata reale dell’interfaccia in inglese con i menu indipendenti dei sottotitoli, impostati per default su inglese e cinese tradizionale."},{"id":"youtube","title":"Aprire un link YouTube","caption":"Schermata reale della finestra del link nell’interfaccia in inglese. L’apertura di un link avvia la riproduzione e richiede le due tracce di sottotitoli selezionate."}],"evidenceSummary":"Per 0.5.3: superati 105 controlli del nucleo, 138 asserzioni del modello, 29 controlli dei sottotitoli, 60 controlli del salvataggio video e 317 asserzioni dell’interfaccia nativa. Tutte le 24 lingue sono state selezionate nel menu reale; sono state esaminate sei lingue dell’interfaccia e i layout compatti in tedesco.","evidenceLimit":"Sono stati verificati riproduzione locale, esportazioni, transizioni di stato e finestre native di salvataggio. I dati di prova offline e i test di salvataggio con un programma ausiliario simulato non dimostrano che YouTube consenta attualmente di scaricare sottotitoli o video online. Non sono state importate credenziali degli utenti."},"pt":{"lang":"pt","name":"Português","direction":"ltr","headline":"Aprenda os idiomas do mundo mais rápido com IA.","intro":"Transforme o YouTube na sua própria sala de aula de idiomas. Use as legendas e traduções automáticas do YouTube para aprender com os vídeos que você adora: leia dois idiomas lado a lado, repita cada frase e guarde o material que importa.","badge":"24 idiomas de interface · Legendas multilíngues","notice":"Versão 0.5.3 · Prévia do código-fonte · Compile a partir do código-fonte","labels":{"language":"Idioma do documento","screenshots":"Capturas de tela","workflow":"Primeiros passos","features":"Recursos disponíveis","highlights":"Por que é útil","issues":"Problemas em aberto e limites","evidence":"O que foi verificado","readme":"README técnico","verification":"Registro detalhado de verificação","markdown":"Baixar este guia em Markdown","preview":"Clique em uma captura para ampliar","close":"Fechar","previous":"Captura anterior","next":"Próxima captura","priority":"Prioridade","category":"Tipo","issue":"Problema / próximo passo","languageScope":"24 é o número de idiomas disponíveis para a interface. Os idiomas das legendas dependem das faixas disponíveis no vídeo escolhido; isso não é uma promessa de fluência em 24 idiomas.","screenshotScope":"As capturas foram feitas no aplicativo real 0.5.3. O idioma de cada captura é indicado separadamente do idioma deste documento.","fallbackScreenshot":"Captura do aplicativo em inglês","localizedScreenshot":"Captura do aplicativo neste idioma","license":"O aplicativo usa a licença MIT; os componentes de terceiros mantêm seus avisos. AxonTube não é afiliado ao YouTube, ao Google ou à Apple.","updated":"Data do documento: 2026-10-11"},"steps":[{"title":"1. Abra o YouTube","body":"Cole o link de um vídeo. As legendas disponíveis são solicitadas automaticamente, com inglês na primeira faixa e chinês tradicional na segunda. A primeira obtenção pode levar cerca de 1 a 2 minutos; a disponibilidade não é garantida."},{"title":"2. Escolha e pratique","body":"Use os dois menus suspensos de legendas visíveis. Clique em uma frase para ir até ela, reproduzi-la novamente ou ativar a repetição em loop."},{"title":"3. Salve ou exporte","body":"Salvar vídeo permite escolher uma pasta para a mídia acessível e as legendas disponíveis. Exportar legendas bilíngues cria arquivos Word, TXT ou SRT a partir das legendas carregadas."},{"title":"4. Ajuste ao seu jeito","body":"Mude o idioma da interface, a velocidade de reprodução, o tamanho das legendas e o deslocamento de tempo de cada faixa. O aplicativo lembra os idiomas escolhidos para a interface e as legendas."}],"features":[{"title":"Duas faixas de legendas independentes","body":"Inglês / chinês tradicional por padrão; escolha entre os originais e as traduções automáticas disponíveis no vídeo atual. Se a segunda faixa falhar, as legendas obtidas com sucesso para a primeira continuam utilizáveis."},{"title":"Prática focada em cada frase","body":"Busca de frases, salto com um clique, frase anterior / seguinte, reprodução novamente, repetição em loop, velocidade de reprodução e acompanhamento da frase atual."},{"title":"Vídeo com legendas sincronizadas","body":"É possível salvar enquanto as legendas carregam. Cada operação cria uma nova pasta para o vídeo acessível e, quando há legendas disponíveis, adiciona faixas SRT temporizadas e arquivos de leitura bilíngue. Também é possível salvar apenas o vídeo; o trabalho incompleto permanece em uma pasta .partial."},{"title":"Exportação para Word, TXT e SRT","body":"Exporte as legendas disponíveis com os deslocamentos de tempo aplicados. Word e TXT associam os textos pela sobreposição de tempo. Se apenas uma faixa estiver carregada, seu conteúdo também poderá ser exportado."},{"title":"24 interfaces localizadas","body":"Menus, mensagens de status e o slogan de aprendizado mudam de idioma juntos. Árabe e hebraico oferecem layouts da direita para a esquerda; mudar a interface não altera o conteúdo das legendas."},{"title":"Reprodução local e controles claros","body":"Abra arquivos locais de mídia e legendas pelo menu Arquivo. Ações indisponíveis aparecem esmaecidas com o motivo; os modos selecionados têm destaque e marcas de seleção; durante o salvamento, o aplicativo indica que está ocupado."}],"highlights":[{"title":"De assistir a praticar em poucos passos","body":"Quatro ações na barra de ferramentas tornam o fluxo principal direto: YouTube → Salvar vídeo → Legendas → Idioma. Não é necessário um botão extra para obter legendas."},{"title":"Material de aprendizado para guardar","body":"Legendas temporizadas e arquivos Word / TXT de fácil leitura ajudam tanto na prática de escuta quanto na revisão posterior. As exportações usam novos destinos e preservam os arquivos originais."},{"title":"Uso local, sem chave de API de IA","body":"Mídias locais e legendas salvas funcionam offline. O YouTube fornece as legendas do site e as traduções automáticas; o aplicativo não tem telemetria, não envia mídias locais e não exige uma chave de API de IA paga."}],"issues":[{"priority":"P0","category":"Verificação do serviço real","title":"Disponibilidade de vídeos e legendas do YouTube","body":"A última verificação online foi bloqueada pela exigência de login / verificação contra bots do YouTube. O sucesso dos downloads online nas condições atuais não foi confirmado. Antes da publicação, é necessário validar na rede prevista e com uma seleção representativa de vídeos."},{"priority":"P1","category":"Restrição da plataforma","title":"Vídeos com restrições de incorporação ou de conta","body":"Alguns autores ou vídeos não permitem reprodução incorporada. O Google SSO dentro do aplicativo não está implementado; o atalho para o navegador usa uma sessão separada de login e reprodução. Essas restrições não podem ser apresentadas como resolvidas."},{"priority":"P1","category":"Distribuição e compatibilidade","title":"Assinatura e testes em mais Macs","body":"O pacote tem assinatura ad hoc, sem notarização com Developer ID. Foi testado em Apple Silicon com macOS 26.5.2; macOS 27 e Macs Intel não foram testados. macOS 14 é o alvo de implantação, não uma prova de que todas as versões foram testadas."},{"priority":"P2","category":"Limites de formato e qualidade","title":"Qualidade do download e fidelidade das legendas","body":"O salvamento usa um fluxo completo de áudio e vídeo e não combina fluxos separados de alta resolução. A importação ASS/SSA traz apenas o texto. Legendas automáticas, traduções e associação bilíngue baseada no tempo podem conter erros. A reprodução local depende do suporte a codecs. A conversão opcional com FFmpeg pode omitir faixas de áudio adicionais, HDR e legendas incorporadas."},{"priority":"P2","category":"Não implementado","title":"Histórico de aprendizado e ferramentas de estudo","body":"Restauração do histórico de reprodução, coleções de vocabulário, revisão espaçada, OCR e extração de legendas em imagem não estão implementados. Preferências de idioma salvas não são progresso de aprendizado salvo."},{"priority":"P2","category":"Revisão editorial","title":"Revisão linguística por falantes nativos","body":"Todos os 24 idiomas da interface e os slogans localizados passaram nas verificações de troca de idioma. Isso comprova cobertura e comportamento, mas não uma revisão profissional de cada tradução por falantes nativos."}],"gallery":[{"id":"home","title":"Boas-vindas e fluxo principal","caption":"As quatro ações da barra de ferramentas, os dois seletores de legendas visíveis, o slogan localizado e o estado desativado claramente indicado antes de abrir um vídeo."},{"id":"study","title":"Prática focada em cada frase","caption":"demo.mp4 — Busca de frases, salto com um clique, frase anterior / seguinte, reprodução novamente, repetição em loop, velocidade de reprodução e acompanhamento da frase atual."},{"id":"languages","title":"Primeira e segunda legenda","caption":"Captura real da interface em inglês com os menus independentes de legendas, definidos por padrão como inglês e chinês tradicional."},{"id":"youtube","title":"Abrir um link do YouTube","caption":"Captura real da caixa de diálogo de link na interface em inglês. Abrir um link inicia a reprodução e solicita as duas faixas de legendas selecionadas."}],"evidenceSummary":"Para 0.5.3: passaram 105 verificações do núcleo, 138 asserções do modelo, 29 verificações de legendas, 60 de salvamento de vídeo e 317 asserções da interface nativa. Todos os 24 idiomas foram selecionados no menu real; foram revisados seis idiomas de interface e os layouts compactos em alemão.","evidenceLimit":"Foram verificados a reprodução local, as exportações, as transições de estado e as caixas de diálogo nativas de salvamento. Dados de teste offline e testes de salvamento com um auxiliar simulado não provam que o YouTube permita atualmente downloads online de legendas ou vídeos. Nenhuma credencial de usuário foi importada."},"ru":{"lang":"ru","name":"Русский","direction":"ltr","headline":"Учите языки мира быстрее с ИИ.","intro":"Превратите YouTube в свой личный языковой класс. Учитесь по любимым видео с субтитрами и автоматическими переводами YouTube: читайте тексты на двух языках рядом, переслушивайте каждое предложение и сохраняйте важные для вас материалы.","badge":"24 языка интерфейса · Многоязычные субтитры","notice":"Версия 0.5.3 · Предварительный выпуск исходного кода · Сборка из исходников","labels":{"language":"Язык документа","screenshots":"Снимки экрана","workflow":"Начало работы","features":"Доступные функции","highlights":"Чем это полезно","issues":"Нерешённые вопросы и ограничения","evidence":"Что проверено","readme":"Технический README","verification":"Подробный отчёт о проверках","markdown":"Скачать руководство в формате Markdown","preview":"Нажмите на снимок, чтобы увеличить","close":"Закрыть","previous":"Предыдущий снимок","next":"Следующий снимок","priority":"Приоритет","category":"Тип","issue":"Вопрос / следующий шаг","languageScope":"Число 24 означает количество языков интерфейса. Языки субтитров зависят от дорожек выбранного видео; это не обещание свободного владения 24 языками.","screenshotScope":"Снимки сделаны в реальном приложении версии 0.5.3. Язык интерфейса на снимке указан отдельно от языка этого документа.","fallbackScreenshot":"Снимок приложения с английским интерфейсом","localizedScreenshot":"Снимок приложения на этом языке","license":"Приложение распространяется по лицензии MIT; для сторонних компонентов сохраняются их уведомления. AxonTube не связан с YouTube, Google или Apple.","updated":"Дата документа: 2026-10-11"},"steps":[{"title":"1. Откройте YouTube","body":"Вставьте ссылку на видео. Доступные субтитры запрашиваются автоматически: первая дорожка — английская, вторая — на традиционном китайском. Первое получение может занять около 1–2 минут; доступность не гарантируется."},{"title":"2. Выбирайте и практикуйтесь","body":"Используйте два раскрывающихся списка субтитров. Нажмите на предложение, чтобы перейти к нему, повторить его или включить циклическое воспроизведение."},{"title":"3. Сохраните или экспортируйте","body":"Команда «Сохранить видео» позволяет выбрать папку для доступного видео и субтитров. «Экспортировать двуязычные субтитры» создаёт файлы Word, TXT или SRT из загруженных субтитров."},{"title":"4. Настройте под себя","body":"Меняйте язык интерфейса, скорость воспроизведения, размер субтитров и временное смещение каждой дорожки. Приложение запоминает выбранные языки интерфейса и субтитров."}],"features":[{"title":"Две независимые дорожки субтитров","body":"По умолчанию выбраны английский и традиционный китайский. Можно выбрать доступные для текущего видео оригиналы и автоматические переводы. Если вторая дорожка не загрузилась, успешно загруженная первая остаётся доступной."},{"title":"Практика по предложениям","body":"Поиск предложений, переход нажатием, предыдущее / следующее предложение, повтор, циклическое воспроизведение, настройка скорости и отслеживание текущего предложения."},{"title":"Видео с синхронизированными субтитрами","body":"Сохранение доступно и во время загрузки субтитров. Каждая операция создаёт новую папку с доступным видео; при наличии субтитров добавляются дорожки SRT с временными метками и двуязычные файлы для чтения. Поддерживается и сохранение видео без субтитров. Незавершённые результаты остаются в папке .partial."},{"title":"Экспорт в Word, TXT и SRT","body":"Экспортируйте доступные субтитры с учётом временных смещений. В Word и TXT строки двух дорожек сопоставляются по пересечению временных интервалов. Если загружена только одна дорожка, её содержимое всё равно можно экспортировать."},{"title":"Интерфейс на 24 языках","body":"Меню, сообщения о состоянии и девиз об обучении меняют язык одновременно. Для арабского и иврита поддерживается компоновка справа налево; смена языка интерфейса не изменяет текст субтитров."},{"title":"Локальное воспроизведение и понятное управление","body":"Открывайте локальные медиафайлы и субтитры через меню «Файл». Недоступные действия затемнены и снабжены пояснениями; выбранные режимы выделены и отмечены галочками; при сохранении отображается состояние занятости."}],"highlights":[{"title":"От просмотра к практике за несколько шагов","body":"Четыре действия на панели инструментов задают простой порядок работы: YouTube → Сохранить видео → Субтитры → Язык. Дополнительная кнопка получения субтитров не нужна."},{"title":"Учебные материалы, которые можно сохранить","body":"Субтитры с временными метками и удобные для чтения файлы Word / TXT подходят для тренировки аудирования и дальнейшего повторения. Экспорт выполняется в новое место и сохраняет исходные файлы."},{"title":"Локальная работа без API-ключа ИИ","body":"Локальные медиафайлы и сохранённые субтитры работают без интернета. Субтитры сайта и автоматические переводы предоставляет YouTube; приложение не собирает телеметрию, не отправляет локальные медиафайлы и не требует платного API-ключа ИИ."}],"issues":[{"priority":"P0","category":"Проверка онлайн-сервиса","title":"Доступность субтитров и видео YouTube","body":"Последняя проверка онлайн столкнулась с требованием YouTube войти в аккаунт / подтвердить, что запрос выполняет не бот. Успешное скачивание из интернета в текущих условиях не подтверждено. Перед публичным выпуском проверьте работу в предполагаемой сети на характерной выборке видео."},{"priority":"P1","category":"Ограничение платформы","title":"Встраивание и видео с ограничениями по аккаунту","body":"Для некоторых авторов или видео встроенное воспроизведение запрещено. Единый вход Google SSO внутри приложения не реализован; переход в браузер использует отдельные сеансы входа и воспроизведения. Нельзя представлять эти ограничения как устранённые."},{"priority":"P1","category":"Распространение и совместимость","title":"Подпись и проверка на других Mac","body":"Пакет имеет подпись ad-hoc без нотариального заверения Developer ID. Проверен Mac с Apple Silicon на macOS 26.5.2; macOS 27 и Mac с Intel не проверялись. macOS 14 — целевая минимальная версия, а не доказательство проверки всех версий."},{"priority":"P2","category":"Ограничения форматов и качества","title":"Качество скачивания и точность субтитров","body":"При сохранении используется единый поток с видео и аудио; отдельные потоки высокого разрешения не объединяются. Локальное воспроизведение зависит от поддержки кодеков. При необязательной конвертации через FFmpeg могут не сохраниться дополнительные аудиодорожки, HDR и встроенные субтитры. Из ASS/SSA импортируется только текст. Автоматические субтитры, переводы и сопоставление двух языков по времени могут содержать ошибки."},{"priority":"P2","category":"Не реализовано","title":"История обучения и учебные инструменты","body":"Восстановление истории воспроизведения, словари изучаемых слов, интервальное повторение, OCR и извлечение субтитров из изображений не реализованы. Сохранённые языковые настройки не означают сохранённый прогресс обучения."},{"priority":"P2","category":"Редакторская проверка","title":"Проверка переводов носителями языка","body":"Все 24 языка интерфейса и локализованные девизы прошли проверку переключения. Это подтверждает охват и поведение, но не профессиональную проверку каждого перевода носителем языка."}],"gallery":[{"id":"home","title":"Приветствие и основной порядок работы","caption":"Четыре действия на панели инструментов, два видимых списка выбора субтитров, локализованный девиз и ясное отображение недоступных действий до открытия видео."},{"id":"study","title":"Практика по предложениям","caption":"demo.mp4 — Поиск предложений, переход нажатием, предыдущее / следующее предложение, повтор, циклическое воспроизведение, настройка скорости и отслеживание текущего предложения."},{"id":"languages","title":"Первая и вторая дорожки субтитров","caption":"Реальный снимок английского интерфейса с независимыми списками субтитров; по умолчанию выбраны английский и традиционный китайский."},{"id":"youtube","title":"Открытие ссылки YouTube","caption":"Реальный снимок диалога ввода ссылки в английском интерфейсе. Открытие ссылки запускает воспроизведение и запрос выбранной пары субтитров."}],"evidenceSummary":"Для версии 0.5.3 пройдены 105 основных проверок, 138 проверок модели, 29 проверок субтитров, 60 проверок сохранения видео и 317 проверок нативного интерфейса. Все 24 языка были выбраны в реальном меню; проверены интерфейсы на шести языках и компактные компоновки на немецком.","evidenceLimit":"Проверены локальное воспроизведение, экспорт, переходы состояний и системные диалоги сохранения. Офлайн-наборы тестовых данных и тесты сохранения с имитацией вспомогательного процесса не доказывают, что YouTube сейчас разрешает скачивание субтитров или видео из интернета. Учётные данные пользователей не импортировались."},"ar":{"lang":"ar","name":"العربية","direction":"rtl","headline":"تعلّم لغات العالم أسرع مع الذكاء الاصطناعي.","intro":"حوّل YouTube إلى صفّك الخاص لتعلّم اللغات. استخدم نصوص YouTube المصاحبة للفيديو وترجماته الآلية لتتعلّم من الفيديوهات التي تحبها: اقرأ لغتين جنبًا إلى جنب، وأعد تشغيل كل جملة، واحتفظ بالمحتوى الذي يهمّك.","badge":"24 لغة للواجهة · ترجمات نصية متعددة اللغات","notice":"الإصدار 0.5.3 · إصدار أولي للشفرة المصدرية · البناء من المصدر","labels":{"language":"لغة المستند","screenshots":"لقطات الشاشة","workflow":"البدء","features":"الميزات المتاحة","highlights":"ما الذي يجعله مفيدًا","issues":"المشكلات والقيود القائمة","evidence":"ما تم التحقق منه","readme":"ملف README التقني","verification":"سجل التحقق التفصيلي","markdown":"تنزيل هذا الدليل بصيغة Markdown","preview":"انقر على لقطة الشاشة لتكبيرها","close":"إغلاق","previous":"لقطة الشاشة السابقة","next":"لقطة الشاشة التالية","priority":"الأولوية","category":"النوع","issue":"المشكلة / الخطوة التالية","languageScope":"يشير العدد 24 إلى خيارات لغة الواجهة. تعتمد لغات الترجمة النصية على المسارات المتاحة للفيديو المختار؛ ولا يمثّل ذلك وعدًا بإتقان 24 لغة.","screenshotScope":"التُقطت الصور من التطبيق الفعلي بالإصدار 0.5.3. تُذكر لغة الواجهة في اللقطة بشكل منفصل عن لغة هذا المستند.","fallbackScreenshot":"لقطة للتطبيق بواجهة إنجليزية","localizedScreenshot":"لقطة للتطبيق بهذه اللغة","license":"التطبيق مرخّص بموجب MIT؛ وتحتفظ مكوّنات الجهات الأخرى بإشعاراتها. لا يتبع AxonTube أيًا من YouTube أو Google أو Apple.","updated":"تاريخ المستند: 2026-10-11"},"steps":[{"title":"1. افتح YouTube","body":"الصق رابط فيديو. تُطلب الترجمات النصية المتاحة تلقائيًا، بالإنجليزية للمسار الأول والصينية التقليدية للثاني. قد يستغرق الجلب الأول نحو 1–2 دقيقة؛ ولا يُضمن توفر الترجمات."},{"title":"2. اختر وتدرّب","body":"استخدم قائمتي الترجمة النصية الظاهرتين. انقر على جملة للانتقال إليها، أو أعد تشغيلها، أو فعّل تكرارها المستمر."},{"title":"3. احفظ أو صدّر","body":"يتيح «حفظ الفيديو» اختيار مجلد للوسائط التي يمكن الوصول إليها والترجمات المتاحة. وينشئ «تصدير الترجمات ثنائية اللغة» ملفات Word أو TXT أو SRT من الترجمات المحمّلة."},{"title":"4. اضبطه كما يناسبك","body":"غيّر لغة الواجهة وسرعة التشغيل وحجم الترجمة والإزاحة الزمنية لكل مسار. يتذكّر التطبيق خيارات لغة الواجهة ولغات الترجمة."}],"features":[{"title":"مساران مستقلان للترجمة النصية","body":"الافتراضي هو الإنجليزية والصينية التقليدية؛ ويمكنك الاختيار من الترجمات الأصلية والترجمات الآلية المتاحة للفيديو الحالي. يظل المسار الأول صالحًا للاستخدام إذا نجح تحميله وفشل المسار الثاني."},{"title":"تدريب يركّز على الجملة","body":"البحث عن الجمل، والانتقال بالنقر، والجملة السابقة / التالية، وإعادة التشغيل، والتكرار المستمر، وضبط السرعة، ومتابعة الجملة الحالية."},{"title":"فيديو مع ترجمات متزامنة","body":"يظل الحفظ متاحًا أثناء تحميل الترجمات. تنشئ كل عملية مجلدًا جديدًا يضم الفيديو الذي يمكن الوصول إليه؛ وعند توفر الترجمات، تُضاف مسارات SRT مع توقيتها وملفات قراءة ثنائية اللغة. يمكن أيضًا حفظ الفيديو دون ترجمات. وتبقى النتائج غير المكتملة في مجلد .partial."},{"title":"التصدير إلى Word وTXT وSRT","body":"صدّر الترجمات المتاحة بعد تطبيق الإزاحات الزمنية. يقترن النص في Word وTXT وفق تداخل الفترات الزمنية. إذا حُمّل مسار واحد فقط، يظل بالإمكان تصدير محتواه."},{"title":"واجهات مترجمة إلى 24 لغة","body":"تتغيّر لغة القوائم ورسائل الحالة وشعار التعلّم معًا. تدعم العربية والعبرية التخطيط من اليمين إلى اليسار؛ ولا يغيّر تبديل لغة الواجهة محتوى الترجمة النصية."},{"title":"تشغيل محلي وتحكّم واضح","body":"افتح ملفات الوسائط والترجمة المحلية من قائمة «ملف». تظهر الإجراءات المعطّلة باهتة مع توضيح السبب؛ وتُبرز الأوضاع المختارة بعلامات تحديد؛ ويظهر مؤشر انشغال أثناء الحفظ."}],"highlights":[{"title":"خطوات قليلة من المشاهدة إلى التدريب","body":"أربعة إجراءات في شريط الأدوات تجعل المسار الأساسي مباشرًا: YouTube → حفظ الفيديو → الترجمات → اللغة. لا حاجة إلى زر إضافي لجلب الترجمات."},{"title":"مواد تعليمية يمكنك الاحتفاظ بها","body":"تدعم الترجمات المرفقة بتوقيت وملفات Word / TXT سهلة القراءة تدريب الاستماع والمراجعة لاحقًا. تُحفظ الصادرات في وجهات جديدة مع الحفاظ على الملفات الأصلية."},{"title":"عمل محلي دون مفتاح API للذكاء الاصطناعي","body":"تعمل الوسائط المحلية والترجمات المحفوظة دون اتصال. يوفّر YouTube ترجمات الموقع والترجمة الآلية؛ ولا يجمع التطبيق بيانات قياس الاستخدام أو يرفع الوسائط المحلية أو يتطلب مفتاح API مدفوعًا للذكاء الاصطناعي."}],"issues":[{"priority":"P0","category":"التحقق من الخدمة المباشرة","title":"توفر ترجمات YouTube والفيديو","body":"واجه أحدث فحص مباشر شرط YouTube لتسجيل الدخول / التحقق من أن المستخدم ليس روبوتًا. لم يُثبت نجاح التنزيلات عبر الإنترنت في الظروف الحالية. يجب التحقق على الشبكة المقصودة وعلى عينة ممثلة من الفيديوهات قبل الإصدار العام."},{"priority":"P1","category":"قيود المنصة","title":"التضمين والفيديوهات المقيّدة بالحساب","body":"يمنع بعض الناشرين أو الفيديوهات التشغيل المضمّن. لم يُنفّذ تسجيل الدخول الموحّد Google SSO داخل التطبيق؛ ويستخدم اختصار المتصفح جلسة منفصلة لتسجيل الدخول والتشغيل. لا يجوز عرض هذه القيود على أنها حُلّت."},{"priority":"P1","category":"التوزيع والتوافق","title":"التوقيع والاختبار على أجهزة Mac إضافية","body":"الحزمة موقّعة بأسلوب ad-hoc، دون توثيق Developer ID. اختُبرت أجهزة Apple Silicon على macOS 26.5.2؛ ولم يُختبر macOS 27 أو أجهزة Mac بمعالجات Intel. macOS 14 هو الحد الأدنى المستهدف للنشر، وليس دليلًا على اختبار كل إصدار."},{"priority":"P2","category":"قيود التنسيق والجودة","title":"جودة التنزيل ودقة الترجمة النصية","body":"يستخدم الحفظ دفقًا كاملًا يجمع الصوت والفيديو، ولا يدمج تدفقات عالية الدقة منفصلة. يعتمد التشغيل المحلي على دعم برامج الترميز. وقد لا يحتفظ التحويل الاختياري باستخدام FFmpeg بالمسارات الصوتية الإضافية وHDR والترجمات المضمّنة. يستورد ASS/SSA النص فقط. قد تحتوي التسميات التوضيحية التلقائية والترجمات والمطابقة ثنائية اللغة المبنية على التوقيت على أخطاء."},{"priority":"P2","category":"غير منفّذ","title":"سجل التعلّم وأدوات الدراسة","body":"لم تُنفّذ استعادة سجل التشغيل، أو مجموعات المفردات، أو المراجعة المتباعدة، أو التعرّف البصري على النصوص OCR، أو استخراج الترجمة من الصور. حفظ تفضيلات اللغة لا يعني حفظ تقدّم التعلّم."},{"priority":"P2","category":"المراجعة التحريرية","title":"مراجعة اللغات بواسطة متحدثين أصليين","body":"اجتازت خيارات الواجهة الـ24 والشعارات المترجمة اختبارات تبديل اللغة. يثبت ذلك التغطية والسلوك، لكنه لا يثبت مراجعة احترافية لكل ترجمة بواسطة متحدث أصلي."}],"gallery":[{"id":"home","title":"الترحيب ومسار العمل الأساسي","caption":"إجراءات شريط الأدوات الأربعة، وقائمتا اختيار الترجمة الظاهرتان، والشعار المترجم، وحالة التعطيل الواضحة قبل فتح فيديو."},{"id":"study","title":"تدريب يركّز على الجملة","caption":"demo.mp4 — البحث عن الجمل، والانتقال بالنقر، والجملة السابقة / التالية، وإعادة التشغيل، والتكرار المستمر، وضبط السرعة، ومتابعة الجملة الحالية."},{"id":"languages","title":"الترجمة الأولى والثانية","caption":"لقطة فعلية للواجهة الإنجليزية تُظهر قائمتي الترجمة المستقلتين، بالإنجليزية والصينية التقليدية افتراضيًا."},{"id":"youtube","title":"فتح رابط YouTube","caption":"لقطة فعلية لنافذة الرابط في الواجهة الإنجليزية. يبدأ فتح الرابط التشغيل ويطلب زوج الترجمات المختار."}],"evidenceSummary":"اجتاز الإصدار 0.5.3 ما يلي: 105 فحوص أساسية، و138 اختبار تحقق للنموذج، و29 فحصًا للترجمات، و60 فحصًا لحفظ الفيديو، و317 اختبار تحقق للواجهة الأصلية. اختيرت جميع اللغات الـ24 من القائمة الفعلية؛ ورُوجعت الواجهة بست لغات والتخطيطات الضيقة بالألمانية.","evidenceLimit":"تم التحقق من التشغيل المحلي والتصدير وانتقالات الحالة ونوافذ الحفظ الأصلية. لا تثبت بيانات الاختبار دون اتصال واختبارات الحفظ بأداة مساعدة وهمية أن YouTube يسمح حاليًا بتنزيل الترجمات أو الفيديو عبر الإنترنت. لم تُستورد أي بيانات اعتماد للمستخدمين."},"hi":{"lang":"hi","name":"हिन्दी","direction":"ltr","headline":"AI की मदद से दुनिया की भाषाएँ तेज़ी से सीखें।","intro":"YouTube को भाषा सीखने की अपनी निजी कक्षा बनाएँ। अपने पसंदीदा वीडियो से सीखने के लिए YouTube के उपशीर्षक और स्वचालित अनुवाद इस्तेमाल करें: दो भाषाएँ साथ-साथ पढ़ें, हर वाक्य दोबारा चलाएँ और ज़रूरी सामग्री सहेजें।","badge":"इंटरफ़ेस की 24 भाषाएँ · बहुभाषी उपशीर्षक","notice":"संस्करण 0.5.3 · स्रोत कोड का पूर्वावलोकन · स्रोत से बिल्ड करें","labels":{"language":"दस्तावेज़ की भाषा","screenshots":"स्क्रीनशॉट","workflow":"शुरू करें","features":"उपलब्ध सुविधाएँ","highlights":"यह क्यों उपयोगी है","issues":"अनसुलझे मुद्दे और सीमाएँ","evidence":"किन बातों की पुष्टि हुई है","readme":"तकनीकी README","verification":"सत्यापन का विस्तृत रिकॉर्ड","markdown":"यह गाइड Markdown में डाउनलोड करें","preview":"स्क्रीनशॉट बड़ा करने के लिए क्लिक करें","close":"बंद करें","previous":"पिछला स्क्रीनशॉट","next":"अगला स्क्रीनशॉट","priority":"प्राथमिकता","category":"प्रकार","issue":"मुद्दा / अगला कदम","languageScope":"24 की संख्या इंटरफ़ेस के भाषा विकल्पों की है। उपशीर्षकों की भाषाएँ चुने हुए वीडियो के उपलब्ध ट्रैक पर निर्भर करती हैं; यह 24 भाषाओं में धाराप्रवाह होने का वादा नहीं है।","screenshotScope":"स्क्रीनशॉट वास्तविक 0.5.3 ऐप से लिए गए हैं। स्क्रीनशॉट की भाषा इस दस्तावेज़ की भाषा से अलग बताई गई है।","fallbackScreenshot":"अंग्रेज़ी इंटरफ़ेस वाले ऐप का स्क्रीनशॉट","localizedScreenshot":"इस भाषा में ऐप का स्क्रीनशॉट","license":"ऐप MIT लाइसेंस के अंतर्गत है; तृतीय-पक्ष घटकों की अपनी सूचनाएँ बरकरार हैं। AxonTube, YouTube, Google या Apple से संबद्ध नहीं है।","updated":"दस्तावेज़ की तारीख: 2026-10-11"},"steps":[{"title":"1. YouTube खोलें","body":"वीडियो का लिंक पेस्ट करें। उपलब्ध उपशीर्षकों का अनुरोध अपने-आप होता है: पहला ट्रैक अंग्रेज़ी और दूसरा पारंपरिक चीनी में। पहली बार मिलने में लगभग 1–2 मिनट लग सकते हैं; उपलब्धता की गारंटी नहीं है।"},{"title":"2. चुनें और अभ्यास करें","body":"उपशीर्षकों के दोनों दिखाई देने वाले ड्रॉपडाउन इस्तेमाल करें। किसी वाक्य पर पहुँचने के लिए उसे क्लिक करें, दोबारा चलाएँ या उसका लूप चालू करें।"},{"title":"3. सहेजें या निर्यात करें","body":"«वीडियो सहेजें» से सुलभ मीडिया और उपलब्ध उपशीर्षकों के लिए फ़ोल्डर चुनें। «द्विभाषी उपशीर्षक निर्यात करें» लोड किए गए उपशीर्षकों से Word, TXT या SRT बनाता है।"},{"title":"4. अपनी पसंद से सेट करें","body":"इंटरफ़ेस की भाषा, प्लेबैक गति, उपशीर्षकों का आकार और हर ट्रैक का समय-अंतर बदलें। ऐप इंटरफ़ेस और उपशीर्षकों के लिए चुनी गई भाषाएँ याद रखता है।"}],"features":[{"title":"उपशीर्षकों के दो स्वतंत्र ट्रैक","body":"डिफ़ॉल्ट भाषाएँ अंग्रेज़ी और पारंपरिक चीनी हैं; मौजूदा वीडियो के उपलब्ध मूल उपशीर्षकों और स्वचालित अनुवादों में से चुनें। दूसरा ट्रैक विफल होने पर भी सफलतापूर्वक लोड किया गया पहला ट्रैक इस्तेमाल किया जा सकता है।"},{"title":"वाक्य पर केंद्रित अभ्यास","body":"वाक्य खोज, क्लिक करके उस समय पर पहुँचना, पिछला / अगला वाक्य, दोबारा चलाना, लूप, प्लेबैक गति और मौजूदा वाक्य का अनुसरण करना।"},{"title":"समय से मेल खाते उपशीर्षकों के साथ वीडियो","body":"उपशीर्षक लोड होते समय भी सहेजना उपलब्ध रहता है। हर प्रक्रिया सुलभ वीडियो के लिए नया फ़ोल्डर बनाती है; उपशीर्षक उपलब्ध होने पर समय सहित SRT ट्रैक और द्विभाषी पठन फ़ाइलें जोड़ी जाती हैं। केवल वीडियो सहेजना भी समर्थित है। अधूरा काम .partial फ़ोल्डर में रहता है।"},{"title":"Word, TXT और SRT निर्यात","body":"समय-अंतर लागू करके उपलब्ध उपशीर्षक निर्यात करें। Word और TXT में पाठ को समय के ओवरलैप के आधार पर जोड़ा जाता है। अगर केवल एक ट्रैक लोड हुआ है, तब भी उसकी सामग्री निर्यात की जा सकती है।"},{"title":"24 भाषाओं में स्थानीयकृत इंटरफ़ेस","body":"मेन्यू, स्थिति संदेश और सीखने का नारा एक साथ भाषा बदलते हैं। अरबी और हिब्रू में दाएँ से बाएँ लेआउट उपलब्ध है; इंटरफ़ेस की भाषा बदलने से उपशीर्षकों का पाठ नहीं बदलता।"},{"title":"स्थानीय प्लेबैक और स्पष्ट नियंत्रण","body":"«फ़ाइल» मेन्यू से स्थानीय मीडिया और उपशीर्षक फ़ाइलें खोलें। निष्क्रिय कार्रवाइयाँ कारण सहित धुंधली दिखाई देती हैं; चुने गए मोड हाइलाइट और टिक से दिखते हैं; सहेजते समय व्यस्त होने की स्थिति दिखाई देती है।"}],"highlights":[{"title":"देखने से अभ्यास तक कुछ ही कदम","body":"टूलबार की चार कार्रवाइयाँ मुख्य प्रक्रिया सरल रखती हैं: YouTube → वीडियो सहेजें → उपशीर्षक → भाषा। उपशीर्षक पाने के लिए अलग बटन की ज़रूरत नहीं है।"},{"title":"सीखने की सामग्री जो आपके पास रहे","body":"समय सहित उपशीर्षक और पढ़ने योग्य
