<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AxonTube — Product Guide</title>
  <style>
    :root{--bg:#0b1017;--panel:#111b24;--card:#16222d;--line:#293b49;--text:#eaf3f5;--muted:#a4b8c4;--mint:#63e0b8;--gold:#fac77a;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:auto;scroll-padding-top:116px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--mint);text-decoration:none}a:hover{text-decoration:underline}button,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:4px}p{margin:0 0 16px}h1,h2,h3{line-height:1.25;margin:0 0 18px}h2{font-size:27px}h3{font-size:18px}img{max-width:100%;height:auto;display:block}section{scroll-margin-top:115px}header{position:sticky;top:0;z-index:5;background:#0b1017f2;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.topbar{max-width:1264px;padding:17px 30px;margin:auto;display:flex;align-items:center;gap:18px;justify-content:space-between}.brand{color:var(--text);font-size:24px;font-weight:750;letter-spacing:-.8px;display:flex;align-items:center;gap:12px}.brand svg{width:34px;height:34px}.language{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}select{max-width:210px;background:var(--card);color:var(--text);border:1px solid #4c6577;border-radius:9px;padding:9px 12px}main{max-width:1264px;margin:auto;padding:48px 30px 58px}.hero{display:grid;grid-template-columns:1.08fr 1fr;gap:44px;align-items:center;padding-bottom:38px}.eyebrow{color:var(--mint);font-size:13px;font-weight:650;margin-bottom:16px}h1{font-size:clamp(29px,3.1vw,44px);letter-spacing:-1.2px;max-width:24ch}.intro{font-size:17px;color:var(--muted);max-width:64ch}.notice{display:inline-flex;border:1px solid #426557;border-radius:99px;padding:6px 12px;color:#d2f5e8;font-size:12px;margin:10px 0 0}.hero-visual{padding:10px;border:1px solid #3b5a5b;background:linear-gradient(130deg,#143435,#102029);border-radius:20px;box-shadow:0 20px 70px #0004}.hero-visual img{border-radius:11px}.image-button{padding:0;background:none;border:0;width:100%;display:block;border-radius:11px;text-align:inherit}.image-button:hover{filter:brightness(1.06)}.nav{display:flex;flex-wrap:wrap;gap:10px;padding:24px 0 34px;border-top:1px solid var(--line)}.nav a{padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:#d4e3e9}.nav a:hover{border-color:var(--mint);text-decoration:none;color:var(--mint)}.section{margin:24px 0 56px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px}.small{font-size:13px;color:var(--muted)}.scope{border-inline-start:3px solid var(--mint);padding-inline-start:14px;font-size:14px;color:var(--muted);max-width:100ch}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:25px}.figure{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:0;background:var(--panel);display:flex;flex-direction:column}.figure .image-wrap{min-height:200px;padding:13px;background:#0b121a;display:flex;align-items:center}.figure img{width:100%;max-height:230px;object-fit:contain}.figure figcaption{padding:20px;font-size:14px;color:var(--muted)}.figure h3{font-size:16px;margin-bottom:9px;color:var(--text)}.image-language{display:block;margin-top:12px;color:var(--mint);font-size:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.card p{color:var(--muted);font-size:14px;margin:0}.features{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.number{font-size:12px;color:var(--mint);display:block;margin-bottom:13px;font-variant-numeric:tabular-nums}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.highlights .card{background:linear-gradient(145deg,#142e2e,var(--panel));border-color:#355752}.issues{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.issue-row{display:grid;grid-template-columns:72px 180px 1fr;gap:22px;padding:24px;border-bottom:1px solid var(--line);align-items:start;background:var(--panel)}.issue-row:last-child{border-bottom:0}.issue-head{background:#1b2a35;font-size:12px;font-weight:650;color:var(--muted);padding-top:14px;padding-bottom:14px}.priority{display:inline-block;font-size:12px;font-weight:750;border-radius:7px;padding:4px 10px}.p0{color:#ffb5b5;background:#472b33}.p1{color:var(--gold);background:#3b3427}.p2{color:#b1d3fb;background:#253749}.issue-kind{color:var(--muted);font-size:13px}.issue-row h3{font-size:16px;margin:0 0 9px}.issue-row p{font-size:14px;color:var(--muted);margin:0}.evidence{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px}.evidence .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}.metric{border:1px solid #314854;border-radius:12px;padding:13px}.metric strong{display:block;color:var(--mint);font-size:25px}.metric span{font-size:12px;color:var(--muted)}.evidence p{color:var(--muted)}.links{display:flex;flex-wrap:wrap;gap:12px 25px;font-size:14px;margin-top:25px}footer{border-top:1px solid var(--line);padding-top:24px;font-size:12px;color:var(--muted)}footer p{max-width:100ch}dialog{border:1px solid #476575;background:var(--bg);color:var(--text);border-radius:18px;padding:16px;width:min(96vw,1500px);max-height:96vh}dialog::backdrop{background:#000d}dialog .modalbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px}dialog button{border:1px solid var(--line);color:var(--text);background:var(--card);border-radius:8px;padding:7px 15px}dialog img{max-height:78vh;margin:auto;object-fit:contain}dialog p{font-size:13px;margin:14px 0 0;color:var(--muted)}[dir=rtl] h1{letter-spacing:0}[dir=rtl] .brand{letter-spacing:0}
    @media(max-width:1050px){.hero{gap:26px;grid-template-columns:1fr 1fr}.steps{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:1fr 1fr}.highlights{grid-template-columns:1fr}.issue-row{grid-template-columns:55px 145px 1fr;gap:16px}.topbar{padding:15px 24px}}
    @media(max-width:680px){main{padding:28px 18px}.topbar{padding:12px 18px;gap:8px}.brand{font-size:21px}.brand svg{width:27px}.language{gap:4px}.language label{display:none}select{max-width:150px;font-size:13px;padding:8px}.hero{grid-template-columns:1fr;gap:25px}.hero h1{max-width:none;font-size:33px}.hero .intro{font-size:16px}.nav{gap:8px}.nav a{font-size:12px;padding:7px 10px}.features,.steps,.gallery{grid-template-columns:1fr}.gallery .figure:first-child{grid-column:auto}.figure .image-wrap{min-height:120px}.figure img{max-height:350px}.section-head{display:block}.issue-row{grid-template-columns:48px 1fr;padding:20px 16px;gap:10px 16px}.issue-kind{grid-column:2;grid-row:1}.issue-body{grid-column:1/-1}.issue-head{display:none}.evidence{padding:20px}.evidence .metrics{grid-template-columns:repeat(3,1fr)}.metric strong{font-size:21px}.card{padding:22px}.section{margin-bottom:40px}}
    @media print{header{position:static}.hero{display:block}.hero-visual{max-width:600px;box-shadow:none}.nav,.language,dialog{display:none}.section{break-inside:avoid}body{font-size:11px}main{padding:20px}.card,.issue-row,.figure{break-inside:avoid}}
  </style>
</head>
<body>
  <header><div class="topbar"><a class="brand" href="#" aria-label="AxonTube"><svg aria-hidden="true" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="10" fill="#143732" stroke="#3c7d69"/><path d="M15 10L30 20 15 30Z" fill="#63e0b8"/><path d="M8 8L15 13M8 32L15 27M31 8L25 15M31 32L25 25" stroke="#63e0b8"/><g fill="#63e0b8"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="32" r="2"/><circle cx="31" cy="8" r="2"/><circle cx="31" cy="32" r="2"/></g></svg>AxonTube</a><div class="language"><label for="language"></label><select id="language"></select></div></div></header>
  <main id="content"></main>
  <dialog id="lightbox" aria-labelledby="modal-title" aria-describedby="modal-caption"><div class="modalbar"><strong id="modal-title"></strong><button type="button" id="close"></button></div><img id="modal-image" alt=""><p id="modal-caption"></p></dialog>
  <script id="guide-data" type="application/json">%%GUIDE_DATA%%</script>
  <script>
    'use strict';
    history.scrollRestoration='manual';
    const guides=JSON.parse(document.getElementById('guide-data').textContent);
    const screenshots={en:'en','zh-Hans':'zh','zh-Hant':'zh-Hant',ja:'ja',de:'de',ar:'ar'};
    const selector=document.getElementById('language');
    const dialog=document.getElementById('lightbox');
    const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const e=escapeHTML;
    for(const [code,guide] of Object.entries(guides)){const option=document.createElement('option');option.value=code;option.textContent=guide.name;selector.append(option)}
    let current='en';
    function imageInfo(item,lang){if(item.id==='home')return {src:'assets/interface-'+(screenshots[lang]||'en')+'.png',scope:guides[lang].labels[screenshots[lang]?'localizedScreenshot':'fallbackScreenshot']};return {src:'assets/'+({study:'interface-study.png',languages:'interface-caption-languages.png',youtube:'interface-youtube-dialog.png'}[item.id]),scope:guides[lang].labels.fallbackScreenshot}}
    function imageButton(item,lang,hero=false){const image=imageInfo(item,lang),size=item.id==='languages'?[1240,192]:item.id==='youtube'?[1240,380]:[2560,1640];return '<button class="image-button" type="button" data-image="'+e(item.id)+'" aria-label="'+e(item.title)+'"><img src="'+image.src+'" width="'+size[0]+'" height="'+size[1]+'" alt="'+e(item.title+' — '+image.scope)+'"'+(hero?' fetchpriority="high"':' loading="lazy"')+'></button>'}
    function render(lang){
      if(!guides[lang])lang='en';current=lang;const g=guides[lang],l=g.labels;document.documentElement.lang=lang;document.documentElement.dir=g.direction;document.title='AxonTube — '+l.features;document.querySelector('.brand').href='#'+lang;selector.value=lang;document.querySelector('label[for="language"]').textContent=l.language;selector.setAttribute('aria-label',l.language);document.getElementById('close').textContent=l.close;
      const cards=(items,numbered=false)=>items.map((item,i)=>'<article class="card">'+(numbered?'<span class="number">'+String(i+1).padStart(2,'0')+'</span>':'')+'<h3>'+e(item.title)+'</h3><p>'+e(item.body)+'</p></article>').join('');
      document.getElementById('content').innerHTML=
        '<section class="hero"><div><p class="eyebrow">'+e(g.badge)+'</p><h1>'+e(g.headline)+'</h1><p class="intro">'+e(g.intro)+'</p><p class="notice">'+e(g.notice)+'</p></div><div class="hero-visual">'+imageButton(g.gallery[0],lang,true)+'</div></section>'+
        '<nav class="nav" aria-label="'+e(l.features)+'">'+['screenshots','workflow','features','highlights','issues','evidence'].map(id=>'<a href="#'+lang+'/section-'+id+'">'+e(l[id])+'</a>').join('')+'</nav>'+
        '<section class="section" id="section-screenshots"><div class="section-head"><h2>'+e(l.screenshots)+'</h2><p class="small">'+e(l.preview)+'</p></div><p class="scope">'+e(l.screenshotScope)+'</p><div class="gallery">'+g.gallery.map(item=>'<figure class="figure"><div class="image-wrap">'+imageButton(item,lang)+'</div><figcaption><h3>'+e(item.title)+'</h3>'+e(item.caption)+'<span class="image-language">'+e(imageInfo(item,lang).scope)+'</span></figcaption></figure>').join('')+'</div></section>'+
        '<section class="section" id="section-workflow"><h2>'+e(l.workflow)+'</h2><div class="steps">'+cards(g.steps)+'</div></section>'+
        '<section class="section" id="section-features"><h2>'+e(l.features)+'</h2><p class="scope">'+e(l.languageScope)+'</p><div class="features">'+cards(g.features,true)+'</div></section>'+
        '<section class="section" id="section-highlights"><h2>'+e(l.highlights)+'</h2><div class="highlights">'+cards(g.highlights)+'</div></section>'+
        '<section class="section" id="section-issues"><h2>'+e(l.issues)+'</h2><div class="issues"><div class="issue-row issue-head"><span>'+e(l.priority)+'</span><span>'+e(l.category)+'</span><span>'+e(l.issue)+'</span></div>'+g.issues.map(item=>'<article class="issue-row"><span><span class="priority '+item.priority.toLowerCase()+'">'+item.priority+'</span></span><span class="issue-kind">'+e(item.category)+'</span><div class="issue-body"><h3>'+e(item.title)+'</h3><p>'+e(item.body)+'</p></div></article>').join('')+'</div></section>'+
        '<section class="section" id="section-evidence"><h2>'+e(l.evidence)+'</h2><div class="evidence"><p>'+e(g.evidenceSummary)+'</p><p>'+e(g.evidenceLimit)+'</p><div class="links"><a href="VERIFICATION.md">'+e(l.verification)+'</a><a href="../README.md">README · English</a><a href="../README.zh-CN.md">README · 简体中文</a><a href="guides/'+lang+'.md" download>'+e(l.markdown)+'</a></div></div></section>'+
        '<footer><p>'+e(l.license)+'</p><p>'+e(l.updated)+'</p></footer>';
      for(const button of document.querySelectorAll('[data-image]'))button.addEventListener('click',()=>{const item=g.gallery.find(item=>item.id===button.dataset.image),image=imageInfo(item,lang);document.getElementById('modal-title').textContent=item.title;const img=document.getElementById('modal-image');img.src=image.src;img.alt=item.title+' — '+image.scope;document.getElementById('modal-caption').textContent=item.caption+' — '+image.scope;dialog.showModal()});
      window.guideState={language:lang,sections:document.querySelectorAll('main section').length,screenshots:document.querySelectorAll('.gallery figure').length,features:g.features.length,issues:g.issues.length};
    }
    function route(){let parts;try{parts=decodeURIComponent(location.hash.slice(1)).split('/')}catch{parts=[]}return {lang:guides[parts[0]]?parts[0]:'en',section:parts[1]||''}}
    function applyRoute(){const target=route();if(current!==target.lang||!window.guideState)render(target.lang);if(target.section){document.getElementById(target.section)?.scrollIntoView()}else{window.scrollTo(0,0)}}
    selector.addEventListener('change',()=>{const pos=window.scrollY,section=route().section;render(selector.value);history.replaceState(null,'','#'+current+(section?'/'+section:''));if(section){document.getElementById(section)?.scrollIntoView()}else{window.scrollTo(0,pos)}});
    document.addEventListener('click',event=>{const link=event.target.closest('.nav a,.brand');if(!link)return;event.preventDefault();if(location.hash===link.hash)applyRoute();else location.hash=link.hash});
    document.getElementById('close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
    addEventListener('hashchange',applyRoute);
    applyRoute();
  </script>
</body>
</html>
